name: Egress audit
# cspell:words corepack println DOTENV readdir nomock pcaps toomanyrequests

# Proves at runtime, with the published API and web app images, what the Ever Platform modules
# (anonymous usage statistics, connection) may send: nothing at all when they are switched off or
# loaded but idle, and only the documented report when the statistics are on. The API runs with a
# throw-away PostgreSQL on Docker networks with no route out; CoreDNS is its only resolver and a
# capture sees every connection attempt and DNS query from before the process starts. The browser
# leg does the same for the web app: a real browser in its own sniffed namespace signs in, opens
# every route of the Angular router (tools/egress-audit/ui-routes.json) and fails the run when the
# UI looks up, requests or links an Ever host. Modes (tools/egress-audit/README.md):
#
#   off             both modules off (EVER_STATS_ENABLED=false in the container environment): no
#                   Ever host looked up or requested by the API or the browser, no connection
#                   attempt out, every statistics route 404, no new Ever link in the UI
#   off_env_file    the statistics switch written ONLY in the API's .env.local file (API leg)
#   loaded_off      both modules loaded (statistics on by configuration, then switched off by the
#                   operator in Settings; connection on, not connected): no call at all, in both legs
#   positive_stats  statistics on against the mock platform: reports accepted (202), no other call;
#                   the settings page's status request seen from the browser
#   control         positive_stats without the mock platform must FAIL, so a green run is not a
#                   blind one
#   every_trigger   both modules on against the mock platform and every trigger of every call
#                   exercised: the calls made are exactly the Gauzy rows of the contract this
#                   release makes (tools/ever-platform/outbound-calls.md), row for row
#   connect_off_sign_in_on  the connection off and the Ever ID sign-in plugin on with an issuer on
#                   an Ever host: the issuer is left unused, nothing looked up or sent, in both legs
#   entitlement_ladder  entitlement documents in grace, paused, issued in the future (refused) and
#                   slightly ahead (accepted): the ladder follows, Gauzy's own routes answer the
#                   same at every step, only the connection's documented calls are made
#   static-bundle   the built web app of the image names no Ever host the baseline does not have
#
# The static checks run on every pull request that touches code (no install but the harness):
# Ever hosts named outside the modules (tools/egress-audit/static-hostnames.mjs, a baseline that may
# only shrink), the modules' import boundary (tools/ever-platform/check-import-boundary.mjs and its
# ESLint rule), and the generated list of outbound calls (tools/ever-platform/outbound-calls.mjs).
#
# The harness is the egress audit of the SDK's dev tools (`ever-egress-audit` of
# `@ever-co/connect-tools`), installed with `npm ci` from tools/egress-audit/package-lock.json;
# nothing of it is copied into this repository.
#
# Runs every day on the newest published develop images (the demo images), on demand with any
# images, on pull requests into any branch but develop, and on every push to develop: the route list
# and baseline checks on every change, the audit itself when its inputs change. A pull request into
# develop starts no run (owner decision 2026-09-21, enforced by tools/scripts/pr-trigger-check.mjs):
# the run belongs to the merge, and the push it lands as compares the baselines with the develop it
# landed on, exactly as a pull request compares them with its base. The audit runs the published
# images: no code of a pull request runs in it.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      image:
        description: 'The Gauzy API image to audit'
        required: true
        default: 'ghcr.io/ever-co/gauzy-api-demo:latest'
      webapp_image:
        description: 'The Gauzy web app image to audit'
        required: true
        default: 'ghcr.io/ever-co/gauzy-webapp-demo:latest'
  pull_request:
    # Not for a pull request into develop (owner decision 2026-09-21): the push trigger below runs the
    # same checks when the change lands there. Pull requests aimed at other branches still run it.
    branches-ignore:
      - develop
    paths:
      - '.github/workflows/egress-audit.yml'
      - 'tools/egress-audit/**'
      - 'apps/gauzy/src/**'
      - 'packages/ui-*/**'
      - 'packages/plugin-ui/**'
      - 'packages/plugins/*-ui/**'
      - 'tools/ever-platform/**'
      - 'packages/**'
      - 'apps/**'
      - 'eslint.config.js'
      - '.env.sample'
      # The static checks read every text file of the tree (deploy files, environment files,
      # scripts): any change runs the inputs job; the audit itself still runs only when its own
      # inputs change (see "Run the audit?").
      - '**'
      - '**/package.json'
      - '**/yarn.lock'
      - '.github/workflows/**'
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/egress-audit.yml'
      - 'tools/egress-audit/**'
      - 'apps/gauzy/src/**'
      - 'packages/ui-*/**'
      - 'packages/plugin-ui/**'
      - 'packages/plugins/*-ui/**'
      - 'tools/ever-platform/**'
      - 'packages/**'
      - 'apps/**'
      - 'eslint.config.js'
      - '.env.sample'
      # The static checks read every text file of the tree (deploy files, environment files,
      # scripts): any change runs the inputs job; the audit itself still runs only when its own
      # inputs change (see "Run the audit?").
      - '**'
      - '**/package.json'
      - '**/yarn.lock'
      - '.github/workflows/**'

permissions:
  contents: read

# A push to develop gets a group of its own (its commit): GitHub keeps one pending run per group and
# replaces it with the next, so with one group per branch a push queued behind a long audit could be
# replaced by the push after it — which compares only with the commit before it, leaving the replaced
# push's baseline additions unchecked. Pull requests keep one group each and cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AUDIT_DIR: tools/egress-audit
  AUDIT_CONFIG: tools/egress-audit/egress-audit.config.json
  AUDIT_ARTIFACTS: egress-audit-artifacts
  # The baseline of Ever links the UI rendered before the modules (tools/egress-audit/ui-baseline.json)
  # may only shrink. It was adopted (--first-version) by the change that added it; from then on every
  # pull request compares it with its base. 'true' only in a change that adds a new baseline file.
  # A promotion into a branch that does not have the baseline yet (develop → stage, stage → master)
  # adopts it the same way without this switch: see "The baseline of Ever links only shrinks".
  BASELINE_FIRST_VERSION: 'false'
  # 'true' only in a change that makes the browser walk open routes it did not open before (a newer
  # harness or route generator): the baseline may then gain entries for those routes, and only for
  # links it already excused on other routes (tools/egress-audit/check-baseline-rewalk.mjs). The next
  # change sets it back to 'false'.
  BASELINE_REWALK: 'false'

jobs:
  inputs:
    name: egress-audit inputs
    # Never run jobs for a pull request from a fork (owner decision 2026-09-16); branch PRs, the
    # schedule and manual runs still run. GitHub-hosted: nothing here needs the self-hosted fleet.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      audit: ${{ steps.scope.outputs.audit }}
    steps:
      - name: Checkout (full history, for the baseline check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install the harness (tools/egress-audit/package-lock.json)
        run: npm ci --prefix "$AUDIT_DIR" --ignore-scripts --no-audit --no-fund

      # What the baselines are compared with: the base branch of a pull request, or the commit a push to
      # develop moved the branch from (a pull request into develop starts no run, so the push is where a
      # change into develop is checked). Empty for the schedule and manual runs, which compare nothing.
      - name: The base this run compares with
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          ref=""
          if [ "$EVENT" = "pull_request" ]; then
            ref="origin/$BASE_REF"
          elif [ "$EVENT" = "push" ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "::error::the push names no previous commit to compare the baselines with"; exit 1
            fi
            ref="$BEFORE"
          fi
          if [ -n "$ref" ]; then
            git rev-parse --verify --quiet "$ref^{commit}" > /dev/null || { echo "::error::the base $ref is not available"; exit 1; }
          fi
          echo "ref=$ref" | tee -a "$GITHUB_OUTPUT"

      - name: The route list is in step with the Angular router
        run: |
          node "$AUDIT_DIR/node_modules/@ever-co/connect-tools/dist/egress-audit/run.mjs" ui-routes \
            --framework angular --entry apps/gauzy/src/app/app.routes.ts --out "$AUDIT_DIR/ui-routes.json" --check

      - name: The baseline of Ever links only shrinks
        if: ${{ steps.base.outputs.ref != '' }}
        env:
          BASE: ${{ steps.base.outputs.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          flag=""
          if [ "$BASELINE_FIRST_VERSION" = "true" ]; then flag="--first-version"; fi
          # The base predates the baseline: a promotion pull request (develop → stage, stage → master)
          # into a branch no cascade has carried it to yet. Every change to it was already checked on
          # develop, push by push, so the promotion adopts it as its first version on that branch.
          # Nothing to re-walk against either. Only a promotion qualifies: any other pull request into
          # such a branch could bring entries develop never checked, so it keeps failing the plain check
          # below, and so does a baseline renamed in the config on a base that has this file.
          promotion=false
          case "$PR_BASE_REF:$PR_HEAD_REF" in
            stage:develop | master:stage) promotion=true ;;
          esac
          if [ "$promotion" = "true" ] && ! git cat-file -e "$BASE:$AUDIT_DIR/ui-baseline.json" 2> /dev/null; then
            echo "$BASE has no $AUDIT_DIR/ui-baseline.json yet: this change adopts it (--first-version)"
            node "$AUDIT_DIR/node_modules/@ever-co/connect-tools/dist/egress-audit/run.mjs" check-baseline-shrink \
              --base "$BASE" --config "$AUDIT_CONFIG" --first-version
            exit 0
          fi
          if [ "$BASELINE_REWALK" = "true" ]; then
            node "$AUDIT_DIR/node_modules/@ever-co/connect-tools/dist/egress-audit/run.mjs" check-baseline-shrink \
              --base "$BASE" --config "$AUDIT_CONFIG" $flag || echo "(the walk opens new routes: the entries they added are checked next)"
            git show "$BASE:$AUDIT_DIR/ui-baseline.json" > "$RUNNER_TEMP/ui-baseline.base.json"
            node tools/egress-audit/check-baseline-rewalk.mjs --base-file "$RUNNER_TEMP/ui-baseline.base.json"
          else
            node "$AUDIT_DIR/node_modules/@ever-co/connect-tools/dist/egress-audit/run.mjs" check-baseline-shrink \
              --base "$BASE" --config "$AUDIT_CONFIG" $flag
          fi

      - name: The mock platform's clock patch applies to the pinned harness, and does what it says
        run: node --test tools/egress-audit/patch-mock-clock.test.mjs

      - name: No Ever host named outside the Ever Platform modules beyond the baseline (sources)
        run: node --test tools/egress-audit/static-hostnames.test.mjs

      - name: The baseline of Ever hosts in the sources only shrinks
        if: ${{ steps.base.outputs.ref != '' }}
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          base_ref="$BASE"
          base_path="$AUDIT_DIR/static-hostnames.baseline.json"
          base_file="$RUNNER_TEMP/static-hostnames.base.json"
          git rev-parse --verify --quiet "$base_ref^{commit}" > /dev/null || { echo "::error::the base $base_ref is not available"; exit 1; }
          if git cat-file -e "$base_ref:$base_path" 2> /dev/null; then
            git show "$base_ref:$base_path" > "$base_file"
          else
            : > "$base_file" # the baseline is new in this change
          fi
          node tools/egress-audit/static-hostnames.mjs --check-shrink "$base_file"

      - name: The import boundary of the Ever Platform modules (scanner and ESLint rule)
        env:
          # The workspace's ESLint and parser versions, locked in tools/egress-audit/package-lock.json
          # and installed with the harness above (no workspace install).
          ESLINT_PREFIX: ${{ github.workspace }}/tools/egress-audit
          EVER_BOUNDARY_ESLINT_REQUIRED: 'true'
        run: |
          node --test tools/ever-platform/import-boundary.test.mjs

      - name: The list of outbound calls is the pinned contract's, and everything that repeats it agrees
        run: node --test tools/ever-platform/outbound-calls.test.mjs

      - name: No dependency on a private ever-co repository (the default branch must build for anyone)
        # On the push to develop, the schedule and manual runs: a pull request into develop starts no run
        # (owner decision 2026-09-21), and the branches other pull requests aim at may name private repositories.
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          node --test tools/ever-platform/check-private-deps.test.mjs
          node tools/ever-platform/check-private-deps.mjs

      - name: Run the audit?
        id: scope
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          # On a pull request and on a push to develop the audit runs only when its own inputs change: it
          # audits the published images, so a change elsewhere is audited once it is merged and built (the
          # daily run). The schedule and manual runs always audit.
          audit=true
          if [ -n "$BASE" ]; then
            if git diff --quiet "$BASE...HEAD" -- "$AUDIT_DIR" .github/workflows/egress-audit.yml; then audit=false; fi
          fi
          echo "audit=$audit" | tee -a "$GITHUB_OUTPUT"

  egress-audit:
    name: egress-audit (${{ matrix.mode }})
    needs: inputs
    if: ${{ !cancelled() && needs.inputs.result == 'success' && needs.inputs.outputs.audit == 'true' }}
    # GitHub-hosted on purpose: the capture needs Docker with NET_RAW and NET_ADMIN.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: 'off'
            run: off
            dotenv: api-empty.env
            expect: 0
          - mode: off_env_file
            run: off_env_file
            dotenv: api-stats-off.env
            expect: 0
          - mode: loaded_off
            run: loaded_off
            dotenv: api-empty.env
            expect: 0
          - mode: positive_stats
            run: positive_stats
            dotenv: api-empty.env
            expect: 0
          # positive_stats without the mock platform must report a violation (exit 1), so a green
          # run is never a blind one.
          - mode: control
            run: positive_stats
            args: --no-mock
            dotenv: api-empty.env
            expect: 1
          - mode: every_trigger
            run: every_trigger
            dotenv: api-empty.env
            expect: 0
          - mode: connect_off_sign_in_on
            run: connect_off_sign_in_on
            dotenv: api-empty.env
            expect: 0
          - mode: entitlement_ladder
            run: entitlement_ladder
            dotenv: api-empty.env
            expect: 0
    steps:
      - name: Free disk space for the images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Docker Hub images through Google's public mirror (Docker Hub falls back when it lacks one)
        run: |
          # The modes pull the same Docker Hub images in parallel from shared runner addresses, which
          # Docker Hub rate-limits; every image of the audit is pinned by digest, so the mirror serves
          # the same bytes.
          cfg=/etc/docker/daemon.json
          if [ -s "$cfg" ]; then current=$(cat "$cfg"); else current='{}'; fi
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee "$cfg" > /dev/null
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install the harness (tools/egress-audit/package-lock.json)
        run: |
          npm ci --prefix "$AUDIT_DIR" --ignore-scripts --no-audit --no-fund
          # The mock platform's rate limiter, made to survive the clock moves of entitlement_ladder
          # (the script says why, and refuses a harness it was not written for).
          node "$AUDIT_DIR/patch-mock-clock.mjs"
          harness="$PWD/$AUDIT_DIR/node_modules/@ever-co/connect-tools/dist/egress-audit/run.mjs"
          node "$harness" --help > /dev/null
          echo "EGRESS_AUDIT=$harness" >> "$GITHUB_ENV"

      - name: Pull the images
        env:
          IMAGE: ${{ github.event.inputs.image || 'ghcr.io/ever-co/gauzy-api-demo:latest' }}
          WEBAPP_IMAGE: ${{ github.event.inputs.webapp_image || 'ghcr.io/ever-co/gauzy-webapp-demo:latest' }}
        run: |
          pull() { for attempt in 1 2 3 4 5; do docker pull -q "$1" && return 0; sleep $((attempt * 20)); done; return 1; }
          pull "$IMAGE"
          pull "$WEBAPP_IMAGE"
          # The throw-away database. public.ecr.aws refuses anonymous pulls from GitHub's shared runner
          # addresses once their data allowance is spent ("toomanyrequests: Data limit exceeded"), so
          # Google's mirror of Docker Hub's official images is the fallback, tagged with the name the
          # compose file uses (nothing pulls an image that is already present).
          postgres=public.ecr.aws/docker/library/postgres:18-alpine
          if ! docker pull -q "$postgres"; then
            echo "::warning::$postgres could not be pulled; using mirror.gcr.io/library/postgres:18-alpine"
            pull mirror.gcr.io/library/postgres:18-alpine
            docker tag mirror.gcr.io/library/postgres:18-alpine "$postgres"
          fi
          # The harness's own images (CoreDNS, the sniffer, the namespace holder, the driver and the
          # browser), read from the installed harness so they follow its pins.
          dist="$AUDIT_DIR/node_modules/@ever-co/connect-tools/dist"
          for ref in $(grep -rhoE '[a-z0-9./_-]+:[a-z0-9._-]+@sha256:[a-f0-9]{64}' "$dist/egress-audit/lib" "$dist/egress-audit/compose.audit.yml" | sort -u); do pull "$ref"; done
          for ref in $(sed -n 's/^FROM \([^ ]*\).*/\1/p' "$dist/mock-platform/Dockerfile" | sort -u); do pull "$ref"; done
          echo "GAUZY_API_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "GAUZY_WEBAPP_IMAGE=$WEBAPP_IMAGE" >> "$GITHUB_ENV"
          commit=$(docker image inspect "$IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^GAUZY_APP_COMMIT=//p')
          echo "The API image was built from commit ${commit:-<unknown>}." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "The web app image is $(docker image inspect "$WEBAPP_IMAGE" --format '{{index .RepoDigests 0}}')." | tee -a "$GITHUB_STEP_SUMMARY"
          df -h /

      - name: The web app image serves its page (outside the audit, so a broken image is named here)
        run: |
          docker run -d --name webapp-smoke -e API_BASE_URL=http://api:3000 -e CLIENT_BASE_URL=http://webapp:4200 -p 127.0.0.1:4299:4200 "$GAUZY_WEBAPP_IMAGE" > /dev/null
          ok=false
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:4299/; then ok=true; break; fi
            sleep 3
          done
          docker logs webapp-smoke 2>&1 | grep -v '^+ ' | tail -20 || true
          docker rm -f webapp-smoke > /dev/null
          if [ "$ok" != true ]; then echo "::error::the web app image did not serve its page within 3 minutes (port 4200 of the container, published as 127.0.0.1:4299)"; exit 1; fi
          echo "The web app image serves its page."

      - name: Write the API .env.local files of the modes, and a secret for this run
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "GAUZY_AUDIT_SECRET=$secret" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/api-empty.env"
          printf 'EVER_STATS_ENABLED=false\n' > "$RUNNER_TEMP/api-stats-off.env"

      - name: 'Audit: ${{ matrix.mode }}'
        env:
          GAUZY_AUDIT_DOTENV: ${{ runner.temp }}/${{ matrix.dotenv }}
          RUN_MODE: ${{ matrix.run }}
          RUN_ARGS: ${{ matrix.args }}
          EXPECT: ${{ matrix.expect }}
          # Names added to the never-allowed list for this run, kept out of the public files: from a
          # secret, so the logs mask them, and the reports name them extra#<n>. Empty when unset.
          EVER_EGRESS_EXTRA_HOSTS: ${{ secrets.EVER_EGRESS_EXTRA_HOSTS }}
        run: |
          set +e
          node "$EGRESS_AUDIT" --config "$AUDIT_CONFIG" --mode "$RUN_MODE" $RUN_ARGS --artifacts "$AUDIT_ARTIFACTS" --verbose
          code=$?
          set -e
          if [ "$code" -ne "$EXPECT" ]; then
            if [ "$EXPECT" -eq 1 ]; then
              echo "::error::without the mock platform the audit must report a violation (exit 1); it exited $code, so a green run could be a blind one"
            else
              echo "::error::the audit exited $code (1: a violation, 2: a fault that proves nothing); see report.json in the artifact"
            fi
            exit 1
          fi
          if [ "$EXPECT" -eq 1 ]; then echo "The control failed as it must (exit 1)."; fi

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          MODE: ${{ matrix.mode }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = process.env.AUDIT_ARTIFACTS;
            const rows = ["| Run | Exit | Violations | Faults | DNS queries | Connection attempts | Calls | Browser: routes loaded, HAR entries, DOM refs (baselined) |", "|---|---|---|---|---|---|---|---|"];
            for (const run of fs.existsSync(dir) ? fs.readdirSync(dir).sort() : []) {
              const file = path.join(dir, run, "report.json");
              if (!fs.existsSync(file)) continue;
              const r = JSON.parse(fs.readFileSync(file, "utf8"));
              const rules = Object.entries(r.summary.rules ?? {}).map(([k, v]) => `${k}: ${v}`).join(", ") || "none";
              const b = r.summary.browser;
              const browser = b ? (b.leg === "ran" ? `${b.loaded}/${b.visits}, ${b.checks.f.entries}, ${b.checks.g.refs} (${b.checks.g.baselined})` : b.leg ?? "-") : "-";
              rows.push(`| ${run} | ${r.exit} | ${rules} | ${(r.faults ?? []).length} | ${r.summary.dns_queries} | ${r.summary.connection_attempts} | ${r.summary.calls ? r.summary.calls.join(", ") || "none" : "-"} | ${browser} |`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Egress audit: ${process.env.MODE}\n\n${rows.join("\n")}\n\nThe control (positive_stats-nomock) must exit 1.\n`);
          '

      - name: Upload the evidence (pcaps, DNS logs, HAR, reports)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: egress-audit-${{ matrix.mode }}
          path: ${{ env.AUDIT_ARTIFACTS }}
          retention-days: 14

  static-bundle:
    name: egress-audit (static-bundle)
    needs: inputs
    if: ${{ !cancelled() && needs.inputs.result == 'success' && needs.inputs.outputs.audit == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install the harness (tools/egress-audit/package-lock.json)
        run: npm ci --prefix "$AUDIT_DIR" --ignore-scripts --no-audit --no-fund

      - name: The built web app names no Ever host beyond the baseline
        # bash with pipefail, so the scan's exit code survives the tee.
        shell: bash
        env:
          WEBAPP_IMAGE: ${{ github.event.inputs.webapp_image || 'ghcr.io/ever-co/gauzy-webapp-demo:latest' }}
        run: |
          pull() { for attempt in 1 2 3 4 5; do docker pull -q "$1" && return 0; sleep $((attempt * 20)); done; echo "::error::could not pull $1"; return 1; }
          pull "$WEBAPP_IMAGE"
          echo "The web app image is $(docker image inspect "$WEBAPP_IMAGE" --format '{{index .RepoDigests 0}}')." | tee -a "$GITHUB_STEP_SUMMARY"
          id=$(docker create "$WEBAPP_IMAGE")
          docker cp "$id:/srv/gauzy" "$RUNNER_TEMP/webapp"
          docker rm "$id" > /dev/null
          node tools/egress-audit/static-hostnames.mjs --bundle "$RUNNER_TEMP/webapp" | tee -a "$GITHUB_STEP_SUMMARY"
