name: Release Prod

on:
  push:
    branches:
      - master

concurrency:
  # Serialize releases on a ref, but NEVER cancel one: this job takes about a minute, so
  # superseding it saves nothing — and cancelling it silently breaks the delivery chain.
  # The image build is wired to this workflow with
  #   workflow_run: types: [completed]   +   if: workflow_run.conclusion == 'success'
  # so a CANCELLED release makes its image build SKIP. If that happens to the last release
  # of a burst, no image is published for the new code at all and the environment keeps
  # serving the previous image until somebody pushes again (demo sat a day behind exactly
  # this way on 2026-08-20).
  #
  # Superseding still happens where the time actually goes: `build.yml` and the image
  # builds cancel their own older runs, so a burst of merges still produces exactly ONE
  # full compile and ONE published image — the newest.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege scope for the automatic GITHUB_TOKEN.
# `contents: write` is required: the release action creates the version tag together with
# the GitHub release that the downstream image/desktop builds key off.
permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    strategy:
      matrix:
        os: ["${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-24.04' }}"]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      # Calculate ONLY — `dry_run` means no tag is pushed here. The release step below
      # creates the tag together with the release, so there is never a window in which a
      # tag exists without its release (a cancelled run used to strand one forever: the
      # next run computes the NEXT version and never backfills the orphan).
      - name: Calculate the next version (no tag pushed)
        uses: mathieudutour/github-tag-action@v7
        id: tag_version
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          release_branches: master,main,develop,stage
          pre_release_branches: something_to_possible_use_later
          # v7 analyzes commits as Conventional Commits by default, v6 analyzed them as Angular
          # (`feat!:` was a patch there and is a major in v7). Angular keeps the version math as it was.
          commit_analyzer_preset: angular

      # v6 always returned a version: with no eligible commit since the newest tag it still applied
      # default_bump (patch). v7 returns an empty new_tag instead - e.g. when this branch is
      # fast-forwarded to a commit that is already behind the newest tag - and the release step
      # below would then fail and skip every build keyed off this workflow. In that case only, this
      # second calculation forces the patch bump v6 made.
      - name: Calculate the next version - patch fallback (no tag pushed)
        if: steps.tag_version.outputs.new_tag == ''
        uses: mathieudutour/github-tag-action@v7
        id: tag_version_fallback
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          release_branches: master,main,develop,stage
          pre_release_branches: something_to_possible_use_later
          commit_analyzer_preset: angular
          force_bump: patch

      # GitHub refuses a release body over 125 000 characters (422 "body is too long"). With
      # `generateReleaseNotes` the action appended GitHub's list of every PR since the previous full
      # release, and the first production release after the 2026-10 stage-only period (v111.138.2,
      # ~3 700 commits since v111.48.2) failed on exactly that. The same notes are built here instead:
      # the changelog, then GitHub's generated list, cut at a line boundary below the limit, with a
      # link to the full comparison.
      - name: Release notes within GitHub's 125 000-character limit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag || steps.tag_version_fallback.outputs.new_tag }}
          CHANGELOG: ${{ steps.tag_version.outputs.changelog || steps.tag_version_fallback.outputs.changelog }}
        run: |
          set -u
          limit=120000
          prev=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          args=(-f tag_name="$NEW_TAG" -f target_commitish="$GITHUB_SHA")
          if [ -n "$prev" ] && [ "$prev" != "$NEW_TAG" ]; then
            args+=(-f previous_tag_name="$prev")
          fi
          generated=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${args[@]}" --jq .body 2>/dev/null || true)
          { printf '%s\n\n' "$CHANGELOG"; printf '%s\n' "$generated"; } > release-body.md
          if [ "$(wc -c < release-body.md)" -gt "$limit" ]; then
            # Cut by bytes, then drop the last (possibly split) line so no UTF-8 character is broken.
            head -c "$limit" release-body.md | sed '$d' > release-body.cut
            {
              cat release-body.cut
              printf '\n(List truncated to fit the GitHub release-notes limit.)'
              if [ -n "$prev" ]; then
                printf ' Full comparison: %s/%s/compare/%s...%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$NEW_TAG"
              fi
              printf '\n'
            } > release-body.md
            echo "::notice::Release notes truncated to ${limit} bytes (the generated list was longer)."
          fi

      - name: Create the tag and the GitHub release (one call)
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          # The notes are built, and kept under the size limit, by the step above.
          generateReleaseNotes: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag_version.outputs.new_tag || steps.tag_version_fallback.outputs.new_tag }}
          # Create the tag as part of this call, pinned to the commit that was built.
          commit: ${{ github.sha }}
          name: ${{ steps.tag_version.outputs.new_tag || steps.tag_version_fallback.outputs.new_tag }}
          bodyFile: release-body.md
