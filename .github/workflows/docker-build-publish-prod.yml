  gauzy-worker:
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: relver
        run: |
          # Only the tag that points AT the built commit — no `git describe` fallback,
          # which would surface a stale ancestor tag as this build's version. When the
          # commit is untagged the footer shows the commit alone (accurate).
          VERSION=$(git tag --points-at HEAD | grep -E '^v[0-9]' | sort -V | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION:-<none>}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.deploy/worker/Dockerfile
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ever-co/gauzy-worker:latest
            everco/gauzy-worker:latest
            registry.digitalocean.com/ever/gauzy-worker:latest
            ${{ secrets.CW_DOCKER_REGISTRY }}/ever-co/gauzy-worker:latest
          cache-from: type=registry,ref=ghcr.io/ever-co/gauzy-worker:latest
          cache-to: type=inline
          build-args: |
            NODE_ENV=production
            DEMO=false
            NX_BRANCH=${{ github.ref_name }}
            GAUZY_APP_VERSION=${{ steps.relver.outputs.version }}
            GAUZY_APP_COMMIT=${{ github.sha }}
          # VERDACCIO_TOKEN / NX_CLOUD_ACCESS_TOKEN are BuildKit build secrets (mounted
          # per-RUN, never embedded in image layers) — see the Dockerfile header.
          # WORKER_* build-args were dropped: they never reached the image (the global
          # ARGs were not re-declared in the production stage, so the image always baked
          # the literal defaults) — k8s manifests set WORKER_* at runtime.
          secrets: |
            VERDACCIO_TOKEN=${{ secrets.VERDACCIO_TOKEN }}
            NX_CLOUD_ACCESS_TOKEN=${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Docker images list
        run: |
          sudo docker image list

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub Registry
        run: |
          docker push everco/gauzy-worker:latest

      - name: Install doctl
        if: ${{ vars.DO_ENABLED == 'true' }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: doctl registry login --expiry-seconds 3600

      - name: Push to DigitalOcean Registry
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: |
          docker push registry.digitalocean.com/ever/gauzy-worker:latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Github Registry
        run: |
          docker push ghcr.io/ever-co/gauzy-worker:latest

