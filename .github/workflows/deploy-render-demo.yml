name: Deploy to Render Demo

on:
  workflow_run:
    workflows: ['Build and Publish Docker Images Demo']
    branches:
      - render
    types:
      - completed

# Least-privilege scope for the automatic GITHUB_TOKEN.
# This workflow only builds/tests/deploys from a checkout — read access is sufficient.
concurrency:
  # Collapse superseded runs WITHOUT interrupting one that is already applying: GitHub
  # keeps a single pending run per group, so a newer commit replaces the one waiting
  # while the in-flight deploy finishes. `cancel-in-progress: true` is deliberately NOT
  # used here — killing a rollout mid-apply can leave the target half-updated.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-demo:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 300

    environment: demo

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Render CLI
        run: |
          wget  -O render https://github.com/render-oss/render-cli/releases/download/v0.1.8/render-linux-x86_64
          chmod +x render
          sudo mv render /usr/local/bin/render
          mkdir ~/.render
          cat << EOF > ~/.render/config.yaml
                version: 1
                sshPreserveHosts: true
                profiles:
                  default:
                    defaultRegion: oregon
                    apiKey: ${{ secrets.RENDER_API_KEY }}
                  demo:
                    defaultRegion: oregon
                    apiKey: ${{ secrets.RENDER_API_KEY }}
                EOF

      - name: Deploy Services
        run: |
          cp .render/render.demo.yaml ./render.yaml
          render blueprint launch --profile demo
