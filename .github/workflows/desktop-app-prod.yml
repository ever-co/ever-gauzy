          DESKTOP_APP_REPO_NAME: 'ever-gauzy-desktop'
          DESKTOP_APP_REPO_OWNER: 'ever-co'
          COMPANY_SITE_LINK: 'https://gauzy.co'
          DESKTOP_APP_DESCRIPTION: 'Gauzy Desktop'
          DESKTOP_APP_ID: 'com.ever.gauzydesktop'

