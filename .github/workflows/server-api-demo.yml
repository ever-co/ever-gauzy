name: Server API App Build Demo

# The packaged desktop & server demo apps are built ONLY when 'develop' is promoted to the
# 'local-apps' branch. The build version is resolved at build time
# (.scripts/bump-version-electron.js) from the release tag of the promoted commit (on HEAD, or on the merge parent for PR-merge promotions), which
# 'Release Demo' creates on every merge to 'develop'.
on:
  push:
    branches:
      - local-apps
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check-release-tag:
    # Only build when the promoted commit carries a release tag (the version stamped into the
    # packages - see header comment). 'local-apps' is promoted from 'develop' either by
    # fast-forwarding to the tagged 'develop' commit (tag on HEAD) or by merging the
    # 'develop' -> 'local-apps' promotion PR (the tag then points at the merged
    # 'develop' tip, HEAD^2). Retries absorb the short delay until 'Release Demo' tags
    # the 'develop' commit.
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      # The resolved vX.Y.Z release tag; the build jobs stamp exactly this version.
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Depth 2 so HEAD^2 resolves on merge-commit promotions
          fetch-depth: 2

      - name: Verify a release tag points at the promoted commit
        id: resolve
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "local-apps" ]; then
            echo "::error::This workflow only releases from the 'local-apps' branch (got '$GITHUB_REF_NAME')."
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          # Present only when the promotion PR was merged as a merge commit; the release tag
          # then points at the merged 'develop' tip, not at the merge commit itself.
          PARENT2_SHA=$(git rev-parse --verify --quiet 'HEAD^2' || true)
          resolve_tag() {
            # Highest vX.Y.Z tag pointing at $1 in the remote listing (peeled '^{}' entries
            # carry the commit sha of annotated tags); empty when none match.
            printf '%s\n' "$REMOTE_REFS" | awk -v sha="$1" '
              $1 == sha && $2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+(\^\{\})?$/ {
                t = $2
                sub(/^refs\/tags\//, "", t)
                sub(/\^\{\}$/, "", t)
                print t
              }' | sort -V | tail -n 1
          }
          for i in $(seq 1 20); do
            if REMOTE_REFS=$(git ls-remote origin refs/heads/develop 'refs/tags/*'); then
              SRC_TIP=$(printf '%s\n' "$REMOTE_REFS" | awk -v ref="refs/heads/develop" '$2 == ref { print $1 }')
              TAG=$(resolve_tag "$HEAD_SHA")
              # Accept the merge-parent tag only when HEAD^2 is the current 'develop' tip -
              # i.e. this is the promotion merge of 'develop', not an arbitrary tagged branch
              # merged in, nor a fast-forward racing 'Release Demo' (whose tag lands on HEAD).
              if [ -z "$TAG" ] && [ -n "$PARENT2_SHA" ] && [ "$PARENT2_SHA" = "$SRC_TIP" ]; then
                TAG=$(resolve_tag "$PARENT2_SHA")
              fi
              if [ -n "$TAG" ]; then
                echo "Release tag on the promoted commit: $TAG"
                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "git ls-remote failed (attempt $i); will retry"
            fi
            echo "No release tag points at this commit or its merge parent yet (attempt $i/20); retrying in 30s..."
            sleep 30
          done
          echo "::error::No release tag points at this commit, and its merge parent does not match the tagged 'develop' tip. Promote by merging the 'develop' -> 'local-apps' PR (or fast-forwarding: git push origin origin/develop:local-apps) after 'Release Demo' has created the tag; if 'develop' has moved since the promotion PR was opened, re-promote."
          exit 1

  release-windows:
    needs: check-release-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    strategy:
      matrix:
        os: [[self-hosted, Windows, X64]]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Selective cleanup (preserve .nx/cache)
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          # Stop NX daemon first to release file locks before cleanup (guard for fresh runners without Node)
          if (Get-Command npx -ErrorAction SilentlyContinue) { npx nx daemon --stop 2>&1 | Out-Null }
          # Remove build artifacts but keep NX cache for faster rebuilds
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" }
          exit 0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0

      - name: Install Visual Studio 2022 Build Tools (VCTools)
        shell: powershell
        run: |
          choco install -y visualstudio2022buildtools --execution-timeout=21600 --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional --passive --norestart"

      - name: Configure node-gyp to use VS 2022
        shell: powershell
        run: |
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Append
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools

      - name: Setup MSVC (VS 2022 dev env)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install latest version of NPM
        run: 'npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure npm python for node-gyp
        shell: powershell
        run: |
          $py = (Get-Command python.exe).Source
          Write-Host "python is: $py"
          "npm_config_python=$py" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYTHON=$py"            | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Registry
        shell: bash
        run: |
          # Registry selection is CONDITIONAL on where this job runs.
          #
          # The public Cloudflare-fronted route https://packages.ever.co intermittently TRUNCATES
          # large tarballs mid-stream. Measured 2026-08-16 on
          # @rspack/binding-win32-arm64-msvc@1.7.6: 9,525,323 bytes from packages.ever.co against
          # 14,590,565 bytes (byte-exact) from BOTH the internal VIP and npmjs. The route sustains
          # only ~280 KB/s, and a single release-windows-arm64 job logged 12 "unexpected end of
          # file" errors against it.
          #
          # The truncation is UNDETECTABLE by the client: Cloudflare always sends
          # "Accept-Encoding: gzip" to the origin, Verdaccio then re-gzips the already-gzipped
          # .tgz, which drops Content-Length in favour of chunked encoding. A cut stream is
          # therefore not a short read but a complete-looking HTTP 200 whose body fails gunzip,
          # and Range requests are ignored so there is no resume and no length cross-check.
          #
          # Jobs in this repo run on a MIX of runners:
          #   in-network - [self-hosted, Windows, X64] and the ever-k8s ARC pools
          #   external   - windows-11-arm, ubicloud-*-arm, cirruslabs macOS, ubuntu-latest
          # Only in-network runners can reach the VIP, and the internal cache buys an external
          # runner nothing while adding a failure mode. The choice is therefore made by PROBING
          # the VIP rather than by hardcoding a runner list, because release-linux runs on
          # "vars.RUNNER_LINUX_APPS_X64 or ubuntu-latest" and so is not statically known.
          #
          # NO-REMOVAL RULE: the packages.ever.co path below is GATED, not deleted. Set the
          # repo/org variable VERDACCIO_FORCE_PUBLIC=true to bring it back.

          # Start from a known state. The self-hosted Windows jobs check out with clean: false and
          # their cleanup step removes only dist/ and node_modules/, so registry edits from a
          # PREVIOUS run can still be on disk. .yarnrc in particular is untracked and un-ignored,
          # so nothing restores it: a stale "registry" line from an earlier run would silently
          # win over this run's decision and point the install at a registry we just rejected.
          rm -f .yarnrc .npmrc.bak yarn.lock.bak
          git checkout -- .npmrc yarn.lock 2>/dev/null || true

          # Two attempts: a single transient miss (this fleet has a recurring MetalLB speaker
          # flap) should not demote an in-network runner to the public registry for a whole build.
          REGISTRY=""
          if [ -n "$VERDACCIO_REGISTRY" ]; then
            for attempt in 1 2; do
              if curl -fsS --connect-timeout 5 --max-time 15 -o /dev/null "${VERDACCIO_REGISTRY%/}/-/ping"; then
                REGISTRY="${VERDACCIO_REGISTRY%/}/"
                echo "Verdaccio VIP is reachable (attempt $attempt) - using the internal npm cache."
                break
              fi
              [ "$attempt" = "1" ] && sleep 3
            done
          fi
          if [ -z "$REGISTRY" ] && [ "$VERDACCIO_FORCE_PUBLIC" = "true" ] && [ -n "$VERDACCIO_TOKEN" ]; then
            REGISTRY="https://packages.ever.co/"
            echo "::warning title=Verdaccio public route in use::VERDACCIO_FORCE_PUBLIC=true - installing through packages.ever.co, which is known to truncate large tarballs mid-stream."
            echo "//packages.ever.co/:_authToken=$VERDACCIO_TOKEN" >> .npmrc
            echo "always-auth=true" >> .npmrc
          fi
          if [ -n "$REGISTRY" ]; then
            echo "registry=$REGISTRY" >> .npmrc
            echo "registry \"$REGISTRY\"" >> .yarnrc
            sed -i.bak "s|https://registry.yarnpkg.com|${REGISTRY%/}|g" yarn.lock
            sed -i.bak "s|https://registry.npmjs.org|${REGISTRY%/}|g" yarn.lock
            rm -f yarn.lock.bak
          elif [ "$VERDACCIO_FORCE_PUBLIC" = "true" ]; then
            # Asked for the public route but no token to authenticate with: say so, rather than
            # blaming the VIP for a path we never even probed for.
            echo "::warning title=VERDACCIO_FORCE_PUBLIC set without a token::VERDACCIO_TOKEN is empty, so packages.ever.co cannot be used; resolving from the public npm registry instead."
          else
            echo "Verdaccio VIP is not reachable from this runner - resolving from the public npm registry."
            # An EXTERNAL runner failing the probe is the designed outcome and stays quiet. An
            # IN-NETWORK runner failing it means the internal cache is silently unavailable, so
            # surface it on the run summary. Deliberately a warning, not a failure: a cache blip
            # must never redden a release pipeline that npmjs can serve correctly.
            if [ "$EXPECT_VIP" = "true" ]; then
              echo "::warning title=Verdaccio VIP unreachable from an in-network runner::${RUNNER_NAME:-unknown} fell back to the public npm registry; the internal cache was expected to be reachable here."
            fi
          fi
          echo "Using npm registry: ${REGISTRY:-https://registry.yarnpkg.com/ (repo default)}"
        env:
          VERDACCIO_REGISTRY: ${{ vars.VERDACCIO_REGISTRY }}
          VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
          VERDACCIO_FORCE_PUBLIC: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          # true only for the 18 [self-hosted, Windows, X64] jobs. ubicloud and cirruslabs
          # runners also report RUNNER_ENVIRONMENT=self-hosted, so that variable cannot be used
          # as the discriminator here without firing false warnings on 24 external jobs.
          EXPECT_VIP: ${{ contains(matrix.os, 'self-hosted') }}

      - name: Install Yarn dependencies
        run: 'yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts'

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump server version
        uses: actions/github-script@v8
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.serverapi(false))
        env:
          GAUZY_RELEASE_TAG: ${{ needs.check-release-tag.outputs.tag }}
          PROJECT_REPO: 'https://github.com/ever-co/ever-gauzy.git'
          DESKTOP_API_SERVER_APP_NAME: 'gauzy-api-server'
          # Demo electron releases go to the same repo
          DESKTOP_API_SERVER_REPO_NAME: 'ever-gauzy'
          DESKTOP_API_SERVER_REPO_OWNER: 'ever-co'
          COMPANY_SITE_LINK: 'https://gauzy.co'
          DESKTOP_API_SERVER_APP_DESCRIPTION: 'Gauzy API Server'
          DESKTOP_API_SERVER_APP_ID: 'com.ever.gauzyapiserver'

      - name: Fix Node.js PATH for child processes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $nodeExe = (Get-Command node -ErrorAction Stop).Source
          $nodePath = Split-Path $nodeExe -Parent
          $npmGlobalBin = & npm config get prefix
          $localBin = Join-Path $PWD "node_modules\.bin"
          $yarnCmd = Get-Command yarn -ErrorAction SilentlyContinue
          $yarnPath = if ($yarnCmd) { Split-Path $yarnCmd.Source -Parent } else { "" }

          $npmNodeExe = Join-Path $npmGlobalBin "node.exe"
          if (-not (Test-Path $npmNodeExe)) { Copy-Item $nodeExe $npmNodeExe -Force }

          $localNodeExe = Join-Path $localBin "node.exe"
          if (-not (Test-Path $localNodeExe)) { Copy-Item $nodeExe $localNodeExe -Force }

          $newPath = "$nodePath;$npmGlobalBin;$localBin;$yarnPath;$($env:PATH)"
          "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          @($nodePath, $npmGlobalBin, $localBin, $yarnPath) | Where-Object { $_ } | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

          "NODE=$nodeExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NODE_PATH=$nodePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $env:PATH = $newPath
          [System.Environment]::SetEnvironmentVariable("PATH", $newPath, "Process")

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      - name: Increase file handle limits
        shell: powershell
        run: |
          # Increase Node.js UV threadpool for parallel I/O (default is 4)
          "UV_THREADPOOL_SIZE=32" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Patch graceful-fs to retry EMFILE errors with backoff
          node -e "try { var gfs = require('graceful-fs'); gfs.gracefulify(require('fs')); console.log('graceful-fs patched'); } catch(e) { console.log('graceful-fs not available, skipping'); }"

      - name: Reset NX
        shell: powershell
        run: npx nx reset

      - name: Build Server
        shell: cmd
        run: 'yarn build:gauzy-api-server:windows:release:gh:x64'
        env:
          USE_HARD_LINKS: false
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: '${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}'
          SENTRY_PROFILE_SAMPLE_RATE: '${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}'
          SENTRY_HTTP_TRACING_ENABLED: '${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}'
          SENTRY_POSTGRES_TRACKING_ENABLED: '${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}'
          SENTRY_PROFILING_ENABLED: '${{ secrets.SENTRY_PROFILING_ENABLED }}'
          NX_NO_CLOUD: true
          NX_PLUGIN_NO_TIMEOUTS: true
          NX_DAEMON: false
          PROJECT_REPO: 'https://github.com/ever-co/ever-gauzy.git'
          # Demo electron releases go to the same repo
          DESKTOP_API_SERVER_REPO_OWNER: 'ever-co'
          DESKTOP_API_SERVER_REPO_NAME: 'ever-gauzy'
          DESKTOP_API_SERVER_APP_NAME: 'gauzy-api-server'
          DESKTOP_API_SERVER_APP_DESCRIPTION: 'Gauzy API Server'
          DESKTOP_API_SERVER_APP_ID: 'com.ever.gauzyapiserver'
          COMPANY_SITE_LINK: 'https://gauzy.co'
