name: EXPERIMENT arm64 snap vs snapcraft version

# Throwaway diagnostic, lives ONLY on branch exp/arm64-snap-snapcraft-version.
#
# ROUNDS 1-3 (runs 35895302909, 35895798132, 35896229973) proved layer 1: in host mode
# snapcraft installs missing build snaps as the unprivileged runner user, which snapd on
# arm64 intermittently refuses. Pre-installing them with sudo removed that failure - and
# it did, on the real apps too (v111.44.42: zero "Error installing snap" lines).
#
# LAYER 2 (real apps, v111.44.42): the snap build now gets further and fails at
#     Executing parts lifecycle: pull app
#     Failed to refresh package list: failed to run apt update.
# The round-3 harness passed this same pull step with the same snap config, so the
# difference is the JOB ENVIRONMENT. The real arm64 job runs "Install system dependencies"
# (sudo apt-get update + a large apt install) and "Initialize Flatpak" before snapcraft;
# the harness did not.
#
# ROUND 4 mirrors those steps VERBATIM from desktop-app-prod.yml and bisects:
#   full      - every real setup step            (should reproduce layer 2)
#   no-flatpak- real setup minus Initialize Flatpak
#   minimal   - snapcraft + pre-install only      (= round 3, which passed)
# On failure it captures snapcraft's execution log, who holds the apt/dpkg locks, and the
# apt sources present - so we learn the reason instead of guessing it.

on:
  push:
    branches:
      - exp/arm64-snap-snapcraft-version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    name: arm64 / ${{ matrix.mode }} / replica ${{ matrix.replica }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [shim]
        replica: [1, 2]

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # ---- verbatim from desktop-app-prod.yml release-linux-arm64 ----
      - name: Install system dependencies
        if: matrix.mode == 'full'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt install -y curl gnupg git libappindicator3-1 ca-certificates binutils icnsutils graphicsmagick libx11-dev libxtst-dev libxt-dev libxinerama-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev ruby ruby-dev rubygems build-essential flatpak flatpak-builder
          sudo gem install --no-document fpm

      - name: Initialize Flatpak
        if: matrix.mode == 'full'
        run: |
          export XDG_DATA_DIRS=$XDG_DATA_DIRS:/var/lib/flatpak/exports/share:$HOME/.local/share/flatpak/exports/share
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic --channel=7.x/stable

      - name: Pre-install snapcraft build snaps (arm64)
        run: sudo snap install core18 core20 core22 gtk-common-themes gnome-3-28-1804 gnome-42-2204

      - name: Run snapcraft as root (arm64 host-mode snap)
        if: matrix.mode == 'shim'
        run: |
          # On arm64 electron-builder has no template snap, so it builds WITHOUT one: snapcraft pulls
          # stage-packages, and in host (destructive) mode that runs a bare `apt-get update`. As the
          # runner user that fails: "Could not open lock file /var/lib/apt/lists/lock - (13: Permission
          # denied)" -> "Failed to refresh package list". Put a shim first on PATH that runs ONLY
          # snapcraft as root, then hands the files it wrote back to the runner user.
          shim_dir="$HOME/.local/snapcraft-root-shim"
          mkdir -p "$shim_dir"
          cat > "$shim_dir/snapcraft" <<'SH'
          #!/bin/bash
          sudo --preserve-env env PATH="$PATH" /snap/bin/snapcraft "$@"
          rc=$?
          sudo chown -R "$(id -u):$(id -g)" "$PWD" "$HOME/.cache" "$HOME/.local/state" 2>/dev/null || true
          exit $rc
          SH
          chmod +x "$shim_dir/snapcraft"
          echo "$shim_dir" >> "$GITHUB_PATH"

      - name: Install Multipass
        if: matrix.mode == 'full'
        run: 'sudo snap install multipass'
      - name: Use Python 3.11 for native rebuilds (Linux)
        if: matrix.mode == 'full-py'
        id: py311
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Fix node-gyp and Python
        if: matrix.mode == 'full-py'
        run: |
          "${{ steps.py311.outputs.python-path }}" -m pip install packaging setuptools
          echo "npm_config_python=${{ steps.py311.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "PYTHON=${{ steps.py311.outputs.python-path }}" >> "$GITHUB_ENV"

      # ---- end verbatim ----

      - name: Create minimal Electron app with the desktop app's snap config
        run: |
          mkdir -p harness && cd harness
          cat > package.json <<'JSON'
          {
            "name": "snaptest",
            "version": "1.0.0",
            "description": "arm64 snap repro",
            "author": "Ever Co <ever@ever.co>",
            "main": "main.js",
            "build": {
              "appId": "co.ever.snaptest",
              "productName": "snaptest",
              "linux": {
                "target": ["snap"],
                "category": "Development",
                "executableName": "snaptest"
              },
              "snap": { "base": "core22" }
            }
          }
          JSON
          echo "require('electron').app.quit()" > main.js
          npm install --no-audit --no-fund --save-dev electron@38.2.2 electron-builder@26.0.3

      - name: Build snap
        id: build
        working-directory: harness
        shell: bash
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: host
        run: |
          # shell: bash => -o pipefail, so tee can no longer hide a failed build (rounds 3-5 were scored
          # green by job conclusion while every arm64 job actually failed - graded by log since).
          if [ "${{ matrix.mode }}" = sudo ]; then
            sudo --preserve-env env PATH="$PATH" HOME="$HOME" npx electron-builder --linux snap --arm64 --publish never 2>&1 | tee build.log
          else
            npx electron-builder --linux snap --arm64 --publish never 2>&1 | tee build.log
          fi

      - name: DIAGNOSE - why did snapcraft's apt update fail
        if: always()
        run: |
          echo "== snapcraft's summary line =="
          grep -E "Failed to refresh|Error installing snap|failed to run" harness/build.log | head -3 || true
          echo; echo "== snapcraft execution log (tail) =="
          shopt -s nullglob; for f in ~/.local/state/snapcraft/log/*.log /root/.local/state/snapcraft/log/*.log; do echo "--- $f"; sudo grep -nE "apt|Err|W:|E:|ERROR|Traceback|Error|refresh|sources|gpg|NO_PUBKEY|Release" "$f" | tail -n 120; done
          echo; echo "== who holds the apt / dpkg locks right now =="
          sudo fuser -v /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/cache/apt/archives/lock 2>&1 || echo "(no holders)"
          echo; echo "== apt / dpkg / unattended processes =="
          ps -eo pid,user,etime,cmd | grep -E "apt|dpkg|unattended|packagekit" | grep -v grep || echo "(none)"
          echo; echo "== apt update as the runner user (what snapcraft does if it does not sudo) =="
          apt-get update 2>&1 | tail -5 || true
          echo; echo "== sudo apt-get update =="
          sudo apt-get update 2>&1 | tail -8; echo "sudo apt-get update exit=${PIPESTATUS[0]}"
          echo; echo "== environment snapcraft inherited =="
          echo "PATH=$PATH"; echo "PYTHON=${PYTHON:-<unset>}"; echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<unset>}"; echo "which python3 -> $(command -v python3)"; python3 --version 2>&1
          echo; echo "== sudo --preserve-env apt-get update (the job env carried into apt) =="
          sudo --preserve-env apt-get update 2>&1 | tail -8; echo "preserve-env exit=${PIPESTATUS[0]}"
          echo; echo "== apt sources present =="
          ls -la /etc/apt/sources.list.d/ 2>&1; grep -rhE "^(deb|Types|URIs|Suites)" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | sort -u | head -30

      - name: Result
        if: always()
        run: |
          echo "RESULT mode=${{ matrix.mode }} replica=${{ matrix.replica }} build=${{ steps.build.outcome }}"
          ls -la harness/dist/*.snap 2>/dev/null || echo "no .snap produced"
