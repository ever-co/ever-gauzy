name: EXPERIMENT snap store credential scope

# Throwaway diagnostic, lives ONLY on branch exp/arm64-snap-snapcraft-version (never merged).
# Before prod app builds release snaps to the Snap Store 'stable' channel, confirm the
# SNAPCRAFT_TOKEN secret is allowed to release to stable. `snapcraft whoami` prints the account,
# the permissions, the channels and the expiry of the credential - never the credential itself.

on:
  push:
    branches:
      - exp/arm64-snap-snapcraft-version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic --channel=7.x/stable

      - name: snapcraft whoami
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        run: snapcraft whoami
