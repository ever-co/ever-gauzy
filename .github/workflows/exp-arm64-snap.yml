name: EXPERIMENT arm64 snap vs snapcraft version

# Throwaway diagnostic, lives ONLY on branch exp/arm64-snap-snapcraft-version.
#
# ROUND 1 (run 35895302909): arm64 failed on all four snapcraft sources, x64 passed
#   on all four -> snapcraft version is NOT the cause. Snapcraft's own log showed the
#   failure: `snap install gtk-common-themes` exiting 1.
# ROUND 2 (run 35895798132): confirmed the mechanism on arm64 -
#     as the runner user:  "error: access denied (try with sudo)"
#     with sudo:           installed fine
#   Refuted "x64 has the build snaps pre-installed": x64 snap list is only core20,
#   snapcraft, snapd, so x64 installs them as the runner user and snapd ALLOWS it there.
#   The arm64 "preinstall" row passed on attempt 1 having installed NOTHING, i.e. the
#   denial is NON-DETERMINISTIC on arm64 - one lucky pass does not prove a fix.
#
# ROUND 3: prove or kill the fix with replicas. Four arm64 runs exactly as prod does it
# (baseline) against four arm64 runs that first install, WITH sudo, a deliberate superset
# of every build snap seen named so far (so snapcraft never has to install one itself).
# A fix is proven only if preinstall passes 4/4 while baseline fails at least once.

on:
  push:
    branches:
      - exp/arm64-snap-snapcraft-version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    name: arm64 / ${{ matrix.mode }} / replica ${{ matrix.replica }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, preinstall]
        replica: [1, 2, 3, 4]

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install snapcraft 7.x (the prod pin)
        run: sudo snap install snapcraft --classic --channel=7.x/stable

      - name: THE FIX UNDER TEST - install the build snaps with sudo
        if: matrix.mode == 'preinstall'
        run: |
          sudo snap install core18 core20 core22 gtk-common-themes gnome-3-28-1804 gnome-42-2204
          snap list

      - name: Create minimal Electron app with the desktop app's snap config
        run: |
          mkdir -p harness && cd harness
          cat > package.json <<'JSON'
          {
            "name": "snaptest",
            "version": "1.0.0",
            "description": "arm64 snap repro",
            "author": "Ever Co <ever@ever.co>",
            "main": "main.js",
            "build": {
              "appId": "co.ever.snaptest",
              "productName": "snaptest",
              "linux": {
                "target": ["snap"],
                "category": "Development",
                "executableName": "snaptest"
              },
              "snap": { "base": "core22" }
            }
          }
          JSON
          echo "require('electron').app.quit()" > main.js
          npm install --no-audit --no-fund --save-dev electron@38.2.2 electron-builder@26.0.3

      - name: Build snap (single attempt, identical in both modes)
        id: build
        working-directory: harness
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: host
        run: npx electron-builder --linux snap --arm64 --publish never 2>&1 | tee build.log

      - name: Which snap did snapcraft fail to install, if any
        if: failure()
        run: |
          sed -n "s/.*Error installing snap '\([^']*\)'.*/FAILED_TO_INSTALL=\1/p" harness/build.log | head -1 || true

      - name: Result
        if: always()
        run: |
          echo "RESULT mode=${{ matrix.mode }} replica=${{ matrix.replica }} build=${{ steps.build.outcome }}"
          ls -la harness/dist/*.snap 2>/dev/null || echo "no .snap produced"
