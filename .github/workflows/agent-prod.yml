          # Remove build artifacts but keep NX cache for faster rebuilds
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" }
          exit 0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          architecture: arm64

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            .nx/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-nx-
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Install Visual Studio 2022 Build Tools (VCTools with ARM64)
        shell: powershell
        run: |
          choco install -y visualstudio2022buildtools --execution-timeout=21600 --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --includeRecommended --passive --norestart"

      - name: Configure node-gyp to use VS 2022
        shell: powershell
        run: |
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Append
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools

      - name: Setup MSVC (VS 2022 dev env)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Install latest version of NPM
        run: 'npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure npm python for node-gyp
        shell: powershell
        run: |
          $py = (Get-Command python.exe).Source
          Write-Host "python is: $py"
          "npm_config_python=$py" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYTHON=$py"            | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          # in-network runners: the self-hosted Windows boxes, plus any ever-k8s-* ARC pool a runner
          # variable may select (release-linux takes its os from vars.RUNNER_LINUX_APPS_X64). Keep the
          # ever-k8s disjunct even where a matrix cannot currently emit that label - it costs nothing,
          # keeps all 66 call sites identical, and means a future ARC matrix entry inherits the VIP
          # retry and the in-network warning instead of silently losing them.
          expect-vip: ${{ contains(matrix.os, 'self-hosted') || contains(matrix.os, 'ever-k8s') }}

      - name: Install Yarn dependencies
        run: 'yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts'

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump version agent app
        uses: actions/github-script@v8
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.agent(true))
        env:
          GAUZY_RELEASE_TAG: ${{ needs.check-release-tag.outputs.tag }}
          PROJECT_REPO: 'https://github.com/ever-co/ever-gauzy.git'
          AGENT_APP_NAME: 'gauzy-agent'
          AGENT_APP_REPO_NAME: 'ever-gauzy-agent'
          AGENT_APP_REPO_OWNER: 'ever-co'
          COMPANY_SITE_LINK: 'https://gauzy.co'
          AGENT_APP_DESCRIPTION: 'Gauzy Agent'
          AGENT_APP_ID: 'com.ever.gauzyagent'

      - name: Fix Node.js PATH for child processes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $nodeExe = (Get-Command node -ErrorAction Stop).Source
          $nodePath = Split-Path $nodeExe -Parent
          $npmGlobalBin = & npm config get prefix
          $localBin = Join-Path $PWD "node_modules\.bin"
          $yarnCmd = Get-Command yarn -ErrorAction SilentlyContinue
          $yarnPath = if ($yarnCmd) { Split-Path $yarnCmd.Source -Parent } else { "" }

          $npmNodeExe = Join-Path $npmGlobalBin "node.exe"
          if (-not (Test-Path $npmNodeExe)) { Copy-Item $nodeExe $npmNodeExe -Force }

          $localNodeExe = Join-Path $localBin "node.exe"
          if (-not (Test-Path $localNodeExe)) { Copy-Item $nodeExe $localNodeExe -Force }

          $newPath = "$nodePath;$npmGlobalBin;$localBin;$yarnPath;$($env:PATH)"
          "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          @($nodePath, $npmGlobalBin, $localBin, $yarnPath) | Where-Object { $_ } | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

          "NODE=$nodeExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NODE_PATH=$nodePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $env:PATH = $newPath
          [System.Environment]::SetEnvironmentVariable("PATH", $newPath, "Process")

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      - name: Increase file handle limits
        shell: powershell
        run: |
          # Increase Node.js UV threadpool for parallel I/O (default is 4)
          "UV_THREADPOOL_SIZE=32" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Patch graceful-fs to retry EMFILE errors with backoff
          node -e "try { var gfs = require('graceful-fs'); gfs.gracefulify(require('fs')); console.log('graceful-fs patched'); } catch(e) { console.log('graceful-fs not available, skipping'); }"

      - name: Build Agent
        shell: cmd
        run: yarn build:agent:windows:release:gh:arm64
        env:
          USE_HARD_LINKS: false
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: '${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}'
          SENTRY_PROFILE_SAMPLE_RATE: '${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}'
          SENTRY_HTTP_TRACING_ENABLED: '${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}'
          SENTRY_POSTGRES_TRACKING_ENABLED: '${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}'
          SENTRY_PROFILING_ENABLED: '${{ secrets.SENTRY_PROFILING_ENABLED }}'
          NX_NO_CLOUD: true
          NX_PLUGIN_NO_TIMEOUTS: true
          NX_DAEMON: false

      - name: Scrub registry credentials
        if: always()
        shell: bash
        # DELIBERATELY INLINE, not a composite action. A local action is resolved from the
        # workspace, so a failed checkout means it cannot load and this step errors instead of
        # running. 30 of these jobs check out with `clean: false`, where the previous run's
        # workspace - and any live _authToken in it - survives; that is the exact case this step
        # exists to cover. Configure Registry is a composite action because it genuinely needs the checkout.
        run: |
          # The auth token must not outlive the job. These runners check out with clean: false and
          # clean only dist/ and node_modules/, so a workspace .npmrc carrying
          # //packages.ever.co/:_authToken=... would sit on disk after the job ends - readable by
          # anything scheduled on this runner before the next Configure Registry step resets it.
          #
          # This is deliberately the LAST step of the job: the build steps above run
          # postinstall.electron / electron-builder install-app-deps, which resolve dependencies,
          # so the credential has to survive until they are done. Only the credential lines go;
          # the registry= line stays. Runs on failure too, which is when it would linger.
          #
          # No 'sed -i.bak': the backup would itself hold the token if this step were interrupted.
          # The temp file only ever holds the SCRUBBED content, so a partial run leaks nothing.
          # Cleanup policy, precisely:
          #   * individual cleanup ATTEMPTS are best-effort. Under `set -e` a failing sed or mv
          #     would abort this step before the token was removed - the exact outcome the step
          #     exists to prevent - so nothing is allowed to short-circuit it.
          #   * the POSTCONDITION is not best-effort. A surviving CREDENTIAL fails the step, because
          #     handing a live token to the next job on a reused clean: false runner is worse than a
          #     red build. Leftover registry STATE (a stale .yarnrc, a yarn.lock still rewritten to
          #     the VIP) only warns: it is a correctness nuisance for an unrelated workflow, not a
          #     secret, and the next Configure Registry step resets it anyway.
          # Anything that cannot be DETERMINED counts as dirty, so an unreadable file is never
          # mistaken for a clean one (grep exits 2 on a read error, which is not "no token").
          set +e

          # Restoring the tracked files from git is the primary mechanism: it reverts the whole
          # file, so the credential, the appended registry= line and the yarn.lock rewrite all go
          # in one operation.
          git checkout -- .npmrc yarn.lock 2>/dev/null
          # Fallback for a workspace where git cannot run at all.
          if [ -f .npmrc ]; then
            sed -e '/_authToken=/d' -e '/always-auth=/d' .npmrc > .npmrc.scrubbed 2>/dev/null && mv -f .npmrc.scrubbed .npmrc
          fi
          rm -f .npmrc.bak .npmrc.scrubbed .yarnrc yarn.lock.bak yarn.lock.rewritten

          # Prove the credential is gone, starting from "undetermined" rather than "absent" so no
          # inconclusive result can pass. Two ways to be inconclusive: grep exits 2 when a file
          # cannot be READ, and [ -f ] answers false for both "missing" and "cannot stat", so a
          # bare existence test cannot tell an absent file from an unreachable one.
          cred_state="undetermined"
          if [ -e .npmrc ] || [ -L .npmrc ]; then
            grep -q '_authToken=' .npmrc
            case "$?" in
              0) cred_state="present" ;;
              1) cred_state="absent" ;;
              *) cred_state="undetermined" ;;
            esac
          elif [ -r . ] && [ -x . ]; then
            # The directory is both readable AND searchable and neither a file nor a symlink named
            # .npmrc exists, so the absence is proven rather than merely unobservable. Without the
            # -x test a stat could fail in a directory that still answers -r, and without the -L
            # test above a dangling symlink would read as "missing" while its target held a token.
            cred_state="absent"
          fi
          # Artifacts that can also carry the token: .npmrc.bak is written by older revisions of
          # this workflow, and a surviving .npmrc.scrubbed means the mv above did not complete.
          # Present-but-clean is only clutter; present-and-carrying-a-token (or unreadable) is not.
          for stray in .npmrc.bak .npmrc.scrubbed; do
            if [ -e "$stray" ] || [ -L "$stray" ]; then
              grep -q '_authToken=' "$stray"
              if [ "$?" -ne 1 ]; then
                cred_state="present in $stray"
              fi
            fi
          done
          if [ "$cred_state" != "absent" ]; then
            echo "::error title=Registry credential may still be present::Auth token is $cred_state after cleanup on ${RUNNER_NAME:-this runner}."
            exit 1
          fi

          # Report - but do not fail on - leftover registry state.
          leftover=""
          [ -e .yarnrc ] && leftover="$leftover .yarnrc"
          git diff --quiet -- .npmrc yarn.lock 2>/dev/null
          case "$?" in
            0) ;;
            1) leftover="$leftover .npmrc/yarn.lock(modified)" ;;
            *) leftover="$leftover .npmrc/yarn.lock(unverifiable)" ;;
          esac
          if [ -n "$leftover" ]; then
            echo "::warning title=Registry state left behind::Cleanup could not fully restore:$leftover on ${RUNNER_NAME:-this runner}. The next Configure Registry step resets it, but a job from another workflow could inherit it first."
          else
            echo "Registry credential removed; .npmrc, .yarnrc and yarn.lock restored to HEAD."
          fi
