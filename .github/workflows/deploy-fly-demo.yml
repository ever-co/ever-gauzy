name: Deploy to Fly Demo

on:
  workflow_run:
    workflows: ['Build and Publish Docker Images Demo']
    branches:
      - fly
    types:
      - completed

# Least-privilege scope for the automatic GITHUB_TOKEN.
# This workflow only builds/tests/deploys from a checkout — read access is sufficient.
permissions:
  contents: read

jobs:
  deploy-demo:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 300

    environment: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        run: flyctl deploy --remote-only --config ./.fly/applications/api/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy Frontend
        run: flyctl deploy --remote-only --config ./.fly/applications/webapp/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
