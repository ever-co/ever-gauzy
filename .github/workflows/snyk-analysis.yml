name: 'Snyk'

on:
  push:
    branches:
      - develop
  # Off by owner decision (2026-09-21): a pull request INTO develop no longer starts a run: the cost
  # belonged to every commit on the branch being merged, and the run belongs to the merge. The push
  # trigger below runs the whole workflow when code lands on develop. To restore the PR trigger,
  # replace this comment with:
  #   pull_request:
  #     branches:
  #       - develop

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Least-privilege scope for the automatic GITHUB_TOKEN.
# `security-events: write` is required by codeql-action/upload-sarif; `actions: read`
# lets it resolve the run it is attaching results to on pull_request events.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    # Never run jobs for a pull request from a fork (owner decision 2026-09-16); branch PRs and pushes still run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true # To make sure that SARIF upload gets called
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif

      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: snyk.sarif
