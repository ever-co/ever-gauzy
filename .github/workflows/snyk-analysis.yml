name: 'Snyk'

on:
  push:
    branches:
      - develop
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - develop

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Least-privilege scope for the automatic GITHUB_TOKEN.
# `security-events: write` is required by codeql-action/upload-sarif; `actions: read`
# lets it resolve the run it is attaching results to on pull_request events.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true # To make sure that SARIF upload gets called
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif

      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: snyk.sarif
