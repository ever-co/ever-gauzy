name: 'Secrets Analysis'

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Least-privilege scope for the automatic GITHUB_TOKEN.
# This workflow only builds/tests/deploys from a checkout — read access is sufficient.
permissions:
  contents: read

jobs:
  TruffleHog:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret Scanning (TruffleHog OSS)
        uses: trufflesecurity/trufflehog@v3.63.4
        with:
          path: ./
          extra_args: --only-verified
