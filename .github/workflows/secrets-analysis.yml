name: 'Secrets Analysis'

on:
  push:
    branches:
      - develop
  pull_request:
    # Off by owner decision (2026-09-21): a pull request INTO develop does not start this workflow. The cost
    # belonged to every commit on the branch being merged, and the run belongs to the merge - the push
    # trigger below runs it when code lands on develop. PRs aimed at other branches still run it.
    branches-ignore:
      - develop

concurrency:
  # Same shape as `build.yml`, for the same reason and with the same trade-off written out there:
  # `pull_request:` here is unfiltered, so while a cascade PR whose head is `develop` is open, one
  # push to `develop` fires a push run and a pull_request run on the same tree, in two groups that
  # could never cancel each other — two full-history TruffleHog scans instead of one. Keying on the
  # head ref collapses them; qualifying by the head repository keeps a fork branch of the same name
  # from claiming this repository's group and cancelling a real scan before its job skips.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && format('{0}@{1}', github.event.pull_request.head.repo.full_name, github.event.pull_request.head.ref)
    || format('{0}@{1}', github.repository, github.ref_name) }}
  cancel-in-progress: true

# Least-privilege scope for the automatic GITHUB_TOKEN.
# This workflow only builds/tests/deploys from a checkout - read access is sufficient.
permissions:
  contents: read

jobs:
  TruffleHog:
    # Never run jobs for a pull request from a fork (owner decision 2026-09-16); branch PRs and pushes still run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret Scanning (TruffleHog OSS)
        uses: trufflesecurity/trufflehog@v3.63.4
        with:
          path: ./
          extra_args: --only-verified
