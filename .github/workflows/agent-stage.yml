name: Agent Build Stage

# The packaged desktop & server stage apps are built ONLY when 'stage' is promoted to the 'stage-apps' branch
# ('temp' is kept for ad-hoc testing). No new platform version is created here: the build
# version is resolved at build time (.scripts/bump-version-electron.js) from the release tag of the promoted commit
# (on HEAD, or on the merge parent for PR-merge promotions), which 'Release Stage' creates on the merge to 'stage' - so the stage app prerelease builds
# carry the same version as the corresponding platform stage release.
on:
  push:
    branches:
      - stage-apps
      - temp
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Least-privilege scope for the automatic GITHUB_TOKEN.
# This workflow publishes its release assets with the separate `secrets.GH_TOKEN` PAT,
# which this block does not affect, so the automatic token only needs to read the repo.
permissions:
  contents: read

jobs:
  check-release-tag:
    # Only build when the promoted commit carries a release tag (the version stamped into the
    # packages - see header comment). 'stage-apps' is promoted from 'stage' either by
    # fast-forwarding to the tagged 'stage' commit (tag on HEAD) or by merging the
    # 'stage' -> 'stage-apps' promotion PR (the tag then points at the merged
    # 'stage' tip, HEAD^2). Retries absorb the short delay until 'Release Stage' tags
    # the 'stage' commit.
    # Ad-hoc pushes to 'temp' skip the check.
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      # The resolved vX.Y.Z release tag; the build jobs stamp exactly this version.
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Depth 2 so HEAD^2 resolves on merge-commit promotions
          fetch-depth: 2

      - name: Verify a release tag points at the promoted commit
        id: resolve
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "temp" ]; then
            echo "Ad-hoc 'temp' branch - skipping the release tag check"
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" != "stage-apps" ]; then
            echo "::error::This workflow only releases from the 'stage-apps' branch (got '$GITHUB_REF_NAME')."
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          # Present only when the promotion PR was merged as a merge commit; the release tag
          # then points at the merged 'stage' tip, not at the merge commit itself.
          PARENT2_SHA=$(git rev-parse --verify --quiet 'HEAD^2' || true)
          resolve_tag() {
            # Highest vX.Y.Z tag pointing at $1 in the remote listing (peeled '^{}' entries
            # carry the commit sha of annotated tags); empty when none match.
            printf '%s\n' "$REMOTE_REFS" | awk -v sha="$1" '
              $1 == sha && $2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+(\^\{\})?$/ {
                t = $2
                sub(/^refs\/tags\//, "", t)
                sub(/\^\{\}$/, "", t)
                print t
              }' | sort -V | tail -n 1
          }
          for i in $(seq 1 20); do
            if REMOTE_REFS=$(git ls-remote origin refs/heads/stage 'refs/tags/*'); then
              SRC_TIP=$(printf '%s\n' "$REMOTE_REFS" | awk -v ref="refs/heads/stage" '$2 == ref { print $1 }')
              TAG=$(resolve_tag "$HEAD_SHA")
              # Accept the merge-parent tag only when HEAD^2 is the current 'stage' tip -
              # i.e. this is the promotion merge of 'stage', not an arbitrary tagged branch
              # merged in, nor a fast-forward racing 'Release Stage' (whose tag lands on HEAD).
              if [ -z "$TAG" ] && [ -n "$PARENT2_SHA" ] && [ "$PARENT2_SHA" = "$SRC_TIP" ]; then
                TAG=$(resolve_tag "$PARENT2_SHA")
              fi
              if [ -n "$TAG" ]; then
                echo "Release tag on the promoted commit: $TAG"
                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "git ls-remote failed (attempt $i); will retry"
            fi
            echo "No release tag points at this commit or its merge parent yet (attempt $i/20); retrying in 30s..."
            sleep 30
          done
          echo "::error::No release tag points at this commit, and its merge parent does not match the tagged 'stage' tip. Promote by merging the 'stage' -> 'stage-apps' PR (or fast-forwarding: git push origin origin/stage:stage-apps) after 'Release Stage' has created the tag; if 'stage' has moved since the promotion PR was opened, re-promote."
          exit 1

  release-linux:
    needs: check-release-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    strategy:
      matrix:
        # Flatpak (bwrap) and Snapcraft (snapd) cannot run inside the k8s ARC container
        # runners - this packaging job needs a VM-class runner. Override with the
        # RUNNER_LINUX_APPS_X64 org/repo variable to use a self-hosted VM.
        os: ["${{ vars.RUNNER_LINUX_APPS_X64 || 'ubuntu-latest' }}"]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            .nx/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-nx-
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Change permissions
        run: 'sudo chown -R $(whoami) ./*'

      - name: Install system dependencies
        run: 'sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt install -y curl gnupg git libappindicator3-1 ca-certificates binutils icnsutils graphicsmagick flatpak flatpak-builder'

      - name: Initialize Flatpak
        run: |
          export XDG_DATA_DIRS=$XDG_DATA_DIRS:/var/lib/flatpak/exports/share:$HOME/.local/share/flatpak/exports/share
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v2

      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools

      - name: Install latest version of NPM
        run: 'sudo npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'sudo npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          # in-network runners: the self-hosted Windows boxes and any ever-k8s-* ARC pool
          expect-vip: ${{ contains(matrix.os, 'self-hosted') || contains(matrix.os, 'ever-k8s') }}

      - name: Install Yarn dependencies
        run: 'yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts'

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump Agent version
        uses: actions/github-script@v8
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.agent(false))
        env:
          GAUZY_RELEASE_TAG: ${{ needs.check-release-tag.outputs.tag }}
          PROJECT_REPO: 'https://github.com/ever-co/ever-gauzy.git'
          AGENT_APP_NAME: 'gauzy-agent'
          AGENT_APP_REPO_NAME: 'ever-gauzy-agent'
          AGENT_APP_REPO_OWNER: 'ever-co'
          COMPANY_SITE_LINK: 'https://gauzy.co'
          AGENT_APP_DESCRIPTION: 'Gauzy Agent'
          AGENT_APP_ID: 'com.ever.gauzyagent'

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      - name: Build Agent
        run: 'yarn build:agent:linux:release:gh:x64'
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: '${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}'
          SENTRY_PROFILE_SAMPLE_RATE: '${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}'
          SENTRY_HTTP_TRACING_ENABLED: '${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}'
          SENTRY_POSTGRES_TRACKING_ENABLED: '${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}'
          SENTRY_PROFILING_ENABLED: '${{ secrets.SENTRY_PROFILING_ENABLED }}'
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_NO_CLOUD: true
          NX_DAEMON: false
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}

      - name: Scrub registry credentials
        if: always()
        uses: ./.github/actions/scrub-registry-credentials
  release-linux-arm64:
    needs: check-release-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    strategy:
      matrix:
        os: [ubicloud-standard-8-arm]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            .nx/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-nx-
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Change permissions
        run: 'sudo chown -R $(whoami) ./*'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt install -y curl gnupg git libappindicator3-1 ca-certificates binutils icnsutils graphicsmagick libx11-dev libxtst-dev libxt-dev libxinerama-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev ruby ruby-dev rubygems build-essential flatpak flatpak-builder
          sudo gem install --no-document fpm

      - name: Initialize Flatpak
        run: |
          export XDG_DATA_DIRS=$XDG_DATA_DIRS:/var/lib/flatpak/exports/share:$HOME/.local/share/flatpak/exports/share
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v2

      - name: Install Multipass
        run: 'sudo snap install multipass'

      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools

      - name: Install latest version of NPM
        run: 'sudo npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'sudo npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          # in-network runners: the self-hosted Windows boxes and any ever-k8s-* ARC pool
          expect-vip: ${{ contains(matrix.os, 'self-hosted') || contains(matrix.os, 'ever-k8s') }}

      - name: Install Yarn dependencies
        run: 'yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts'

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump version agent app
        uses: actions/github-script@v8
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.agent(false))
        env:
          GAUZY_RELEASE_TAG: ${{ needs.check-release-tag.outputs.tag }}
          PROJECT_REPO: 'https://github.com/ever-co/ever-gauzy.git'
          AGENT_APP_NAME: 'gauzy-agent'
          AGENT_APP_REPO_NAME: 'ever-gauzy-agent'
          AGENT_APP_REPO_OWNER: 'ever-co'
          COMPANY_SITE_LINK: 'https://gauzy.co'
          AGENT_APP_DESCRIPTION: 'Gauzy Agent'
          AGENT_APP_ID: 'com.ever.gauzyagent'

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      - name: Build Agent
        run: 'yarn build:agent:linux:release:gh:arm64'
        env:
          USE_HARD_LINKS: false
          USE_SYSTEM_FPM: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: '${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}'
          SENTRY_PROFILE_SAMPLE_RATE: '${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}'
          SENTRY_HTTP_TRACING_ENABLED: '${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}'
          SENTRY_POSTGRES_TRACKING_ENABLED: '${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}'
          SENTRY_PROFILING_ENABLED: '${{ secrets.SENTRY_PROFILING_ENABLED }}'
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_NO_CLOUD: true
          NX_DAEMON: false
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
          SNAPCRAFT_BUILD_ENVIRONMENT: host

      - name: Scrub registry credentials
        if: always()
        uses: ./.github/actions/scrub-registry-credentials
  release-mac:
    needs: check-release-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    strategy:
      matrix:
        os: [ghcr.io/cirruslabs/macos-runner:tahoe]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            .nx/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-nx-
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Fix node-gyp and Python
        run: python3 -m pip install --break-system-packages packaging setuptools || python3 -m pip install packaging setuptools

      - name: Install latest version of NPM
        run: 'sudo npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'sudo npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          # in-network runners: the self-hosted Windows boxes and any ever-k8s-* ARC pool
          expect-vip: ${{ contains(matrix.os, 'self-hosted') || contains(matrix.os, 'ever-k8s') }}

      - name: Install Yarn dependencies
        run: 'yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts'

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump Agent version
        uses: actions/github-script@v8
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.agent(false))
        env:
          GAUZY_RELEASE_TAG: ${{ needs.check-release-tag.outputs.tag }}
          PROJECT_REPO: 'https://github.com/ever-co/ever-gauzy.git'
          AGENT_APP_NAME: 'gauzy-agent'
          AGENT_APP_REPO_NAME: 'ever-gauzy-agent'
          AGENT_APP_REPO_OWNER: 'ever-co'
          COMPANY_SITE_LINK: 'https://gauzy.co'
          AGENT_APP_DESCRIPTION: 'Gauzy Agent'
          AGENT_APP_ID: 'com.ever.gauzyagent'

      - name: Prepare Apple API Key
        run: |
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > /tmp/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          chmod 600 /tmp/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      # macOS signing: build the keychain ourselves instead of letting electron-builder do it.
      # app-builder-lib passes the p12 password to `security set-key-partition-list -k`, which
      # expects the KEYCHAIN password — fatal on the current runner image, and still unfixed in
      # the latest release. With CSC_LINK unset, electron-builder skips its own keychain code and
      # uses CSC_KEYCHAIN (macPackager.js:25-48), so this sidesteps the bug without patching deps.
      - name: Import Apple signing certificate into a keychain
        env:
          CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ever-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/ever-signing-cert.p12"
          printf '%s' "$CSC_LINK_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          # The KEYCHAIN password here — this is the exact call app-builder-lib gets wrong.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          rm -f "$CERT"
          # Fail loudly here rather than silently shipping an unsigned app later.
          security find-identity -v -p codesigning "$KEYCHAIN" | tee /tmp/identities.txt
          grep -q "Developer ID Application" /tmp/identities.txt

      - name: Build Agent
        run: 'yarn build:agent:mac:release'
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: '${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}'
          SENTRY_PROFILE_SAMPLE_RATE: '${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}'
          SENTRY_HTTP_TRACING_ENABLED: '${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}'
          SENTRY_POSTGRES_TRACKING_ENABLED: '${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}'
          SENTRY_PROFILING_ENABLED: '${{ secrets.SENTRY_PROFILING_ENABLED }}'
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_NO_CLOUD: true
          NX_DAEMON: false
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # CSC_LINK deliberately NOT set: that is what makes electron-builder build its own
          # (broken) keychain. Point it at the one imported above instead.
          CSC_KEYCHAIN: ${{ runner.temp }}/ever-signing.keychain-db
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: /tmp/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Scrub registry credentials
        if: always()
        uses: ./.github/actions/scrub-registry-credentials
  release-windows:
    needs: check-release-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    strategy:
      matrix:
        os: [[self-hosted, Windows, X64]]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Selective cleanup (preserve .nx/cache)
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          # Stop NX daemon first to release file locks before cleanup (guard for fresh runners without Node)
          if (Get-Command npx -ErrorAction SilentlyContinue) { npx nx daemon --stop 2>&1 | Out-Null }
          # Remove build artifacts but keep NX cache for faster rebuilds
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" }
          exit 0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0

      - name: Install Visual Studio 2022 Build Tools (VCTools)
        shell: powershell
        run: |
          choco install -y visualstudio2022buildtools --execution-timeout=21600 --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional --passive --norestart"

      - name: Configure node-gyp to use VS 2022
        shell: powershell
        run: |
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Append
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools

      - name: Setup MSVC (VS 2022 dev env)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install latest version of NPM
        run: 'npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure npm python for node-gyp
        shell: powershell
        run: |
          $py = (Get-Command python.exe).Source
          Write-Host "python is: $py"
          "npm_config_python=$py" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYTHON=$py"            | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          # in-network runners: the self-hosted Windows boxes and any ever-k8s-* ARC pool
          expect-vip: ${{ contains(matrix.os, 'self-hosted') || contains(matrix.os, 'ever-k8s') }}

      - name: Install Yarn dependencies
        run: 'yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts'

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump Agent version
        uses: actions/github-script@v8
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.agent(false))
        env:
          # Windows signing config must be visible to the BUMP step: this script writes build.win.azureSignOptions into package.json, which electron-builder reads later.
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT || 'ever' }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          GAUZY_RELEASE_TAG: ${{ needs.check-release-tag.outputs.tag }}
          PROJECT_REPO: 'https://github.com/ever-co/ever-gauzy.git'
          AGENT_APP_NAME: 'gauzy-agent'
          AGENT_APP_REPO_NAME: 'ever-gauzy-agent'
          AGENT_APP_REPO_OWNER: 'ever-co'
          COMPANY_SITE_LINK: 'https://gauzy.co'
          AGENT_APP_DESCRIPTION: 'Gauzy Agent'
          AGENT_APP_ID: 'com.ever.gauzyagent'

      - name: Fix Node.js PATH for child processes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $nodeExe = (Get-Command node -ErrorAction Stop).Source
          $nodePath = Split-Path $nodeExe -Parent
          $npmGlobalBin = & npm config get prefix
          $localBin = Join-Path $PWD "node_modules\.bin"
          $yarnCmd = Get-Command yarn -ErrorAction SilentlyContinue
          $yarnPath = if ($yarnCmd) { Split-Path $yarnCmd.Source -Parent } else { "" }

          $npmNodeExe = Join-Path $npmGlobalBin "node.exe"
          if (-not (Test-Path $npmNodeExe)) { Copy-Item $nodeExe $npmNodeExe -Force }

          $localNodeExe = Join-Path $localBin "node.exe"
          if (-not (Test-Path $localNodeExe)) { Copy-Item $nodeExe $localNodeExe -Force }

          $newPath = "$nodePath;$npmGlobalBin;$localBin;$yarnPath;$($env:PATH)"
          "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          @($nodePath, $npmGlobalBin, $localBin, $yarnPath) | Where-Object { $_ } | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

          "NODE=$nodeExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NODE_PATH=$nodePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $env:PATH = $newPath
          [System.Environment]::SetEnvironmentVariable("PATH", $newPath, "Process")

      - name: Ensure dist directory exists
        shell: bash
        run: mkdir -p dist/packages

      - name: Increase file handle limits
        shell: powershell
        run: |
          # Increase Node.js UV threadpool for parallel I/O (default is 4)
          "UV_THREADPOOL_SIZE=32" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Patch graceful-fs to retry EMFILE errors with backoff
          node -e "try { var gfs = require('graceful-fs'); gfs.gracefulify(require('fs')); console.log('graceful-fs patched'); } catch(e) { console.log('graceful-fs not available, skipping'); }"

      - name: Reset NX
        shell: powershell
        run: npx nx reset

      # Azure Trusted Signing runs Invoke-TrustedSigning, which installs the `sign` dotnet
      # global tool. The self-hosted Windows runners have no .NET SDK, so that install fails
      # ("sdk-not-found") and signing is skipped. Provision it here rather than on the host,
      # so the requirement lives in Git and applies to every runner.
      - name: Install .NET SDK (required by Azure Trusted Signing)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Agent
        shell: cmd
        run: 'yarn build:agent:windows:release:gh:x64'
        env:
          USE_HARD_LINKS: false
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Windows Authenticode signing (electron-builder auto-signs when WIN_CSC_LINK is set;
          # empty secret => skipped). Verification engages only when WINDOWS_PUBLISHER_NAME is set.
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
          # Azure Artifact Signing (preferred once a certificate profile exists). Engaged only when
          # AZURE_CERT_PROFILE_NAME is set; otherwise the PFX path above is used.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT || 'ever' }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          EP_GH_IGNORE_TIME: true
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: '${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}'
          SENTRY_PROFILE_SAMPLE_RATE: '${{ secrets.SENTRY_PROFILE_SAMPLE_RATE }}'
          SENTRY_HTTP_TRACING_ENABLED: '${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}'
          SENTRY_POSTGRES_TRACKING_ENABLED: '${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}'
          SENTRY_PROFILING_ENABLED: '${{ secrets.SENTRY_PROFILING_ENABLED }}'
          NX_NO_CLOUD: true
          NX_PLUGIN_NO_TIMEOUTS: true
          NX_DAEMON: false

      - name: Scrub registry credentials
        if: always()
        uses: ./.github/actions/scrub-registry-credentials
  release-windows-arm64:
    needs: check-release-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    strategy:
      matrix:
        os: [windows-11-arm]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Selective cleanup (preserve .nx/cache)
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          # Stop NX daemon first to release file locks before cleanup (guard for fresh runners without Node)
          if (Get-Command npx -ErrorAction SilentlyContinue) { npx nx daemon --stop 2>&1 | Out-Null }
          # Remove build artifacts but keep NX cache for faster rebuilds
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" }
          exit 0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          architecture: arm64

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: bash
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            .nx/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-nx-
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Install Visual Studio 2022 Build Tools (VCTools with ARM64)
        shell: powershell
        run: |
          # The runner image normally ships VS with the VC ARM64 toolset. Only reach for
          # Chocolatey if it is genuinely missing — community.chocolatey.org returning 504
          # has failed this job before ("Chocolatey installed 0/0 packages"), and installing
          # something already present costs ~6 min for nothing.
          $ErrorActionPreference = "Continue"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $have = $false
          if (Test-Path $vswhere) {
            $found = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath 2>$null
            if ($found) { $have = $true; Write-Host "VC ARM64 toolset already present: $found" }
          }
          if (-not $have) {
            Write-Host "VC ARM64 toolset not found - installing via Chocolatey"
            choco install -y visualstudio2022buildtools --execution-timeout=21600 --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --includeRecommended --passive --norestart"
            if ($LASTEXITCODE -ne 0) {
              # Do not fail the job on a Chocolatey feed outage; the next step (msvc-dev-cmd)
              # will either find a usable toolchain or fail with an unambiguous message.
              Write-Warning "Chocolatey install failed (exit $LASTEXITCODE) - continuing; the MSVC setup step will report definitively."
            }
          }
          exit 0

      - name: Configure node-gyp to use VS 2022
        shell: powershell
        run: |
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Append
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fix node-gyp and Python
        run: python3 -m pip install packaging setuptools

      - name: Setup MSVC (VS 2022 dev env)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Install latest version of NPM
        run: 'npm install -g npm@11.6.2'

      - name: Install globally node-gyp, ts-node and nx packages
        run: 'npm install --quiet -g node-gyp@10.2.0 ts-node@10.9.2 nx@^22.5.2'

      - name: Configure npm python for node-gyp
        shell: powershell
        run: |
          $py = (Get-Command python.exe).Source
          Write-Host "python is: $py"
          "npm_config_python=$py" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYTHON=$py"            | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          # in-network runners: the self-hosted Windows boxes and any ever-k8s-* ARC pool
          expect-vip: ${{ contains(matrix.os, 'self-hosted') || contains(matrix.os, 'ever-k8s') }}

      - name: Install Yarn dependencies
        run: 'yarn install --network-timeout 1000000 --frozen-lockfile --ignore-scripts'

      - name: Run Postinstall Manually
        run: 'yarn postinstall.manual'

      - name: Bump version agent app
        uses: actions/github-script@v8
        with:
          script: |
            const script = require('./.scripts/bump-version-electron.js')
            console.log(script.agent(false))
        env:
          # Windows signing is deliberately NOT configured for ARM64. Azure Trusted Signing
          # ships no ARM64 tooling (Microsoft.Trusted.Signing.Client 1.0.95 contains only
          # bin/x64 and bin/x86), so Invoke-TrustedSigning loads the x64 dlib and fails with
