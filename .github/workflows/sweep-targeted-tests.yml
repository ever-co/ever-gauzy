name: Sweep targeted tests

# The repository has ~330 `*.spec.ts` files and an `nx` `test` target on 20+ projects
# (`@nx/jest:jest`, already cached via `nx.json` targetDefaults) — but until now NO workflow ever
# invoked any of them. CI ran builds plus Playwright/Cypress end-to-end suites only, so a green pull
# request proved the code COMPILED and said nothing about the unit tests. This workflow wires the
# existing targets up; it adds no test tooling of its own.
#
# Scope is deliberately `stage` only (owner, 2026-08-28). Stage is where the cascade lands before
# production, pushes to it are infrequent, and keeping the job off `develop` and every pull request
# means this cannot slow the day-to-day loop while the suites' true state is still unknown.
#
# NOT a required status check, on purpose. These suites have never run in CI, so the first runs may
# well be red — that is the information this workflow exists to surface, and it should surface it
# without blocking the cascade. Promote it to a required check once it has been green for a while.
on:
  # So the suites can be exercised on demand from any branch that carries this file, without
  # waiting for a cascade to land on stage.
  workflow_dispatch:
    inputs:
      parallel:
        description: 'Projects tested at once (nx --parallel). Lower it if a large branch runs out of memory.'
        required: false
        default: '2'

concurrency:
  group: gauzy-sweep-targeted-tests-${{ github.ref }}
  # Deliberately NOT `cancel-in-progress: true`. A cancelled test run produces no verdict, and a
  # gate that reports nothing is worse than no gate: this repository's sibling project already lost
  # a stage e2e gate that way — six consecutive runs cancelled by the next push, so the gate never
  # once said pass or fail. Pushes to `stage` are infrequent, so queueing costs very little here.
  cancel-in-progress: false

# Least-privilege scope for the automatic GITHUB_TOKEN: this job only reads the checkout.
permissions:
  contents: read

env:
  # Same archive name the build workflow uses, so the restore script finds what it expects.
  NODE_MODULES_ARCHIVE: node-modules.tar.zst

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-24.04' }}
    # A cold dependency install on this fleet is measured in hours, not minutes (the build workflow
    # documents 88 min / 3h20m / 3h46m for the same work). The ceiling costs nothing on the warm
    # path, which is a cache lookup.
    #
    # 720, not 360: run 40080742318 (2026-10-24) missed the archive, spent 2h09m installing, then
    # ran tests for 3h48m and was cut by the 6 h limit at 842 passed suites, with no verdict.
    # Self-hosted runners allow jobs of up to 5 days; GitHub-hosted runners (the fallback when
    # RUNNER_LINUX_X64_8 is unset) stay capped at 6 h whatever this says.
    timeout-minutes: 720
    steps:
      # Action versions deliberately match `build.yml` rather than the newer majors used elsewhere in
      # the repository: this job consumes the node_modules cache that workflow writes, so the
      # producer and the consumer are kept on the same actions.
      - uses: actions/checkout@v7
        with:
          # This job only reads the tree — it never pushes — so the checkout credential does not need
          # to outlive the step in `.git/config`.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Restore node_modules archive
        # Best effort: the same key the build workflow writes, so a stage push that already built
        # this exact lockfile reuses that tree instead of installing again. `restore-node-modules.sh`
        # below installs from scratch when the archive is not there, so a miss is not fatal.
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ env.NODE_MODULES_ARCHIVE }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-modules-${{ hashFiles('yarn.lock', 'package.json', 'patches/**', '.scripts/postinstall.js') }}

      # Route any install through the internal Verdaccio cache. Placed AFTER the cache restore
      # because this action rewrites yarn.lock's resolved URLs, and `hashFiles()` in the key above
      # evaluates at step runtime — configuring the registry first would move the key and split the
      # cache namespace by VIP reachability.
      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@aa4ee19926fabcf820aa1294385a76aec6bdb548
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_8 != '' }}

      - name: Restore node_modules
        shell: bash
        # Unpacks the archive, or installs from scratch when it is unavailable. One step, so there
        # is no `if:` on a previous step's outcome to get wrong.
        run: .github/scripts/restore-node-modules.sh

      - name: Generate the Angular environment file
        # `packages/ui-config/src/lib/environments/environment.ts` is generated (and gitignored), so a
        # fresh checkout has none — and every spec that reaches `@gauzy/ui-config`, directly or through
        # ui-core, failed to load with "Cannot find module './lib/environments/environment'" (about a
        # dozen Angular projects). Same command the Playwright workflow runs before it builds the web
        # app. It goes through yarn, not Nx, so `.env.local` is not loaded here either.
        run: yarn config:dev

      - name: Run the 105 suites the 9bbd8c1592 run did not reach, and the embed credential spec of #12091
        env:
          NX_LOAD_DOT_ENV_FILES: 'false'
        run: |
          status=0
          J='node node_modules/jest/bin/jest.js'
          export NODE_OPTIONS='--experimental-vm-modules --max-old-space-size=24576'
          $J -c packages/core/jest.config.ts --runInBand --ci packages/core/src/lib/auth/auth-switches/admin-password-reset.spec.ts packages/core/src/lib/auth/auth-switches/registration-policy.service.spec.ts packages/core/src/lib/auth/auth-switches/self-registration.guard.spec.ts packages/core/src/lib/auth/auth.service.access-token-size.spec.ts packages/core/src/lib/auth/auth.service.email-links.spec.ts packages/core/src/lib/auth/auth.service.embed-session.spec.ts packages/core/src/lib/auth/auth.service.login-attempt.spec.ts packages/core/src/lib/auth/auth.service.placeholder-account.spec.ts packages/core/src/lib/auth/auth.service.teams-of-deleted-organization.spec.ts packages/core/src/lib/auth/auth.service.workspace-email.spec.ts packages/core/src/lib/auth/email-confirmation.service.email-links.spec.ts packages/core/src/lib/auth/events/handlers/user-email-changed.handler.spec.ts packages/core/src/lib/auth/oauth-app-first-party.spec.ts packages/core/src/lib/auth/strategies/jwt.strategy.oauth-app-scope.spec.ts packages/core/src/lib/auth/strategies/jwt.strategy.user-api-token.spec.ts packages/core/src/lib/auth/two-factor/recovery-codes.spec.ts packages/core/src/lib/auth/two-factor/totp.spec.ts packages/core/src/lib/auth/two-factor/two-factor-challenge.spec.ts packages/core/src/lib/auth/two-factor/two-factor-secret.spec.ts packages/core/src/lib/auth/two-factor/two-factor-switch.spec.ts packages/core/src/lib/auth/two-factor/two-factor.controller.spec.ts packages/core/src/lib/auth/user-api-token/user-api-token.entity.spec.ts packages/core/src/lib/auth/user-api-token/user-api-token.utils.spec.ts packages/core/src/lib/auth/user-session/user-session-claims.spec.ts packages/core/src/lib/auth/user-session/user-session-client.spec.ts packages/core/src/lib/auth/user-session/user-session-revocation.spec.ts packages/core/src/lib/core/context/mikro-orm-context.spec.ts packages/core/src/lib/core/context/request-context-ip.spec.ts packages/core/src/lib/database/activity-tenant-org-