# The measurement domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists
# once for the whole platform, so a domain adds fields to it and never declares its own.

extend type Query {
	unitCategories: [UnitCategory!]!
	unitCategory(id: ID!): UnitCategory
	units(categoryId: ID): [Unit!]!
	unit(id: ID!): Unit
}

extend type Mutation {
	createUnitCategory(input: CreateUnitCategoryInput!): UnitCategory!
	updateUnitCategory(input: UpdateUnitCategoryInput!): UnitCategory!
	createUnit(input: CreateUnitInput!): Unit!
	updateUnit(input: UpdateUnitInput!): Unit!
	archiveUnit(id: ID!): Boolean!
	archiveUnitCategory(id: ID!): Boolean!
	convertQuantity(value: String!, fromUnitId: ID!, toUnitId: ID!): UnitConversion!
	"""
	Withdraws a unit without removing it — `DELETE /units/:id/soft`. It requires the edit grant the change
	requires, as the route does: a role that may only read cannot withdraw one.
	"""
	softDeleteUnit(id: ID!): Unit!
	"""
	Restores a withdrawn unit — `PUT /units/:id/recover` — under the same edit grant: restoring undoes a removal.
	"""
	recoverUnit(id: ID!): Unit!
	"""
	Withdraws a unit category without removing it — `DELETE /unit-categories/:id/soft`. It requires the edit grant the change
	requires, as the route does: a role that may only read cannot withdraw one.
	"""
	softDeleteUnitCategory(id: ID!): UnitCategory!
	"""
	Restores a withdrawn unit category — `PUT /unit-categories/:id/recover` — under the same edit grant: restoring undoes a removal.
	"""
	recoverUnitCategory(id: ID!): UnitCategory!
}
