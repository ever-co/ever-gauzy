# The settlement-term domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists
# once for the whole platform, so a domain adds fields to it and never declares its own.

extend type Query {
	paymentTerms: [PaymentTerm!]!
	paymentTerm(id: ID!): PaymentTerm
	paymentTermSchedule(id: ID!, total: String!, basisDate: String!, currencyDecimals: Int, currency: String): PaymentTermSchedule!
}

extend type Mutation {
	createPaymentTerm(input: CreatePaymentTermInput!): PaymentTerm!
	updatePaymentTerm(input: UpdatePaymentTermInput!): PaymentTerm!
	updatePaymentTermLines(input: UpdatePaymentTermLinesInput!): PaymentTerm!
	archivePaymentTerm(id: ID!): Boolean!
}
