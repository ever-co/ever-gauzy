# The organization employment type's object type.
#
# An employment type is the vocabulary an organization classifies its people by — full time, part time,
# contractor — as a name and the base row. It is filed under the organization, which is what makes it a
# sub-resource of the organization rather than a platform-wide list.
#
# The row carries nothing else of its own. Its three collections — the tags attached to it, the
# employees classified under it and the candidates classified under it — are pivots the delivered list
# read joins only when a REST caller names them in its query string, which this surface never does.
# They have no identifier column to carry either: who is classified under a type is read from the
# employee and the candidate, whose own rows are what carry the classification.
#
# The base row's identifiers, timestamps and lifecycle columns are carried in full, because they are
# what every surface of this platform answers about a row — and because withdrawing and restoring are
# delivered routes whose whole effect is the `deletedAt` column.

"""
One classification an organization files its people under.
"""
type OrganizationEmploymentType {
	id: ID!
	"The type's name, as the organization writes it."
	name: String!
	"The organization the type is filed under, by identifier."
	organizationId: ID
	"The tenant the type belongs to, by identifier."
	tenantId: ID
	"""
	When the type was withdrawn, or null while it is live. Withdrawing and restoring are delivered
	routes — the two removals this resource serves — and this column is the whole of what they write.
	"""
	deletedAt: DateTime
	"When the type was archived, as opposed to withdrawn."
	archivedAt: DateTime
	"When the type was filed."
	createdAt: DateTime
	"When the type was last changed."
	updatedAt: DateTime
	"Whether the type is active. A flag an operator sets, not a statement about the row's lifecycle."
	isActive: Boolean
	"Whether the type is archived. A flag an operator sets, not a statement about the row's lifecycle."
	isArchived: Boolean
	"The person who filed the type, by identifier. The user row is not joined by this surface's read."
	createdByUserId: ID
	"The person who last changed the type, by identifier. The user row is not joined by this surface's read."
	updatedByUserId: ID
	"The person who withdrew the type, by identifier. The user row is not joined by this surface's read."
	deletedByUserId: ID
}

"""
The boundary of one page of employment types.
"""
type OrganizationEmploymentTypeEdge {
	node: OrganizationEmploymentType!
	cursor: String!
}

"""
One page of employment types, with the total the filters select and the boundary cursors.
"""
type OrganizationEmploymentTypeConnection {
	nodes: [OrganizationEmploymentType!]!
	edges: [OrganizationEmploymentTypeEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields an employment-type list may be sorted by.
"""
enum OrganizationEmploymentTypeSortField {
	createdAt
	updatedAt
	name
}

"""
The order the employment types are returned in. At most three keys are accepted.
"""
input OrganizationEmploymentTypeSort {
	field: OrganizationEmploymentTypeSortField!
	direction: SortDirection!
}

"""
The fields an employment-type list may be narrowed by.

The collections are not among them, and that is the point rather than an omission: the delivered list
read does not join the tag pivot, the member pivot or the candidate pivot unless a REST caller names
it, and this surface names none — so a filter on one of them would be evaluated against a row that
carries none and would select nothing at all, which is the worst answer a filter can give.
"""
input OrganizationEmploymentTypeFilter {
	id: IDFilter
	name: StringFilter
	organizationId: IDFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	isActive: BooleanFilter
	isArchived: BooleanFilter
	and: [OrganizationEmploymentTypeFilter!]
	or: [OrganizationEmploymentTypeFilter!]
	not: OrganizationEmploymentTypeFilter
}

"""
What a caller states when it files an employment type.

The organization is stated because the delivered create does not derive one: the tenant is stamped
from the credential, never from an argument, but the organization is a member the caller names and the
delivered route validates against the caller's own memberships. There is no member for the tenant, for
the same reason there is none on any other write here.
"""
input CreateOrganizationEmploymentTypeInput {
	organizationId: ID!
	name: String!
}

"""
What a caller states when it edits an employment type that exists.

The identifier is the only member stated outside the body, and it is stated because the delivered
route carries it in the path. **The delivered edit writes through the create path** — it hands the
service the stated body with the path identifier merged in — so it is an upsert rather than a
replacement: a member the caller leaves out is left as it is, and the answer is the row rather than a
statement about the write.
"""
input UpdateOrganizationEmploymentTypeInput {
	id: ID!
	organizationId: ID
	name: String
}
