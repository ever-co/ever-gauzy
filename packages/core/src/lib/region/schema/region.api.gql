# The region domain's root fields.
#
# `Query`, `Mutation` and `Subscription` are declared by the kernel and extended here. The names are
# the ones the GraphQL API specification fixes for this resource, so the REST routes and these fields
# expose the same capabilities under the same words — including the two set operations, which are the
# operations the administration surface actually offers.

extend type Query {
	"""
	The regions of the caller's organization, newest first.
	"""
	regions(
		filter: RegionFilter
		sort: [RegionSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
	): RegionConnection!

	"""
	One region of the caller's organization, or null when there is none.
	"""
	region(id: ID!): Region
}

extend type Mutation {
	"""
	Opens a commercial geography. The currency is checked against the platform's currency master
	before the row is written.
	"""
	createRegion(input: CreateRegionInput!): Region!

	"""
	Changes the descriptive facts of a region. A new currency is re-checked against the master.
	"""
	updateRegion(input: UpdateRegionInput!): Region!

	"""
	Retires a region: it keeps its rows and is no longer offered by its channels. The supported path,
	because a cart, a tax rate and a price list may all name it.
	"""
	deleteRegion(id: ID!): Region!

	"""
	Claims the organization's default region, releasing the flag from the previous holder.
	"""
	setDefaultRegion(id: ID!): Region!

	"""
	Replaces the served-country set. The operation is a set: the members stated are written and the
	ones left out are withdrawn in one transaction.
	"""
	replaceRegionCountries(input: ReplaceRegionCountriesInput!): [RegionCountry!]!
}

extend type Subscription {
	"""
	Every change to a region of the caller's tenant: a creation, an edit, a default change, a
	retirement, or a country-set replacement. The stream is narrowed by `regionId` and by `action`;
	both only ever narrow what the credential may already read.

	A subscription is a notification and never a system of record: an event produced while the client
	is disconnected is not replayed, and a client that must not miss one registers a webhook.
	"""
	regionChanged(regionId: ID, action: String): Region!
}
