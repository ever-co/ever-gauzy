# The organization language domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists
# once for the whole platform, so a domain adds fields to it and never declares its own.
#
# **The controller declares four routes and inherits five.** Its list, its create, its edit and its
# removal are its own; the count, the paginated list, the one-row read and the two lifecycle moves come
# from the CRUD base it extends. Inherited is not the same as absent — Nest registers an inherited
# handler with the decorators it carries — so this surface mirrors all nine, and the two list routes
# fold into one connection because they answer one question.
#
# **No field here states a permission, and that is the parity rather than an omission.** The delivered
# controller carries `TenantPermissionGuard` on the class and no `@Permissions` anywhere — not on the
# four routes it declares and not on any of the five it inherits — so every one of its routes is
# tenant-guarded and otherwise unpermissioned. A field that demanded a permission would refuse a caller
# the REST route serves, which is the asymmetry the two-protocol rule forbids; tightening the resource
# is a change to make in both places at once, and it is not this delivery's to make.
#
# The list is a connection rather than a bare array. It takes the same query protocol the REST list
# route takes — the same filters in `filter`, the same keys in `sort`, the same page in `page` — and
# answers with the same shape the kernel's `PageInfo` gives every other connection. `withDeleted` is
# offered because the delivered list route offers it: the paginated spelling of that list takes
# `BaseQueryDTO`, which carries the member, and hands its query string straight to the same read — so
# a REST caller can ask for withdrawn rows and a connection that could not would hide them.
#
# `organizationLanguageCount` takes no filter, and that is a statement rather than an omission. The
# delivered count route passes its query string through as the store's own `where`, which the
# connection protocol does not speak.

extend type Query {
	"""
	The languages of the caller's tenant, newest first.
	"""
	organizationLanguages(
		filter: OrganizationLanguageFilter
		sort: [OrganizationLanguageSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
		withDeleted: Boolean
	): OrganizationLanguageConnection!

	"""
	One language row of the caller's tenant, or null when there is none.
	"""
	organizationLanguage(id: ID!): OrganizationLanguage

	"""
	How many language rows the caller's tenant keeps.
	"""
	organizationLanguageCount: Int
}

extend type Mutation {
	"""
	Files a language row.
	"""
	createOrganizationLanguage(input: CreateOrganizationLanguageInput!): OrganizationLanguage!

	"""
	Changes the stated facts of a language row. A member the caller leaves out is left as it is, because
	the delivered edit is a partial column update rather than a replacement of the row.
	"""
	updateOrganizationLanguage(input: UpdateOrganizationLanguageInput!): OrganizationLanguage!

	"""
	Removes a language row outright. Nothing points at it from this domain.
	"""
	deleteOrganizationLanguage(id: ID!): Boolean!

	"""
	Withdraws a language row without removing it: the row keeps its identifier and the delivered list
	stops answering it.
	"""
	softDeleteOrganizationLanguage(id: ID!): OrganizationLanguage!

	"""
	Puts a withdrawn language row back.
	"""
	recoverOrganizationLanguage(id: ID!): OrganizationLanguage!
}
