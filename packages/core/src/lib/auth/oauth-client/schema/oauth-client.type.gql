# The OAuth client registry's object types.
#
# A registered third party is addressed two ways. `id` is the row's own identifier — what an
# administrator reads in the registry list and what the revoke and rotation routes take in their path —
# and `clientId` is the public identifier the third party itself presents at `/authorize` and `/token`.
# Both are carried, because the two are different facts about one row and a caller that holds only one
# of them asks a different question.
#
# **The three secret columns are not members, and each is refused for its own reason.**
#
# - `clientSecretHash` is the scrypt hash of the client secret. The row marks it `select: false` and the
#   delivered read projection strips it, so a member for it would answer `undefined` on every row a read
#   produced and only a row a write happened to answer would carry it — a member whose presence depends
#   on which code path produced the row. It is also a credential in hashed form: a hash is what a
#   guessed secret is checked against.
# - `codeSecret` is the per-client HMAC key authorization codes are signed with. It never leaves the
#   row on any delivered route — not on a read, not on a create, not on a rotation — so there is no
#   delivered answer that carries it and nothing here may invent one. A caller holding it could forge
#   an authorization code for this client.
# - the plaintext `clientSecret` is not a member of this type either. It is answered exactly once, by
#   the creation and by the rotation, and it therefore belongs to the answer of those two operations
#   rather than to the row: `OAuthClientSecret` below is that answer. A member here would make the
#   secret projectable from every read of the registry, which is the one thing its single delivery is
#   designed to prevent.
#
# `clientType` and `allowedGrantTypes` are carried as their delivered values rather than declared as
# schema enums. The vocabularies are `OAuthClientType` and `OAuthGrantType` in the platform's contract
# package, which types the columns and which the registry's own filtering reads; declaring them again
# in this file would be a second declaration of a value set this domain does not own, and the second
# one would drift the day a grant type is added. The two value sets are stated in the descriptions so a
# client does not have to guess them.
#
# **The three list columns are `JSON`, because that is what their columns are.** `redirectUris`,
# `allowedScopes` and `allowedGrantTypes` are document columns: the entity stores each of them through
# the platform's JSON decorator, and what the store holds is a document rather than a delimited string.
# A typed list here would promise a shape the read does not enforce — the delivered body validates the
# three when a client is registered, but a read re-validates nothing, so a row written by anything other
# than that body would turn a response into an error rather than being carried through as what it is.
# The values on the wire are the same either way: the document is an array of strings.
#
# The audit and tenancy columns the row inherits are carried selectively. `tenantId` is, because a
# super administrator sees the installation-wide rows beside its tenant's and has to be able to tell
# them apart: a null tenant is exactly the global client. `deletedAt` is not, because the delivered read
# projection does not answer it — the registry list excludes withdrawn rows and the revoke route
# answers no content — so the member would be absent on every row this surface can reach.
# `createdByUserId`, `updatedByUserId` and `isArchived` are not carried, which is the convention every
# object type here follows: bookkeeping about the write is not a fact about the client.

"""
One registered OAuth client: a third party allowed to obtain authorization codes and exchange them for
tokens, together with what it may ask for.
"""
type OAuthClient {
	id: ID!
	"The public identifier the third party presents. Generated by the server, never stated by a caller."
	clientId: String!
	"The name an administrator reads in the registry."
	name: String!
	"A short description shown beside the name."
	description: String
	"""
	Which kind of client this is: `confidential` (holds a secret, authenticates server-to-server) or
	`public` (cannot keep one, authenticates with PKCE). Only confidential clients may be registered at
	present, so every row this surface answers currently carries `confidential`.
	"""
	clientType: String!
	"The redirect URIs the authorization code flow may return to. Exact matches only."
	redirectUris: JSON!
	"The scopes the client may request. A client that requests one outside this list is refused."
	allowedScopes: JSON!
	"""
	The grant types the client may use: `authorization_code`, `refresh_token` or
	`client_credentials`. Only `authorization_code` is implemented end to end; the others are accepted
	by the registry and refused at the token exchange until they ship.
	"""
	allowedGrantTypes: JSON!
	"Whether the client states that PKCE is required of it."
	pkceRequired: Boolean!
	"The lifetime of an access token this client is issued, in seconds."
	accessTokenTtl: Int!
	"The lifetime of a refresh token this client is issued, in seconds."
	refreshTokenTtl: Int!
	"Whether the client is still resolvable. A withdrawn client answers `false`."
	isActive: Boolean
	"""
	The tenant the client belongs to, or null when it is an installation-wide client. A null tenant is
	the row the delivered lookup resolves for any tenant, which is how the legacy single-client
	configuration is represented.
	"""
	tenantId: ID
	createdAt: DateTime
	updatedAt: DateTime
}

# What the creation and the rotation answer with.
#
# The plaintext secret travels in this type and nowhere else. It is generated server-side, hashed into
# the row and answered exactly once, so a caller that loses it has to rotate rather than read it back —
# which is what makes a leaked response, rather than a leaked store, the only way the value escapes.
#
# The answer is carried as the client and its secret beside each other rather than as the row with one
# more member, because the two are read differently: the client is a row this surface answers on every
# read, and the secret is a value that exists for this answer only.
"""
The client a registration or a rotation produced, beside the plaintext secret those two operations
answer and no read repeats.
"""
type OAuthClientSecret {
	"The client the secret belongs to, with every member the registry read answers."
	client: OAuthClient!
	"""
	The plaintext client secret. Answered once here and never again: it is not a member of
	`OAuthClient` and no read of the registry carries it.
	"""
	clientSecret: String!
}

"""
The boundary of one page of registered clients.
"""
type OAuthClientEdge {
	node: OAuthClient!
	cursor: String!
}

"""
One page of registered clients, with the total the filters select and the boundary cursors.
"""
type OAuthClientConnection {
	nodes: [OAuthClient!]!
	edges: [OAuthClientEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields a registry list may be sorted by.
"""
enum OAuthClientSortField {
	createdAt
	updatedAt
	name
	clientId
	clientType
	accessTokenTtl
	refreshTokenTtl
}

"""
The order the registry list is returned in. At most three keys are accepted.
"""
input OAuthClientSort {
	field: OAuthClientSortField!
	direction: SortDirection!
}

"""
The fields a registry list may be narrowed by. `and` is the default; `or` requires any of its members
and `not` excludes the rows that match it.

`tenantId: { isNull: true }` selects the installation-wide clients — the rows the delivered lookup
resolves for every tenant. The three secret columns are not filterable, for the same reason they are not
members: a filter is a comparison against the row's own value, so a condition on a hash would answer
whether a guessed credential is the right one, one character at a time. `redirectUris`, `allowedScopes`
and `allowedGrantTypes` are not filterable either. They are documents, and the one operator the protocol
offers on a document is a substring match against its text form: a condition on a redirect URI would
answer a match on part of a longer URL, and one on a scope would answer a match on the beginning of a
longer scope name. Neither is the question a caller means to ask.
"""
input OAuthClientFilter {
	id: IDFilter
	clientId: StringFilter
	name: StringFilter
	description: StringFilter
	clientType: StringFilter
	pkceRequired: BooleanFilter
	accessTokenTtl: NumberFilter
	refreshTokenTtl: NumberFilter
	isActive: BooleanFilter
	tenantId: IDFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	and: [OAuthClientFilter!]
	or: [OAuthClientFilter!]
	not: OAuthClientFilter
}

"""
What a caller states when it registers a client.

`clientId`, the client secret and the code-signing secret are members of no input, at any point in the
resource's life. All three are generated server-side: a caller that could name its own client identifier
could collide with another registration, and a caller that could name its own secret would choose a
value the platform's own generator is there to make unguessable. The answer carries the secret; the
request never states it.

The tenant is not a member either, and that is a security statement rather than an omission. The
delivered create stamps the caller's own tenant, and it only writes an installation-wide row (a null
tenant) for a super administrator — a privilege the service checks from the credential, which is a
decision this surface cannot and must not restate as an argument.
"""
input CreateOAuthClientInput {
	"The name an administrator reads in the registry."
	name: String!
	"A short description shown beside the name."
	description: String
	"""
	Which kind of client to register. Omit for `confidential`, which is the delivered default. `public`
	is accepted by this input because the delivered body accepts it, and the service refuses it with a
	stated reason until PKCE enforcement ships — which is the same answer the REST body gets.
	"""
	clientType: String
	"The redirect URIs the flow may return to. At least one is required, and each is matched exactly."
	redirectUris: JSON!
	"The scopes the client may request. Omit to grant none."
	allowedScopes: JSON
	"Omit for `authorization_code`, which is the delivered default."
	allowedGrantTypes: JSON
	"Whether the client states that PKCE is required of it. Omit for the delivered default, `false`."
	pkceRequired: Boolean
	"The access token lifetime in seconds. Omit for the delivered default of one day."
	accessTokenTtl: Int
	"The refresh token lifetime in seconds. Omit for the delivered default of thirty days."
	refreshTokenTtl: Int
}

"""
What a caller states when it changes a client that exists.

The members are the delivered edit's own: `clientId`, the client secret and the code-signing secret are
absent because the route that changes a client cannot touch them, and the rotation below is the only
route that replaces a secret.

**A member that is absent is left as it is**, which is what the delivered edit does: it hands the store
the members the body carried and nothing else. Stating a member as `null` states it explicitly, which is
what clears a nullable column such as `description`.
"""
input UpdateOAuthClientInput {
	id: ID!
	name: String
	description: String
	redirectUris: JSON
	allowedScopes: JSON
	allowedGrantTypes: JSON
	pkceRequired: Boolean
	accessTokenTtl: Int
	refreshTokenTtl: Int
	"Whether the client is still resolvable. Setting it false is a second way to disable a client."
	isActive: Boolean
}
