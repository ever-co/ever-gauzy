	nodes: [TaskStatus!]!
	edges: [TaskStatusEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields a status list may be sorted by.
"""
enum TaskStatusSortField {
	createdAt
	updatedAt
	name
	value
	order
	isSystem
}

"""
The order the statuses are returned in. At most three keys are accepted.
"""
input TaskStatusSort {
	field: TaskStatusSortField!
	direction: SortDirection!
}

"""
The fields a status list may be narrowed by.
"""
input TaskStatusFilter {
	id: IDFilter
	name: StringFilter
	value: StringFilter
	description: StringFilter
	order: NumberFilter
	icon: StringFilter
	color: StringFilter
	isSystem: BooleanFilter
	isCollapsed: BooleanFilter
	isDefault: BooleanFilter
	isTodo: BooleanFilter
	isInProgress: BooleanFilter
	isDone: BooleanFilter
	projectId: IDFilter
	organizationTeamId: IDFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	and: [TaskStatusFilter!]
	or: [TaskStatusFilter!]
	not: TaskStatusFilter
}

"""
What a caller states when it files a status.

`template` names one of the delivered workflow templates — `TODO`, `IN_PROGRESS` or `DONE` — and the
delivered create merges that workflow's flags onto the row it writes. It is a member of the delivered
body and of no column, which is why it is offered on the write and not on the type.

`isSystem` is not a member: the column is the platform's own mark on the rows it maintains, and a
caller that could set it would file a row the removal route refuses to remove.
"""
input CreateTaskStatusInput {
	organizationId: ID
	name: String!
	value: String!
	description: String
	order: Int
	icon: String
	color: String
	isCollapsed: Boolean
	isDefault: Boolean
	isTodo: Boolean
	isInProgress: Boolean
	isDone: Boolean
	projectId: ID
	organizationTeamId: ID
	template: String
}

"""
What a caller states when it changes a status. Every member but the identifier is optional.
"""
input UpdateTaskStatusInput {
	id: ID!
	organizationId: ID
	name: String
	value: String
	description: String
	order: Int
	icon: String
	color: String
	isCollapsed: Boolean
	isDefault: Boolean
	isTodo: Boolean
	isInProgress: Boolean
	isDone: Boolean
	projectId: ID
	organizationTeamId: ID
	template: String
}

"""
One step the status board is dragged into.

`order` is the whole member set: the delivered route writes that one column per row and never moves
the rows' other facts.
"""
input TaskStatusOrderInput {
	id: ID!
	order: Int!
}

"""
One step of a status reordering, as the delivered route answers it back.
"""
type TaskStatusOrder {
	id: ID!
	order: Int!
}

"""
The outcome of a status reordering: whether it succeeded, and the list it wrote.
"""
type TaskStatusReorderResult {
	success: Boolean!
	list: [TaskStatusOrder!]
}

