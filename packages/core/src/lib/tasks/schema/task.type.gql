# The work-tracking domain's object types.
#
# A task is the platform's unit of work: a warehouse picking job, a fulfilment exception and a seller
# onboarding step are all rows of this one table, and everything the platform records *about* work —
# how long it is estimated to take, what it is blocked by, what labels it carries, when it is planned
# — hangs off it rather than off a second table invented beside it.
#
# Every type here is declared once, by this file, and every root field that answers with one is in
# `task.api.gql` beside it. Two members are deliberately shared rather than re-declared:
#
# - **a task's labels are tags.** The platform already has one labelling concept, and a task carries
#   it through the `tag_task` pivot it owns. There is no `TaskLabel` type here and no second labelling
#   table anywhere: the labels of a task are `Tag` rows, served by the tag domain's own surface, and
#   the tag connection this domain refers to is declared by `tags/schema/tag.type.gql`.
# - **a task's status, size, priority, version, type and related-issue type are rows of their own
#   resources**, not a closed enum. They are declared here as the six types below and referenced from
#   a task by identifier (`taskStatusId`, `taskSizeId`, …), so an installation extends its own
#   vocabulary by writing rows and never by changing the schema. The *value* columns a task also
#   carries (`status`, `priority`, `size`, `issueType`) are the delivered denormalised copies of those
#   rows and are carried as their string value for the same reason: the value set belongs to the rows,
#   which the operator maintains.
#
# Money never appears on this domain. The one numeric member that is not a count is a *duration*, and
# each such member says in its own description which unit it is in — an estimate in hours, a planned
# day in minutes — because a duration read without its unit is a number nobody can use.

# ------------------------------------------------------------------------------------------------
# The unit of work
# ------------------------------------------------------------------------------------------------

"""
One unit of work.
"""
type Task {
	id: ID!
	"The task's title, which is what every list and every notification shows."
	title: String!
	"The task's number within its project. Null on a task filed without a project."
	number: Int
	"The project's prefix, stamped onto the task when it was filed."
	prefix: String
	"What the task is about."
	description: String
	"""
	The task's lifecycle, as the denormalised value of the status row it points at (`taskStatusId`).
	Carried as its string value rather than declared as a schema enum: the value set is the status
	rows' own, and an operator who adds a status adds a row.
	"""
	status: String
	"The task's urgency, as the value of the priority row it points at (`taskPriorityId`)."
	priority: String
	"The task's size, as the value of the size row it points at (`taskSizeId`)."
	size: String
	"The task's kind, as the value of the issue-type row it points at (`taskTypeId`)."
	issueType: String
	"""
	How long the task is estimated to take, **in hours**. A duration rather than an amount, so a
	`Float` and not a `Decimal`: the delivered column documents its unit as hours and the estimate is
	frequently fractional.
	"""
	estimate: Float
	"When work on the task is scheduled to start."
	startDate: DateTime
	"When the task is due."
	dueDate: DateTime
	"When the task was marked resolved."
	resolvedAt: DateTime
	"Whether the task is visible beyond the people it is assigned to."
	public: Boolean
	"The release or build the task is filed against, as free text."
	version: String
	"Whether the task is still being written and is not yet offered for work."
	isDraft: Boolean
	"""
	Whether the task is a screening task — one that is decided on before it becomes work. The
	screening resource's own row is served by `ScreeningTask` beside this type.
	"""
	isScreeningTask: Boolean
	"The parent task, when this task is a sub-task of one. Null on a root task."
	parentId: ID
	"The project the task belongs to."
	projectId: ID
	"The sprint the task is worked in."
	organizationSprintId: ID
	"The status row the task points at. The row itself is a `TaskStatus`."
	taskStatusId: ID
	"The size row the task points at. The row itself is a `TaskSize`."
	taskSizeId: ID
	"The priority row the task points at. The row itself is a `TaskPriority`."
	taskPriorityId: ID
	"The issue-type row the task points at. The row itself is an `IssueType`."
	taskTypeId: ID
	"""
	The epic this task descends from. Populated by the one-row query alone, and only when the caller
	asks for it: the delivered reader walks the parent chain with a recursive query that no list read
	performs, so on a connection's rows the member is absent.
	"""
	rootEpic: Task
	"""
	When the task was withdrawn, or null while it is live. Withdrawing a task is the delivered
	removal route, and this column is the whole of what it writes.
	"""
	deletedAt: DateTime
	createdAt: DateTime
	updatedAt: DateTime
	isActive: Boolean
	isArchived: Boolean
	tenantId: ID
	organizationId: ID
}

"""
The boundary of one page of tasks.
"""
type TaskEdge {
	node: Task!
	cursor: String!
}

"""
One page of tasks, with the total the filters select and the boundary cursors.
"""
type TaskConnection {
	nodes: [Task!]!
	edges: [TaskEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields a task list may be sorted by.
"""
enum TaskSortField {
	createdAt
	updatedAt
	number
	title
	startDate
	dueDate
	resolvedAt
	status
	priority
	size
	issueType
	estimate
}

"""
The order the tasks are returned in. At most three keys are accepted.
"""
input TaskSort {
	field: TaskSortField!
	direction: SortDirection!
}

"""
The fields a task list may be narrowed by. `and` is the default; `or` requires any of its members and
`not` excludes the rows that match it.

Every member is a column of the task row, which is what the connection protocol can evaluate over the
rows a delivered reader answers. The three narrowings that are *not* columns are deliberately absent,
each because it is a root field of its own rather than a filter that could not be honoured:

- who a task is assigned to is a `task_employee` pivot the list reader does not join, so it is
  `myTasks` and `employeeTasks`;
- which team works a task is a `task_team` pivot, so it is `teamTasks`;
- which module a task belongs to is a `project_module_task` pivot, so it is `moduleTasks`.

A filter on one of those would be evaluated against a row that carries none of them and would select
nothing at all, which is the worst answer a filter can give.
"""
input TaskFilter {
	id: IDFilter
	number: NumberFilter
	prefix: StringFilter
	title: StringFilter
	description: StringFilter
	status: StringFilter
	priority: StringFilter
	size: StringFilter
	issueType: StringFilter
	estimate: NumberFilter
	startDate: DateTimeFilter
	dueDate: DateTimeFilter
	resolvedAt: DateTimeFilter
	public: BooleanFilter
	version: StringFilter
	isDraft: BooleanFilter
	isScreeningTask: BooleanFilter
	parentId: IDFilter
	projectId: IDFilter
	organizationSprintId: IDFilter
	taskStatusId: IDFilter
	taskSizeId: IDFilter
	taskPriorityId: IDFilter
	taskTypeId: IDFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	and: [TaskFilter!]
	or: [TaskFilter!]
	not: TaskFilter
}

"""
What a caller states when it files a task.

The organization is stated because the delivered body states it and the handler stamps it onto the
row; the tenant is not, because the delivered handler reads it from the credential and overwrites
whatever a body carries.

The relations are stated as identifiers and handed to the write as the rows the delivered handler
reads: `members` are the employees the task is assigned to, `teams` the teams working it, `modules`
the project modules it belongs to, and `tags` the labels it carries. `mentionEmployeeIds` is not a
relation at all — it is the list the handler mentions after the row is written.
"""
input CreateTaskInput {
	organizationId: ID!
	title: String!
	description: String
	status: String
	priority: String
	size: String
	issueType: String
	"An estimate **in hours** — see `Task.estimate`."
	estimate: Float
	startDate: DateTime
	dueDate: DateTime
	resolvedAt: DateTime
	public: Boolean
	version: String
	isDraft: Boolean
	isScreeningTask: Boolean
	parentId: ID
	projectId: ID
	organizationSprintId: ID
	taskStatusId: ID
	taskSizeId: ID
	taskPriorityId: ID
	taskTypeId: ID
	"The labels the task carries. Tags are the platform's one labelling concept."
	tagIds: [ID!]
	"The employees the task is assigned to."
	memberIds: [ID!]
	"The teams working the task."
	teamIds: [ID!]
	"The project modules the task belongs to."
	moduleIds: [ID!]
	"The employees the write mentions once the task exists."
	mentionEmployeeIds: [ID!]
}

"""
What a caller states when it edits a task that exists.

The delivered edit route binds the same body the create route binds, so `organizationId` and `title`
are required here exactly as they are there. The handler dispatches the delivered update, which reads
the row, proves it is the caller's, and writes the columns the body states.
"""
input UpdateTaskInput {
	id: ID!
	organizationId: ID!
	title: String!
	description: String
	status: String
	priority: String
	size: String
	issueType: String
	"An estimate **in hours** — see `Task.estimate`."
	estimate: Float
	startDate: DateTime
	dueDate: DateTime
	resolvedAt: DateTime
	public: Boolean
	version: String
	isDraft: Boolean
	isScreeningTask: Boolean
	parentId: ID
	projectId: ID
	organizationSprintId: ID
	taskStatusId: ID
	taskSizeId: ID
	taskPriorityId: ID
	taskTypeId: ID
	tagIds: [ID!]
	memberIds: [ID!]
	teamIds: [ID!]
	moduleIds: [ID!]
	mentionEmployeeIds: [ID!]
	"Why the task moved between sprints, when the delivered update moved it."
	taskSprintMoveReason: String
}

