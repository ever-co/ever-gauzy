# ------------------------------------------------------------------------------------------------
# The vocabulary, in one answer
# ------------------------------------------------------------------------------------------------

"""
Which sections of the vocabulary a caller asks for by name.
"""
enum TaskMetadataSection {
	taskStatuses
	taskPriorities
	taskSizes
	taskLabels
	taskVersions
	issueTypes
	relatedIssueTypes
}

"""
The vocabulary one board needs, answered in one request.

Each member is the connection its own root field answers, narrowed the same way and built by the same
codec, so a caller that walks a page here can resume the walk on that root field. `taskLabels` is the
tag domain's own connection: the platform has one labelling concept and this is it, carried here
rather than re-declared.
"""
type TaskMetadata {
	taskStatuses: TaskStatusConnection
	taskPriorities: TaskPriorityConnection
	taskSizes: TaskSizeConnection
	taskLabels: TagConnection
	taskVersions: TaskVersionConnection
	issueTypes: IssueTypeConnection
	relatedIssueTypes: TaskRelatedIssueTypeConnection
}
