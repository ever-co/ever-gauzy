# What hangs off a task
# ------------------------------------------------------------------------------------------------

"""
One person's estimate of how long a task takes.

The rows are the task's own: an estimation carries the task it belongs to, so a caller narrows the
connection it reads them through with `taskId` rather than reaching for a root field per task.
"""
type TaskEstimation {
	id: ID!
	"The estimate, **in hours**, exactly as `Task.estimate` states its unit."
	estimate: Float!
	"The employee who made the estimate."
	employeeId: ID!
	"The task the estimate is about."
	taskId: ID!
	deletedAt: DateTime
	createdAt: DateTime
	updatedAt: DateTime
	isActive: Boolean
	isArchived: Boolean
	tenantId: ID
	organizationId: ID
}

"""
The boundary of one page of estimations.
"""
type TaskEstimationEdge {
	node: TaskEstimation!
	cursor: String!
}

"""
One page of estimations, with the total the filters select and the boundary cursors.
"""
type TaskEstimationConnection {
	nodes: [TaskEstimation!]!
	edges: [TaskEstimationEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields an estimation list may be sorted by.
"""
enum TaskEstimationSortField {
	createdAt
	updatedAt
	estimate
}

"""
The order the estimations are returned in. At most three keys are accepted.
"""
input TaskEstimationSort {
	field: TaskEstimationSortField!
	direction: SortDirection!
}

"""
The fields an estimation list may be narrowed by. `taskId` is the narrowing that matters: it is how a
task's own estimates are read.
"""
input TaskEstimationFilter {
	id: IDFilter
	estimate: NumberFilter
	employeeId: IDFilter
	taskId: IDFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	and: [TaskEstimationFilter!]
	or: [TaskEstimationFilter!]
	not: TaskEstimationFilter
}

"""
What a caller states when it records an estimate. The delivered body requires every member, so every
member is required here.
"""
input CreateTaskEstimationInput {
	organizationId: ID!
	"An estimate **in hours**."
	estimate: Float!
	employeeId: ID!
	taskId: ID!
}

"""
What a caller states when it changes an estimate. The delivered update binds the same body the create
binds, so the same members are required.
"""
input UpdateTaskEstimationInput {
	id: ID!
	organizationId: ID!
	"An estimate **in hours**."
	estimate: Float!
	employeeId: ID!
	taskId: ID!
}

"""
One task's relation to another: it is blocked by it, it duplicates it, it relates to it, and so on.
"""
type TaskLinkedIssue {
	id: ID!
	"""
	Which way the relation runs, as the integer the delivered column holds: `1` is-blocked-by, `2`
	blocks, `3` is-cloned-by, `4` clones, `5` is-duplicated-by, `6` duplicates, `7` relates-to. It is
	carried as its value rather than declared as a schema enum because it is a fixed contract value set
	rather than a vocabulary an operator maintains.
	"""
	action: Int!
	"The task the relation runs from."
	taskFromId: ID!
	"The task the relation runs to."
	taskToId: ID!
	deletedAt: DateTime
	createdAt: DateTime
	updatedAt: DateTime
	isActive: Boolean
	isArchived: Boolean
	tenantId: ID
	organizationId: ID
}

"""
The boundary of one page of linked issues.
"""
type TaskLinkedIssueEdge {
	node: TaskLinkedIssue!
	cursor: String!
}

"""
One page of linked issues, with the total the filters select and the boundary cursors.
"""
type TaskLinkedIssueConnection {
	nodes: [TaskLinkedIssue!]!
	edges: [TaskLinkedIssueEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields a linked-issue list may be sorted by.
"""
enum TaskLinkedIssueSortField {
	createdAt
	updatedAt
	action
}

"""
The order the linked issues are returned in. At most three keys are accepted.
"""
input TaskLinkedIssueSort {
	field: TaskLinkedIssueSortField!
	direction: SortDirection!
}

"""
The fields a linked-issue list may be narrowed by. Narrowing on `taskFromId` or `taskToId` is how the
links of one task are read — the connection is the list, and a task's own links are this list filtered.
"""
input TaskLinkedIssueFilter {
	id: IDFilter
	action: NumberFilter
	taskFromId: IDFilter
	taskToId: IDFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	and: [TaskLinkedIssueFilter!]
	or: [TaskLinkedIssueFilter!]
	not: TaskLinkedIssueFilter
}

"""
What a caller states when it links two tasks.
"""
input CreateTaskLinkedIssueInput {
	organizationId: ID!
	"The direction of the relation, as `TaskLinkedIssue.action` states it."
	action: Int!
	taskFromId: ID!
	taskToId: ID!
}

"""
What a caller states when it changes an existing link. Every member but the identifier and the
organization is optional: the delivered update binds a partial body.
"""
input UpdateTaskLinkedIssueInput {
	id: ID!
	organizationId: ID!
	action: Int
	taskFromId: ID
	taskToId: ID
}

# ------------------------------------------------------------------------------------------------
# The vocabulary a task points at
# ------------------------------------------------------------------------------------------------
#
# Six resources, one shape. Each is a row an operator maintains: a name and a stable value other rows
# point at, an icon and a colour the clients render, and a scope — the tenant, the organization, the
# project or the team the row belongs to. A read of any of them falls back to the installation's own
# system rows when the scope the caller named holds none, which is why a list answers rows whose
# `tenantId` is null: those are the platform's own defaults, and they are answered rather than hidden.

"""
One lifecycle state a task can be in.
"""
type TaskStatus {
	id: ID!
	"The status as it reads to a person."
	name: String!
	"The stable value the task's own `status` column carries."
	value: String!
	"What the status means, for the operator."
	description: String
	"Where the status sits in the board's column order."
	order: Int
	"An icon name the clients resolve."
	icon: String
	"The status's colour."
	color: String
	"Whether the platform maintains the row rather than an operator. A system row cannot be removed."
	isSystem: Boolean
	"Whether the board shows the column collapsed."
	isCollapsed: Boolean
	"Whether the status is the scope's default for a newly filed task."
	isDefault: Boolean
	"Whether the status means the work has not started."
	isTodo: Boolean
	"Whether the status means the work is under way."
	isInProgress: Boolean
	"Whether the status means the work is finished."
	isDone: Boolean
	"The icon resolved to a URL, for clients that render it directly."
	fullIconUrl: String
	"The project the row belongs to. Null on a row that belongs to the whole scope above it."
	projectId: ID
	"The team the row belongs to. Null for the whole organization."
	organizationTeamId: ID
	createdAt: DateTime
	updatedAt: DateTime
	isActive: Boolean
	isArchived: Boolean
	tenantId: ID
	organizationId: ID
}

"""
The boundary of one page of statuses.
"""
type TaskStatusEdge {
	node: TaskStatus!
	cursor: String!
}

"""
One page of statuses, with the total the filters select and the boundary cursors.
"""
