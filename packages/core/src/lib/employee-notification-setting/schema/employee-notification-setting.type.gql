# The employee notification setting's object type.
#
# A setting row is one employee's answer to "which of these do I want to be told about": six flags, one
# per kind of notification the platform sends, and `preferences` for everything the six do not cover.
# It is a row of its own rather than six columns on the employee because the set grows with what the
# platform notifies about, and because a notification written for an employee is answered from this row
# rather than from the record the notification is about.
#
# The six flags are nullable rather than non-null even though every one of their columns carries a
# default: the defaults are the store's, applied when the row is written, and a client reading a row
# that predates a flag would be told a value the row does not hold. `preferences` is the document the
# entity declares as required, so it is the one member here that a write must state.
#
# **The `employee` relation is not a field, and `employeeId` is.** The read behind these fields joins
# no relation, so a member for the object would be absent on every row answered here; the foreign key
# always travels, and it is what a client joins on. The employee behind it is read from the employee
# surface, which is where that concept is declared.

"""
One employee's notification preferences.
"""
type EmployeeNotificationSetting {
	id: ID!
	"Whether payment-related notifications are sent to the employee."
	payment: Boolean
	"Whether assignment-related notifications are sent to the employee."
	assignment: Boolean
	"Whether invitation-related notifications are sent to the employee."
	invitation: Boolean
	"Whether notifications for a mention of the employee are sent."
	mention: Boolean
	"Whether notifications for a comment relevant to the employee are sent."
	comment: Boolean
	"Whether direct messages are sent to the employee."
	message: Boolean
	"Everything the six flags above do not cover, as a document the caller stores."
	preferences: JSON
	"The employee these preferences belong to. The row behind it is read from the employee surface."
	employeeId: ID
	tenantId: ID
	organizationId: ID
	isActive: Boolean
	isArchived: Boolean
	"When the preferences were withdrawn, or null while they are live."
	archivedAt: DateTime
	"""
	When the preferences were withdrawn, or null while they are live. Withdrawing and restoring are
	delivered routes whose whole effect is this column, so it is carried: without it the answer to the
	write that withdrew a row would not say so.
	"""
	deletedAt: DateTime
	createdAt: DateTime
	updatedAt: DateTime
}

"""
The boundary of one page of notification settings.
"""
type EmployeeNotificationSettingEdge {
	node: EmployeeNotificationSetting!
	cursor: String!
}

"""
One page of notification settings, with the total the filters select and the boundary cursors.
"""
type EmployeeNotificationSettingConnection {
	nodes: [EmployeeNotificationSetting!]!
	edges: [EmployeeNotificationSettingEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields a notification setting list may be sorted by.

The two timestamps, the employee and the withdrawal stamp. The six flags are deliberately not here:
each is a column with two values, so half the rows carry it and half do not, and an order over that
split is a question the filter beside it already answers per flag — which is why the flags are
filterable and not sortable rather than both.
"""
enum EmployeeNotificationSettingSortField {
	createdAt
	updatedAt
	employeeId
	deletedAt
}

"""
The order the notification settings are returned in. At most three keys are accepted.
"""
input EmployeeNotificationSettingSort {
	field: EmployeeNotificationSettingSortField!
	direction: SortDirection!
}

"""
The fields a notification setting list may be narrowed by. `and` is the default; `or` requires any of
its members and `not` excludes the rows that match it.

`preferences` is narrowed as a document, which is what the connection protocol's JSON kind is: a caller
asks whether a value is present inside the document rather than for the document as a whole, because
two callers never write byte-identical documents.
"""
input EmployeeNotificationSettingFilter {
	id: IDFilter
	payment: BooleanFilter
	assignment: BooleanFilter
	invitation: BooleanFilter
	mention: BooleanFilter
	comment: BooleanFilter
	message: BooleanFilter
	preferences: JSONFilter
	employeeId: IDFilter
	tenantId: IDFilter
	organizationId: IDFilter
	isActive: BooleanFilter
	isArchived: BooleanFilter
	archivedAt: DateTimeFilter
	deletedAt: DateTimeFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	and: [EmployeeNotificationSettingFilter!]
	or: [EmployeeNotificationSettingFilter!]
	not: EmployeeNotificationSettingFilter
}

"""
What a caller states when it files notification preferences.

The members are the scalar ones the delivered `CreateEmployeeNotificationSettingDTO` validates — the
intersection of the tenant-and-organization base body with the entity's own columns, less the relation.
The tenant is not among them: the delivered write stamps the tenant of the credential onto the row and
never reads one from a body. The organization is among them, because the delivered base body carries it
and the write takes it from there; an organization the caller states is checked against the caller's own
memberships by that body's validation rather than trusted.

**There is no member for the employee, and its absence is the delivered body's own statement.** The
delivered `CreateEmployeeNotificationSettingDTO` omits both the relation and its identifier, and the
delivered service derives the employee from the credential when the body names none — so these
preferences belong to the caller acting as an employee, and no caller states whose they are. A member
here would name a person the delivered write never reads.

`preferences` is the one required member, because the entity declares that column as one a row must
carry. The six flags are optional: each column has a default, so a caller that states none files the
platform's own defaults for the kinds it did not mention, which is what the delivered route does with
the same body.
"""
input CreateEmployeeNotificationSettingInput {
	"Whether payment-related notifications are sent."
	payment: Boolean
	"Whether assignment-related notifications are sent."
	assignment: Boolean
	"Whether invitation-related notifications are sent."
	invitation: Boolean
	"Whether notifications for a mention are sent."
	mention: Boolean
	"Whether notifications for a relevant comment are sent."
	comment: Boolean
	"Whether direct messages are sent."
	message: Boolean
	"Everything the six flags do not cover."
	preferences: JSON!
	"The organization to file the preferences under. The delivered base body carries it."
	organizationId: ID
}

"""
What a caller states when it changes notification preferences that exist.

The delivered update body is the create body with every member optional, so this input carries the same
members — plus the identifier the route carries in its path, because this surface's mutation takes one
argument and the resolver passes it on both ways.

**A member that is absent is left as it is.** The delivered update reads the row by the identifier to
prove it is the caller's, then writes the members the body states over that row; a member the body does
not state is not part of that write, so the column keeps what the row has. A client that means to switch
one kind of notification off states that flag as `false` rather than leaving it out, and the employee
is not a member at all: preferences are read and written for the employee the credential names.
"""
input UpdateEmployeeNotificationSettingInput {
	"The notification setting to change."
	id: ID!
	payment: Boolean
	assignment: Boolean
	invitation: Boolean
	mention: Boolean
	comment: Boolean
	message: Boolean
	preferences: JSON
	organizationId: ID
}
