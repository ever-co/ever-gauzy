# The reliability kernel's object types.
#
# Two records, and they are deliberately not the same shape. **An outbox row carries a document; a
# delivery record carries none.**
#
# - `EventOutboxRecord.payload` is the event's body and `headers` is what travelled beside it:
#   correlation, causation, the actor and the channel. Both are `JSON` because both are documents
#   whose members are fixed **per event name** by the catalogue of
#   `12-events-webhooks-and-workflows.md` §3, which declares one projection per name. A schema type
#   here would have to enumerate every catalogued payload — the catalogue is the authoritative list
#   and it grows with each domain — so a producer adding a member would be a schema change, and a
#   body that did not match the type would be a fact the schema refuses to carry. `payload` is
#   non-null because the column is non-null with an empty-object default: a consumer never has to
#   guard against a missing body. `headers` is nullable because a row written outside a request
#   carries none.
# - Every member of `EventDelivery` is typed, because every member is a column with a type of its own:
#   an identifier, a namespaced key, a status value, a whole number, an instant or a message. **It
#   carries no attempts field, and that is the entity's own answer rather than an omission.** A
#   delivery record *is* the projection of the attempts made on one `(event, consumer)` pair — its
#   status, its attempt count, the last error and the instant the consumer acknowledged it are the
#   whole of what the kernel records — and the table behind it declares no attempt row. A separate
#   type would be a second resource for a fact this kernel keeps in one place, and the design
#   declares no table for it.
#
# **The status is carried as its value and never as a schema enum.** `EventOutboxStatus` is the
# platform contracts' own vocabulary, shared by both tables so that one scan and one retry policy
# cover an event and a consumer alike, and the column stores four of the states the design names
# (`PENDING`, `PUBLISHED`, `FAILED`, `DEAD`). Declaring the enumeration here would close a value set
# this domain does not own: a kernel that adds a state — an in-flight marker, a skipped terminal —
# would then be a schema change, and until the schema changed the surface would refuse to carry a row
# the store holds.
#
# **The ordering members are the sequence, and its type is `Int`.** `sequence` is monotonic within a
# partition and is read through the platform's numeric transformer, so it travels as a number; it is
# carried in the same family the kernel's own `EventEnvelope.sequence` uses, because the two are the
# same value seen from different sides — the envelope a consumer receives and the row an operator
# reads must agree on the position of an event in its aggregate's order.

"""
One durable event: the state change it describes, projected, and where its dispatch stands.
"""
type EventOutboxRecord {
	id: ID!
	"""
	Stable event identity, generated by the writer rather than by the database. It is what the delivery
	records, the webhook signature and a replay all carry, and it is *not* the row's primary key: a
	delivery record outlives the event row and names this one.
	"""
	eventId: ID!
	"""`<aggregate>.<action>`, for example `order.placed`."""
	eventName: String!
	"""The aggregate that changed, for example `order`."""
	aggregateType: String!
	"""The instance of the aggregate that changed."""
	aggregateId: ID!
	"""
	The event body: the projection the catalogue declares for this event name, never an entity dump.
	Non-null, because the column is non-null with an empty-object default.
	"""
	payload: JSON!
	"""
	What travelled beside the body: the correlation id, the causation id, the actor and the channel.
	Null when the row was written outside a request, which is the only case that produces one.
	"""
	headers: JSON
	"""
	Where dispatch stands, as the contracts' own value: `PENDING`, `PUBLISHED`, `FAILED` or `DEAD`.
	`FAILED` means a further attempt is scheduled, not that the event was abandoned — `DEAD` is the
	terminal state.
	"""
	status: String!
	"""How many dispatch attempts were made. The claim that leases the row increments it."""
	attemptCount: Int!
	"""
	When dispatch is next due. It is the lease and the backoff in one column: claiming a row pushes it
	forward for the lease window, so a dispatcher that dies mid-pass leaves rows another worker picks
	up when the window expires.
	"""
	availableAt: DateTime!
	"""When dispatch completed; null while the event has not been dispatched."""
	publishedAt: DateTime
	"""The last dispatch error, as the dispatcher recorded it."""
	lastError: String
	"""The ordering key, normally `<aggregateType>:<aggregateId>`."""
	partitionKey: String
	"""
	The position of this event inside its partition, allocated inside the writing transaction. It is
	monotonic within the key above and meaningless across keys.
	"""
	sequence: Int!
	isActive: Boolean
	isArchived: Boolean
	tenantId: ID
	organizationId: ID
	createdAt: DateTime
	updatedAt: DateTime
}

"""
The boundary of one page of outbox rows.
"""
type EventOutboxRecordEdge {
	node: EventOutboxRecord!
	cursor: String!
}

"""
One page of outbox rows, with the total the filters select and the boundary cursors.
"""
type EventOutboxRecordConnection {
	nodes: [EventOutboxRecord!]!
	edges: [EventOutboxRecordEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields an outbox list may be sorted by.

`availableAt` is the queue's own order — the row whose turn comes first — and it is the order the
listing means when the caller states none. The two timestamps are how a change is found again,
`sequence` is how one aggregate's events are put back in order, and `attemptCount` is how the events
that keep failing are found. The flags and the identifiers are not sort keys: an identifier or a
boolean order is not an order a queue is read in, and the questions those columns answer are filters.
"""
enum EventOutboxRecordSortField {
	createdAt
	updatedAt
	availableAt
	publishedAt
	sequence
	attemptCount
}

"""
The order the outbox rows are returned in. At most three keys are accepted.
"""
input EventOutboxRecordSort {
	field: EventOutboxRecordSortField!
	direction: SortDirection!
}

"""
The fields an outbox list may be narrowed by. `and` is the default; `or` requires any of its members
and `not` excludes the rows that match it.

Every member is a column of the row. The two documents are stated through the JSON family, which is
the only family that can compare them: `contains` answers "which events mention this aggregate"
without the surface claiming to know the body's shape.

`deletedAt` is deliberately absent although the row carries it: the delivered read answers live rows
only, so a condition on that column could only ever match the empty set, and an argument that cannot
be honoured is worse than an argument that is not offered. The tenant and the organization are absent
for a different reason — both are applied to the criterion from the credential rather than from the
caller, so a member here would suggest a scope decision the caller does not have.
"""
input EventOutboxRecordFilter {
	id: IDFilter
	eventId: IDFilter
	eventName: StringFilter
	aggregateType: StringFilter
	aggregateId: IDFilter
	payload: JSONFilter
	headers: JSONFilter
	status: StringFilter
	attemptCount: NumberFilter
	availableAt: DateTimeFilter
	publishedAt: DateTimeFilter
	lastError: StringFilter
	partitionKey: StringFilter
	sequence: NumberFilter
	isActive: BooleanFilter
	isArchived: BooleanFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	and: [EventOutboxRecordFilter!]
	or: [EventOutboxRecordFilter!]
	not: EventOutboxRecordFilter
}

"""
What one consumer did with one event.
"""
type EventDelivery {
	id: ID!
	"""
	The `eventId` of the outbox row this record is about. There is deliberately no foreign key behind
	it: the record outlives the event row, and it is the record — not the event — that says what a
	consumer actually did.
	"""
	eventId: ID!
	"""
	The consumer, namespaced by its kind: `subscriber:<key>`, `job:<queueName>` or
	`webhook:<subscriptionId>`. The prefix is what keeps a subscriber, a queued job and an outbound
	endpoint from ever colliding on one event.
	"""
	consumerKey: String!
	"""
	Where this consumer stands, in the same vocabulary the outbox row uses: `PENDING` before the
	consumer is invoked, `PUBLISHED` once it acknowledged the event, `FAILED` while a further attempt
	is scheduled, and `DEAD` when the budget is spent or an operator stopped it.
	"""
	status: String!
	"""How many times the consumer was invoked. Reset by a replay, which is what a replay is for."""
	attemptCount: Int!
	"""When the consumer acknowledged the event; null while it has not."""
	deliveredAt: DateTime
	"""The last error the consumer raised, or the reason an operator stopped it."""
	lastError: String
	"""Copied from the outbox row, so the retry scan keeps per-aggregate order without a join."""
	partitionKey: String
	"""Copied from the outbox row; a strict consumer compares it against the last it processed."""
	sequence: Int
	isActive: Boolean
	isArchived: Boolean
	tenantId: ID
	organizationId: ID
	createdAt: DateTime
	updatedAt: DateTime
}

"""
The boundary of one page of delivery records.
"""
type EventDeliveryEdge {
	node: EventDelivery!
	cursor: String!
}

"""
One page of delivery records, with the total the filters select and the boundary cursors.
"""
type EventDeliveryConnection {
	nodes: [EventDelivery!]!
	edges: [EventDeliveryEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields a delivery list may be sorted by.

`createdAt` is the order the listing means — the newest record first, which is the record an operator
opens to read what just broke — and it is the instant the record was written, before the consumer
ran. `deliveredAt` is when one finally succeeded, `attemptCount` is how hard the machinery tried, and
`sequence` is the position the record carries from its event.
"""
enum EventDeliverySortField {
	createdAt
	updatedAt
	deliveredAt
	attemptCount
	sequence
}

"""
The order the delivery records are returned in. At most three keys are accepted.
"""
input EventDeliverySort {
	field: EventDeliverySortField!
	direction: SortDirection!
}

"""
The fields a delivery list may be narrowed by. `and` is the default; `or` requires any of its members
and `not` excludes the rows that match it.

`consumerKey` is the member the dead-letter runbook groups by — one consumer failing broadly is a
regression in that consumer, many consumers failing on one event is a bad payload — and `eventId` is
the other half of that question. Every other member is a column of the record; the tenant and the
organization are applied from the credential, and a soft-deleted record is not answered at all,
which is why neither that column nor a condition on it appears here.
"""
input EventDeliveryFilter {
	id: IDFilter
	eventId: IDFilter
	consumerKey: StringFilter
	status: StringFilter
	attemptCount: NumberFilter
	deliveredAt: DateTimeFilter
	lastError: StringFilter
	partitionKey: StringFilter
	sequence: NumberFilter
	isActive: BooleanFilter
	isArchived: BooleanFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	and: [EventDeliveryFilter!]
	or: [EventDeliveryFilter!]
	not: EventDeliveryFilter
}

# The write surface, and why it is one input rather than two.
#
# The resource offers exactly two moves and they are not the same shape: a replay takes the record's
# identifier and nothing else — it states no choice, because the move means one thing — while a
# dead-letter takes the identifier and the operator's reason. The reason is **required**: it lands on
# the record's `lastError`, which is the column the next operator reads, and a dead letter that does
# not say why destroys the diagnosis that made the move necessary.

"""
What a caller states when it stops one delivery record.

The reason is the operator's own words and is written onto the record's `lastError`. A record
belonging to another tenant is answered exactly as a record that does not exist.
"""
input MarkEventDeliveryDeadInput {
	"The record to stop."
	id: ID!
	"Why it is being stopped."
	reason: String!
}
