# The equipment domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists once
# for the whole platform, so a domain adds fields to it and never declares its own.
#
# Every field below is one the delivered `/api/equipment` routes already serve, under the same guard and
# with the same permission — and this resource is the case where "the same permission" means none at
# all. The controller declares no permission on its class and none on any of its handlers, so no field
# here states one either: a permission restated here would be a grant the routes do not ask for, and an
# empty `@Permissions()` would be a second statement of the same absence. What decides who may reach
# these rows is the guard chain the controller runs under and the service behind it, which both
# protocols share.
#
# The list is a connection rather than a bare array. It takes the same query protocol the REST list
# route takes — the same filters in `filter`, the same keys in `sort`, the same page in `page` — and
# answers with the same shape the kernel's `PageInfo` gives every other connection, so a cursor obtained
# over one surface resumes on the other. `withDeleted` is offered because the delivered list route offers
# it: the `data` document its list route binds is handed to the same read, which carries the member to the
# store, so a REST caller can ask for withdrawn assets and a connection that could not would hide them.
#
# The controller serves its list twice — `GET /` and `GET /pagination` — and the two answer the same
# rows under the same filters, one of them sliced by `take`/`skip` and the other not. That is one
# capability, so it is one root field: `equipments`, mirroring `GET /`, which is the route that reads
# the whole filtered set the connection protocol is applied to. The paginated spelling's three
# narrowings are partial matches on `name`, `type` and `serialNumber`, and all three survive the fold as
# `ilike` on the same members of `filter`; a second root field for the paginated spelling would be a
# second surface that could disagree with this one, and the connection's own `limit`/`offset` already
# are the page it performs.
#
# The one-row read and the count are inherited from the CRUD base without a permission of their own, so
# they run under the controller's class-level declaration — which is none — and the fields state none
# for the same reason. `equipmentCount` takes no filter, and that is a statement rather than an
# omission: the delivered count route passes its query string through as the store's own `where`, which
# the connection protocol does not speak, so a `filter` argument here would either be handed to a
# service call that cannot accept it or be evaluated over a second code path that could disagree with
# the connection's `totalCount`. It is nullable because a count is an aggregate a resource may
# legitimately have no answer for, and a non-null field would turn "not answered" into a fabricated
# zero.
#
# The controller serves no sub-route of its own beyond the paginated spelling, so this resource has no
# root field beyond the list, the row, the count and the five writes. Every one of the five is a
# delivery of its own: the removal, the withdrawal and the restoration are inherited from the CRUD base
# and the create and the edit are the controller's own.

extend type Query {
	"""
	The equipment of the caller's tenant, in name order.
	"""
	equipments(
		filter: EquipmentFilter
		sort: [EquipmentSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
		withDeleted: Boolean
	): EquipmentConnection!

	"""
	One asset of the caller's tenant, or null when there is none.
	"""
	equipment(id: ID!): Equipment

	"""
	How many assets the caller's tenant tracks.
	"""
	equipmentCount: Int
}

extend type Mutation {
	"""
	Files an asset.

	The tenant the new row belongs to is stamped from the credential and is never stated by the caller,
	so an asset cannot be written into a tenant the caller is not acting in. The write is the same
	service call the REST create route makes, and it is a save rather than an insert because that is
	what the delivered route needs: the facets are a relation, and the relation is written by the save.
	"""
	createEquipment(input: CreateEquipmentInput!): Equipment!

	"""
	Changes an asset that exists.

	The delivered edit carries the identifier in the path and spreads the body beside it into the same
	save the create uses, and that save merges what it is given onto the row the store holds: a member the
	caller leaves out is left as it is, which is what `UpdateEquipmentInput` states at length. The
	delivered write refuses a row of another tenant before it persists anything, and that refusal reaches
	the caller as it is rather than being relabelled here.
	"""
	updateEquipment(input: UpdateEquipmentInput!): Equipment!

	"""
	Removes an asset outright, with the sharing rows that belong to it.

	This is the hard removal, and it is the one to reach for only for a row filed in error: the sharing
	periods that point at an asset are the store's own to cascade, and an asset the organization still
	hands out is withdrawn instead.
	"""
	deleteEquipment(id: ID!): Boolean!

	"""
	Withdraws an asset without removing the row.

	The delivered list stops answering it and the sharing rows that point at it keep resolving the
	identifier they hold. The answer is the withdrawn row, whose `deletedAt` says when it happened; it is
	recoverable until it is removed outright.
	"""
	softDeleteEquipment(id: ID!): Equipment!

	"""
	Puts a withdrawn asset back.
	"""
	recoverEquipment(id: ID!): Equipment!
}
