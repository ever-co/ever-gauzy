# The organization document's object type.
#
# A document is a row of paperwork an organization keeps about itself — a certificate, an insurance
# policy, a contract — as a name, a URL and the asset the file itself lives in. The row is filed under
# the organization, which is what makes it a sub-resource of the organization rather than a general
# file store.
#
# **`document` is carried and so is `documentId`, because the relation is eager.** The entity declares
# the asset relation eager, so the delivered read loads it on every row either protocol returns — a
# member that always travels is a member this type may state. The identifier is carried beside it
# because it is a column of the row, and a client that only needs to point at the asset should not have
# to load it.
#
# `documentUrl` is a denormalised copy of the asset's URL, kept for the lists that must render a link
# without joining the asset table. It is nullable on the row, so it is nullable here: a document filed
# before the asset was uploaded genuinely has none.
#
# Nothing else is carried. The row has no collection of its own, and the delivered reads join only the
# relations a REST caller names in its query string — which this surface never names.

"""
One piece of paperwork an organization keeps about itself.
"""
type OrganizationDocument {
	id: ID!
	"The document's name, as the organization wrote it."
	name: String!
	"A denormalised link to the file, kept for lists that must not join the asset table."
	documentUrl: String
	"The asset the file lives in, by identifier."
	documentId: ID
	"The asset the file lives in."
	document: ImageAsset
	"The organization the document is filed under, by identifier."
	organizationId: ID
	"The tenant the document belongs to, by identifier."
	tenantId: ID
	"""
	When the document was withdrawn, or null while it is live. Withdrawing and restoring are delivered
	routes — the two removals this resource serves — and this column is the whole of what they write.
	"""
	deletedAt: DateTime
	"When the document was archived, as opposed to withdrawn."
	archivedAt: DateTime
	"When the document was filed."
	createdAt: DateTime
	"When the document was last changed."
	updatedAt: DateTime
	"Whether the document is active. A flag an operator sets, not a statement about the row's lifecycle."
	isActive: Boolean
	"Whether the document is archived. A flag an operator sets, not a statement about the row's lifecycle."
	isArchived: Boolean
	"The person who filed the document, by identifier. The user row is not joined by this surface's read."
	createdByUserId: ID
	"The person who last changed the document, by identifier. The user row is not joined by this surface's read."
	updatedByUserId: ID
	"The person who withdrew the document, by identifier. The user row is not joined by this surface's read."
	deletedByUserId: ID
}

"""
The boundary of one page of documents.
"""
type OrganizationDocumentEdge {
	node: OrganizationDocument!
	cursor: String!
}

"""
One page of documents, with the total the filters select and the boundary cursors.
"""
type OrganizationDocumentConnection {
	nodes: [OrganizationDocument!]!
	edges: [OrganizationDocumentEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields a document list may be sorted by.
"""
enum OrganizationDocumentSortField {
	createdAt
	updatedAt
	name
}

"""
The order the documents are returned in. At most three keys are accepted.
"""
input OrganizationDocumentSort {
	field: OrganizationDocumentSortField!
	direction: SortDirection!
}

"""
The fields a document list may be narrowed by.

`documentUrl` is filterable because a caller looks a document up by where it is served from;
`documentId` is filterable because the same question is asked by asset identifier. The asset's own
members are not filterable here — the asset is a row of another domain, and narrowing a document list
by the bytes behind it is a question that surface answers.
"""
input OrganizationDocumentFilter {
	id: IDFilter
	name: StringFilter
	documentUrl: StringFilter
	documentId: IDFilter
	organizationId: IDFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	isActive: BooleanFilter
	isArchived: BooleanFilter
	and: [OrganizationDocumentFilter!]
	or: [OrganizationDocumentFilter!]
	not: OrganizationDocumentFilter
}

"""
What a caller states when it files a document.

The organization is stated because the delivered create does not derive one: the tenant is stamped
from the credential, never from an argument, but the organization is a member the caller names and the
delivered route validates against the caller's own memberships. There is no member for the tenant, for
the same reason there is none on any other write here.
"""
input CreateOrganizationDocumentInput {
	organizationId: ID!
	name: String!
	"The link to the file, when the caller already knows it."
	documentUrl: String
	"The asset the file lives in, by identifier."
	documentId: ID
}

"""
What a caller states when it edits a document that exists.

The identifier is the only member stated outside the body, and it is stated because the delivered
route carries it in the path. The delivered edit is a partial column update rather than a replacement
of the row, so a member the caller leaves out is left as it is.
"""
input UpdateOrganizationDocumentInput {
	id: ID!
	organizationId: ID
	name: String
	documentUrl: String
	documentId: ID
}
