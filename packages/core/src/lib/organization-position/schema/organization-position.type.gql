# The organization position's object type.
#
# A position is a job title an organization files its people and its recruiting under — the row a
# vacancy, an applicant and an employee each name. It is filed under the organization, which is what
# makes it a sub-resource of the organization rather than a platform-wide list of titles.
#
# The row carries nothing else of its own. Its one collection — the tags attached to the position — is a
# pivot the delivered list read joins only when a REST caller names it in its query string, which this
# surface never does; and it has no identifier column to carry, because what is tagged is reachable
# from the tag surface.
#
# The base row's identifiers, timestamps and lifecycle columns are carried in full: withdrawing and
# restoring are delivered routes whose whole effect is the `deletedAt` column.

"""
One job title an organization files its people under.
"""
type OrganizationPosition {
	id: ID!
	"The position's title, as the organization writes it."
	name: String!
	"The organization the position is filed under, by identifier."
	organizationId: ID
	"The tenant the position belongs to, by identifier."
	tenantId: ID
	"""
	When the position was withdrawn, or null while it is live. Withdrawing and restoring are delivered
	routes — the two removals this resource serves — and this column is the whole of what they write.
	"""
	deletedAt: DateTime
	"When the position was archived, as opposed to withdrawn."
	archivedAt: DateTime
	"When the position was filed."
	createdAt: DateTime
	"When the position was last changed."
	updatedAt: DateTime
	"Whether the position is active. A flag an operator sets, not a statement about the row's lifecycle."
	isActive: Boolean
	"Whether the position is archived. A flag an operator sets, not a statement about the row's lifecycle."
	isArchived: Boolean
	"The person who filed the position, by identifier. The user row is not joined by this surface's read."
	createdByUserId: ID
	"The person who last changed the position, by identifier. The user row is not joined by this surface's read."
	updatedByUserId: ID
	"The person who withdrew the position, by identifier. The user row is not joined by this surface's read."
	deletedByUserId: ID
}

"""
The boundary of one page of positions.
"""
type OrganizationPositionEdge {
	node: OrganizationPosition!
	cursor: String!
}

"""
One page of positions, with the total the filters select and the boundary cursors.
"""
type OrganizationPositionConnection {
	nodes: [OrganizationPosition!]!
	edges: [OrganizationPositionEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields a position list may be sorted by.
"""
enum OrganizationPositionSortField {
	createdAt
	updatedAt
	name
}

"""
The order the positions are returned in. At most three keys are accepted.
"""
input OrganizationPositionSort {
	field: OrganizationPositionSortField!
	direction: SortDirection!
}

"""
The fields a position list may be narrowed by.

`name` is here for the obvious reason: a title is how a position is chosen from a list of them. The tag
pivot is not, and that is a statement rather than an omission — the delivered list read joins it only
when a REST caller names it, and this surface names none, so a filter on it would be evaluated against
a row that carries none and would select nothing at all.
"""
input OrganizationPositionFilter {
	id: IDFilter
	name: StringFilter
	organizationId: IDFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	isActive: BooleanFilter
	isArchived: BooleanFilter
	and: [OrganizationPositionFilter!]
	or: [OrganizationPositionFilter!]
	not: OrganizationPositionFilter
}

"""
What a caller states when it files a position.

The organization is stated because the delivered create does not derive one: the tenant is stamped
from the credential, never from an argument, but the organization is a member the caller names and the
delivered route validates against the caller's own memberships. There is no member for the tenant, for
the same reason there is none on any other write here.
"""
input CreateOrganizationPositionInput {
	organizationId: ID!
	name: String!
}

"""
What a caller states when it edits a position that exists.

The identifier is the only member stated outside the body, and it is stated because the delivered
route carries it in the path. **The delivered edit writes through the create path** — it hands the
service the stated body with the path identifier merged in — so it is an upsert rather than a
replacement: a member the caller leaves out is left as it is, and the answer is the row rather than a
statement about the write.
"""
input UpdateOrganizationPositionInput {
	id: ID!
	organizationId: ID
	name: String
}
