# The employee appointment domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists once
# for the whole platform, so a domain adds fields to it and never declares its own.
#
# Every field below is one the delivered `/api/employee-appointment` routes already serve, under the
# same guard and with the same permission, so a client that reaches a capability over one protocol is
# not given a narrower or a wider one than the client that reaches it over the other. The guard and the
# permission are read from `EmployeeAppointmentController`'s own metadata in the resolver, and the
# resolver's spec compares the two rather than restating a list that could agree with the resolver while
# disagreeing with the controller. That controller carries `TenantPermissionGuard` on the class and
# states no permission at all — not on its own routes, and not on any of the lifecycle routes it
# inherits from the CRUD base — so every field here states the same tenant guard and no permission, and a
# field that demanded a permission would refuse a caller the REST route serves.
#
# **The list is a connection rather than a bare array.** It takes the same query protocol the REST list
# route takes — the same filters in `filter`, the same keys in `sort`, the same page in `page` — and
# answers with the same shape the kernel's `PageInfo` gives every other connection, so a cursor obtained
# over one surface resumes on the other. `withDeleted` is deliberately absent: the delivered list method
# reads live rows only, and offering an argument that cannot be honoured would be worse than not
# offering it.
#
# **The controller serves its list twice — `GET /` and `GET /pagination` — and the two answer one
# question.** One of them is sliced by `take`/`skip` and the other is not, and both apply the same
# narrowing to the same rows, so they are one capability: `employeeAppointments`, mirroring `GET /`,
# which is the route that reads the whole filtered set the connection protocol is applied to. A second
# root field for the paginated spelling would be a second surface that could disagree with this one, and
# the connection's own `limit`/`offset` already are the page it performs.
#
# **Two of the reads answer something that is not a row, and they are root fields of their own.** The
# signed invitation token and the identifier that token carries are not columns of any table and not
# members of any type here: they are answers computed from an appointment's identifier, served by
# `GET /sign/:id` and `GET /decode/:token`, and a capability the delivered routes serve is not one this
# surface may drop. `signEmployeeAppointment` mirrors the first and `decodeEmployeeAppointment` the
# second.
#
# `employeeAppointmentCount` takes no filter, and that is a statement rather than an omission. The
# delivered count route passes its query string through as the store's own `where`, which the connection
# protocol does not speak; a `filter` argument here would either be handed to a service call that cannot
# accept it or be evaluated over a second code path that could disagree with the connection's
# `totalCount`. What it answers is the count of the caller's own rows, which is the call the route makes
# when it is given no options — and it is nullable, because an aggregate the resource has no answer for
# must not be answered as a zero.

extend type Query {
	"""
	The appointments of the caller's tenant, newest first.
	"""
	employeeAppointments(
		filter: EmployeeAppointmentFilter
		sort: [EmployeeAppointmentSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
	): EmployeeAppointmentConnection!

	"""
	One appointment of the caller's tenant, or null when there is none.
	"""
	employeeAppointment(id: ID!): EmployeeAppointment

	"""
	How many appointments the caller's tenant has.
	"""
	employeeAppointmentCount: Int

	"""
	Signs an appointment's identifier: the token an invitation is answered with, exactly as
	`GET /sign/:id` produces it. The answer is text rather than a row — it is the credential the
	invitation carries, not a projection of the appointment — so it is a field of its own.
	"""
	signEmployeeAppointment(id: ID!): String!

	"""
	The appointment an invitation token names, or null when the token names none — which is the answer
	for a token that does not decode and for one whose payload carries no appointment identifier. The
	decode route is the same capability stated for a client that holds the token and not the row.
	"""
	decodeEmployeeAppointment(token: String!): ID
}

extend type Mutation {
	"""
	Files an appointment and answers the row it wrote, as `POST /` does.
	"""
	createEmployeeAppointment(input: CreateEmployeeAppointmentInput!): EmployeeAppointment!

	"""
	Changes the facts of an appointment, and answers the row the write produced. The delivered route
	answers the store's update result — a statement about the write rather than a row — so the row is
	read back through the same service the node query uses; see `UpdateEmployeeAppointmentInput` for why
	an absent member is left as it is.
	"""
	updateEmployeeAppointment(input: UpdateEmployeeAppointmentInput!): EmployeeAppointment!

	"""
	Removes an appointment outright. The delivered route answers the store's delete result, which is not
	a row, so the field answers whether the removal was performed; a caller naming an appointment that is
	not there is answered with the service's own `404`-shaped refusal rather than with a success.
	"""
	deleteEmployeeAppointment(id: ID!): Boolean!

	"""
	Withdraws an appointment without removing it: the row keeps its identifier and the delivered list
	stops answering it. The answer is the withdrawn row, whose `deletedAt` says when it happened.
	"""
	softDeleteEmployeeAppointment(id: ID!): EmployeeAppointment!

	"""
	Puts a withdrawn appointment back.
	"""
	recoverEmployeeAppointment(id: ID!): EmployeeAppointment!
}
