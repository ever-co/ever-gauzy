# The reaction domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists
# once for the whole platform, so a domain adds fields to it and never declares its own.
#
# **Every field runs under both of the controller's guards and states no permission, and that is the
# parity rather than an omission.** The delivered controller carries `TenantPermissionGuard` and
# `PermissionGuard` on the class, and no route states a permission of its own — not the five it
# declares and not the four it inherits from the CRUD base. `PermissionGuard` answers a request that
# states no permission by serving it: its own rule is that a route with no required permission is
# authorized, so the guard is a scope decision this resource makes and not a grant it asks for.
# A field that demanded a permission would refuse a caller the REST route serves, which is the
# asymmetry the two-protocol rule forbids; adding one is a change to make in both places at once, and
# it is not this delivery's to make.
#
# Every field below is one the delivered `/api/reaction` routes already serve, under the same guard
# chain and with the same permission — none — so a client that reaches a capability over one protocol
# is not given a narrower or a wider one than the client that reaches it over the other.
#
# The list is a connection rather than a bare array. It takes the same query protocol the REST list
# route takes — the same filters in `filter`, the same keys in `sort`, the same page in `page` — and
# answers with the same shape the kernel's `PageInfo` gives every other connection, so a cursor
# obtained over one surface resumes on the other. `withDeleted` is deliberately absent: the delivered
# list method reads live rows only, and offering an argument that cannot be honoured would be worse
# than not offering it. The `relations` the REST list accepts are absent for the same reason: this
# read names none, so an `employee` argument here could not be honoured by it.
#
# The controller serves its list twice — `GET /` and `GET /pagination` — and the two answer the same
# rows under the same filters, one of them sliced by `take`/`skip` and the other not. That is one
# capability, so it is one root field: `reactions`, mirroring `GET /`, which is the route whose whole
# filtered set the connection protocol is applied to. A second root field for the paginated spelling
# would be a second surface that could disagree with this one, and the connection's own `limit`/`offset`
# already are the page it performs.
#
# `reactionCount` takes no filter, and that is a statement rather than an omission. The delivered count
# route passes its query string through as the store's own `where`, which the connection protocol does
# not speak; a `filter` argument here would either be handed to a service call that cannot accept it or
# be evaluated over a second code path that could disagree with the connection's `totalCount`. What it
# answers is the count of the caller's own rows, which is the call the route makes when it is given no
# options.
#
# The writes are dispatched as the commands the delivered routes dispatch, so both surfaces run the
# same handler: the create is a toggle — a mark that is already there is withdrawn rather than filed
# twice — and the edit and the removal are narrowed to the caller's own employee by the service behind
# the command rather than by anything this surface states.

extend type Query {
	"""
	The reactions of the caller's tenant, newest first.
	"""
	reactions(
		filter: ReactionFilter
		sort: [ReactionSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
	): ReactionConnection!

	"""
	One reaction of the caller's tenant, or null when there is none.
	"""
	reaction(id: ID!): Reaction

	"""
	How many reactions the caller's tenant records.

	Nullable by design: a count is an aggregate a resource may legitimately have no answer for, and a
	non-null field would turn "not answered" into a fabricated zero. The delivered count route binds its
	query string to the store's own `where`, a shape no schema can state, so the field offers no
	narrowing of its own rather than an argument the resolver could not pass on.
	"""
	reactionCount: Int
}

extend type Mutation {
	"""
	Leaves a reaction, through the command the delivered create route dispatches.

	**This is a toggle rather than a filing.** The handler looks for a mark that is already there — by
	domain, row, emoji, organization and the acting employee — and withdraws that one instead of
	creating a second, so a caller that repeats the call takes the reaction back. The tenant and the
	acting employee are read from the credential and never stated here.
	"""
	createReaction(input: CreateReactionInput!): Reaction!

	"""
	Changes a reaction that exists, through the command the delivered edit route dispatches.

	A member the caller leaves out is left as it is: the handler's read narrows the row to the caller's
	own employee and its write persists only the members a body states — see `UpdateReactionInput`.
	"""
	updateReaction(input: UpdateReactionInput!): Reaction!

	"""
	Removes a reaction outright, narrowed to the caller's own employee and tenant by the delivered
	service. The answer says whether the removal happened rather than returning the removed row, because
	the delivered route answers the store's delete result.
	"""
	deleteReaction(id: ID!): Boolean!

	"""
	Withdraws a reaction without removing it: the row keeps its identifier and the delivered list stops
	answering it.
	"""
	softDeleteReaction(id: ID!): Reaction!

	"""
	Puts a withdrawn reaction back, clearing the marker the withdrawal set.
	"""
	recoverReaction(id: ID!): Reaction!
}
