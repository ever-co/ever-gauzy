# The employee award domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists
# once for the whole platform, so a domain adds fields to it and never declares its own.
#
# Every field below is one the delivered `/api/employee-award` routes already serve, under the same
# guard chain and with the same permission, so a client that reaches a capability over one protocol is
# not given a narrower or a wider one than the client that reaches it over the other.
#
# **The permission is the controller's class-level pair, stated on every field because that is what
# every one of its routes resolves to.** The delivered controller carries the tenant guard and the
# permission guard on the class, with `PUBLIC_PAGE_EDIT` and `ALL_ORG_EDIT` beside them, and states
# neither per route: the four routes it declares — the list, the filing, the edit and the removal —
# carry no permission of their own, and the five it inherits from the CRUD base — the count, the
# paginated list, the one-row read, the withdrawal and the restoration — carry none either. Each field
# therefore runs under exactly the pair its own route runs under, and none of them widens or narrows
# the controller's scope.
#
# The list is a connection rather than a bare array. It takes the same query protocol the REST list
# route takes — the same filters in `filter`, the same keys in `sort`, the same page in `page` — and
# answers with the same shape the kernel's `PageInfo` gives every other connection, so a cursor
# obtained over one surface resumes on the other. `withDeleted` is deliberately absent: the delivered
# list method reads live rows only, and offering an argument that cannot be honoured would be worse
# than not offering it.
#
# The controller serves its list twice — `GET /` and `GET /pagination` — and the two answer the same
# rows under the same filters, one of them sliced by `take`/`skip` and the other not. That is one
# capability, so it is one root field: `employeeAwards`, mirroring `GET /`, which is the route whose
# whole filtered set the connection protocol is applied to. A second root field for the paginated
# spelling would be a second surface that could disagree with this one, and the connection's own
# `limit`/`offset` already are the page it performs.
#
# `employeeAwardCount` takes no filter, and that is a statement rather than an omission. The delivered
# count route passes its query string through as the store's own `where`, which the connection protocol
# does not speak; a `filter` argument here would either be handed to a service call that cannot accept
# it or be evaluated over a second code path that could disagree with the connection's `totalCount`.
#
# `employeeAward` carries the same edit pair the list carries, rather than a view permission of its own,
# because the delivered `GET /:id` runs under the controller's class-level pair: the route is inherited
# from the base controller without a permission, and inventing a narrower scope for the one-row read
# here would give GraphQL a scope REST does not have.

extend type Query {
	"""
	The awards of the caller's tenant, newest first.
	"""
	employeeAwards(
		filter: EmployeeAwardFilter
		sort: [EmployeeAwardSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
	): EmployeeAwardConnection!

	"""
	One award of the caller's tenant, or null when there is none.
	"""
	employeeAward(id: ID!): EmployeeAward

	"""
	How many awards the caller's tenant records.

	Nullable by design: a count is an aggregate a resource may legitimately have no answer for, and a
	non-null field would turn "not answered" into a fabricated zero. The delivered count route binds its
	query string to the store's own `where`, a shape no schema can state, so the field offers no
	narrowing of its own rather than an argument the resolver could not pass on.
	"""
	employeeAwardCount: Int
}

extend type Mutation {
	"""
	Files an award for one employee of one organization.

	The tenant the new row belongs to is stamped from the credential and is never stated by the caller.
	"""
	createEmployeeAward(input: CreateEmployeeAwardInput!): EmployeeAward!

	"""
	Changes the stated facts of an award that exists.

	The delivered edit is a partial column update rather than a replacement of the row, so a member the
	caller leaves out is left as it is — see `UpdateEmployeeAwardInput` for the members the delivered
	body accepts.
	"""
	updateEmployeeAward(input: UpdateEmployeeAwardInput!): EmployeeAward!

	"""
	Removes an award outright. The answer says whether the removal happened rather than returning the
	removed row, because the delivered route answers the store's delete result.
	"""
	deleteEmployeeAward(id: ID!): Boolean!

	"""
	Withdraws an award without removing it: the row keeps its identifier and the recovery below reads it
	back.
	"""
	softDeleteEmployeeAward(id: ID!): EmployeeAward!

	"""
	Puts a withdrawn award back, clearing the marker the withdrawal set.
	"""
	recoverEmployeeAward(id: ID!): EmployeeAward!
}
