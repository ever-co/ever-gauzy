# The accounting template domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists once
# for the whole platform, so a domain adds fields to it and never declares its own.
#
# Every field below is one the delivered `/api/accounting-template` routes already serve, under the same
# guard chain and with the same permission, so a client that reaches a capability over one protocol is
# not given a narrower or a wider one than the client that reaches it over the other. The controller
# states one permission on its class and none on any handler — the inherited creation, withdrawal and
# restoration included — so every field here states that one, and `PermissionGuard` reads the handler and
# then the class exactly as it does for the routes.
#
# **The list is the route that reads the whole filtered set.** The delivered resource serves its rows
# twice — `GET /` and `GET /pagination` — and `GET /` is the read that answers the caller's own copies
# *and* the copies belonging to no tenant and no organization that the platform itself ships. The
# paginated sibling reaches the same read with a page size, which the connection states itself, so the
# two fold into one field rather than becoming two that could disagree.
#
# **Two reads are not the list and are not narrowed lists.** `accountingTemplateFor` mirrors
# `GET /accounting-template/template`, which resolves the template a record of one type is rendered
# through — for one organization, in one language — by walking a four-step fallback: the requested
# language for this tenant, the requested language globally, English for this tenant, English globally,
# answering the first hit. That is a resolved answer rather than a page of rows, so it is a root field of
# its own and cannot be a filter over the connection. `accountingTemplatePreview` mirrors
# `POST /accounting-template/template/preview`, which converts a document and writes nothing: the route
# is a `POST` because it carries a document in a body, not because it changes anything, which is why the
# field is a read here.
#
# **The count takes no argument and answers a nullable `Int`.** The delivered count route passes its
# query string through as the store's own `where`, a shape no schema can state, so this field offers no
# narrowing rather than an argument the resolver could not pass on; what it counts is the caller's own
# rows, which is the call the route makes when it is given no options. It is nullable because a count is
# an aggregate a resource may legitimately have no answer for, and a non-null field would turn "not
# answered" into a fabricated zero.
#
# **The save is its own mutation.** `POST /accounting-template/template/save` is the write the
# platform's own template editor reaches: it resolves the copy by type, language and organization,
# compiles the stated source and stores both copies, creating the row when there is none. It is neither
# the creation nor the edit — a caller cannot know in advance which of the two it will be — so it is
# stated as the operation it is.
#
# **The gate is the catalogue's**: `FEATURE_GRAPHQL` is the code the commerce catalogue declares for the
# GraphQL endpoint and its resolvers, applied once on the resolver class so every field below is behind
# the one capability. The REST routes are not gated by that code — they are the door that stays open,
# which is what keeps an administrator able to edit a document template without the GraphQL surface — so
# a disabled capability is answered `Cannot query field <name>` here while those routes answer as they
# always did.

extend type Query {
	"""
	The accounting templates of the caller's tenant, with the copies the platform ships that belong to no
	tenant and no organization.
	"""
	accountingTemplates(
		filter: AccountingTemplateFilter
		sort: [AccountingTemplateSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
	): AccountingTemplateConnection!

	"""
	One accounting template, or null when there is none.

	A template that is not there answers `null` rather than a refusal: GraphQL has one answer for "no such
	row" on a field that may have none. The delivered node route answers the same miss with a `400`,
	because its handler catches every failure broadly and states no message with it — a refusal raised
	*about* a miss rather than a fact a client can act on — and this surface answers the miss itself,
	which is the same fact in this protocol's vocabulary. The read is the delivered one, tenant and
	global copies included, so a template the platform ships is reachable here.
	"""
	accountingTemplate(id: ID!): AccountingTemplate

	"""
	How many accounting templates the caller's tenant holds.
	"""
	accountingTemplateCount: Int

	"""
	The template one type of record is rendered through, for one organization, in one language,
	resolved through the delivered fallback: the requested language for this tenant, the requested
	language globally, English for this tenant, then English globally. The first of the four that
	answers is the answer.

	All three members are required, because the delivered query DTO requires all three: it validates the
	type against the accounting template vocabulary and the language against the platform's own, and it
	accepts an organization identifier in place of the organization object the REST body may carry
	instead. `languageCode` is passed to the resolved read beside the language of the request, which is
	the pair the delivered route passes from its query member and its `language` header.

	The answer is nullable: a template the fallback chain could not reach any row for is answered as no
	template at all rather than as a fabricated empty one — the difference between "this record has no
	template" and "this record has an empty template" is one a caller about to render a document has to
	be able to see.
	"""
	accountingTemplateFor(
		"Which record to resolve the template for: `invoice`, `estimate` or `receipt`."
		templateType: String!
		"The language to resolve the template in."
		languageCode: String!
		"The organization to resolve the template for."
		organizationId: ID!
	): AccountingTemplate

	"""
	Converts a document — MJML or plain text — into the HTML a preview shows, with its placeholders
	rendered from sample values and from the organization the caller states.

	Nothing is written and nothing is stored: the delivered route converts and answers.
	"""
	accountingTemplatePreview(
		"The document to convert."
		data: String!
		"The organization the sample values are read from, as the delivered body states it. Omit and the preview renders without one."
		organization: JSON
	): AccountingTemplatePreview!
}

extend type Mutation {
	"""
	Files a template. A caller holding MJML source wants `saveAccountingTemplate` below, which compiles
	the source and stores both copies; this field stores the columns it is given.
	"""
	createAccountingTemplate(input: CreateAccountingTemplateInput!): AccountingTemplate!

	"""
	Changes a template that exists. The delivered edit hands the store the stated columns beside the path
	identifier, so a member the caller leaves out is written as the column's default rather than left as
	it is — see `UpdateAccountingTemplateInput`.
	"""
	updateAccountingTemplate(input: UpdateAccountingTemplateInput!): AccountingTemplate!

	"""
	Removes a template outright. The row is gone and nothing reads it back, and the record that was
	rendered through it is rendered through whatever the lookup falls back to next — which is why a
	caller that means "stop using this copy" reaches for the soft removal below.
	"""
	deleteAccountingTemplate(id: ID!): Boolean!

	"""
	Withdraws a template without removing it: the row keeps its identifier and the delivered reads stop
	answering it.
	"""
	softDeleteAccountingTemplate(id: ID!): AccountingTemplate!

	"""
	Puts a withdrawn template back.
	"""
	recoverAccountingTemplate(id: ID!): AccountingTemplate!

	"""
	Saves the document of one template: the MJML source is stored and the compiled body is derived from
	it.

	The copy is resolved by its type, its language and its organization, and the row is created when the
	there is none — which is what makes this the write an editor reaches rather than either of the two
	above.
	"""
	saveAccountingTemplate(input: SaveAccountingTemplateInput!): AccountingTemplate!
}
