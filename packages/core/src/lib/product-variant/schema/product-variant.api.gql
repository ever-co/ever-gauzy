# The product variant domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists
# once for the whole platform, so a domain adds fields to it and never declares its own.
#
# Every field below is one the delivered REST routes already serve — the list, the one row, the
# count, the generation of a product's variants, the edit, the removal and the withdrawal of the
# featured image — under the same guard and with the same scope, so a client that reaches the
# capability over one protocol is not given a narrower or a wider one than the client that reaches it
# over the other.
#
# The list is a connection rather than a bare array. It takes the same query protocol the REST list
# route takes — the same filters in `filter`, the same keys in `sort`, the same page in `page` — and
# answers with the same shape the kernel's `PageInfo` gives every other connection, so a cursor
# obtained over one surface resumes on the other. `withDeleted` is deliberately absent: the delivered
# list methods read live rows only, and offering an argument that cannot be honoured would be worse
# than not offering it.

extend type Query {
	"""
	The variants of the caller's tenant, newest first.

	The variants of one product are these rows narrowed to that product, which is what the REST
	sub-route answers and what `filter: { productId: { eq: ... } }` states here.
	"""
	productVariants(
		filter: ProductVariantFilter
		sort: [ProductVariantSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
	): ProductVariantConnection!

	"""
	One variant, or null when there is none.
	"""
	productVariant(id: ID!): ProductVariant

	"""
	How many variants the caller's tenant holds.

	Nullable by design: a count is an aggregate a resource may legitimately have no answer for, and a
	non-null field would turn "not answered" into a fabricated zero — two facts a client that reports
	inventory has to keep apart. The delivered count route binds its query string to the store's own
	`where`, a shape no schema can state, so the field offers no narrowing of its own rather than an
	argument the resolver could not pass on. It is not the connection's `totalCount` either: that is
	the count of the rows the connection narrowed to, and this is the count of the caller's rows.
	"""
	productVariantCount: Int
}

extend type Mutation {
	"""
	Generates one variant per option combination. Each variant is stored with its own setting row and
	its own price row, because a variant without them cannot be priced, sold or counted.
	"""
	createProductVariants(input: CreateProductVariantsInput!): [ProductVariant!]!

	"""
	Changes the descriptive facts of a variant.
	"""
	updateProductVariant(input: UpdateProductVariantInput!): ProductVariant!

	"""
	Removes a variant, together with the setting and price rows that belong to it.
	"""
	deleteProductVariant(id: ID!): Boolean!

	"""
	Withdraws the variant's featured image. The asset itself is kept: it may still be the product's
	cover, another variant's image, or a member of the product's gallery.
	"""
	deleteProductVariantFeaturedImage(variantId: ID!): ProductVariant!
}
