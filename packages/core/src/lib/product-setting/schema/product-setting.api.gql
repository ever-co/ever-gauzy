# The variant setting domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists
# once for the whole platform, so a domain adds fields to it and never declares its own.
#
# Every field below is one the delivered `/api/product-variant-settings` routes already serve —
# under the same guard and with the same scope — so a client that reaches the capability over one
# protocol is not given a narrower or a wider one than the client that reaches it over the other.
# The controller declares no route of its own: the list, the one row, the count, the creation, the
# edit, the two removals and the restore are the ones every resource of this platform is mounted with,
# and they are all mirrored here, because a capability the REST surface serves and this one does not is
# the whole of what the two-protocol rule forbids.
#
# The list is a connection rather than a bare array. It takes the same query protocol the REST list
# route takes — the same filters in `filter`, the same keys in `sort`, the same page in `page` — and
# answers with the same shape the kernel's `PageInfo` gives every other connection, so a cursor
# obtained over one surface resumes on the other. The paginated list route has no field of its own:
# the page is what the connection answers with, so a second field for it would be a second surface
# that could disagree with this one. The count does have one — a bare number is not a connection, and
# `totalCount` is not that number: it is the count of the rows the connection narrowed to, while the
# count route counts the caller's own rows. `withDeleted` is offered because the delivered list route
# offers it: `BaseQueryDTO` carries it and that route hands its query string straight to the same
# read, so a REST caller can ask for withdrawn rows and a connection that could not would hide them.

extend type Query {
	"""
	The settings of the caller's tenant.
	"""
	productVariantSettings(
		filter: ProductVariantSettingFilter
		sort: [ProductVariantSettingSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
		withDeleted: Boolean
	): ProductVariantSettingConnection!

	"""
	One setting, or null when there is none.
	"""
	productVariantSetting(id: ID!): ProductVariantSetting

	"""
	How many settings the caller's tenant holds.

	Nullable by design: a count is an aggregate a resource may legitimately have no answer for, and a
	non-null field would turn "not answered" into a fabricated zero — two facts a client that reports
	inventory has to keep apart. The delivered count route binds its query string to the store's own
	`where`, a shape no schema can state, so the field offers no narrowing of its own rather than an
	argument the resolver could not pass on.
	"""
	productVariantSettingCount: Int
}

extend type Mutation {
	"""
	Opens a capability record for a variant.
	"""
	createProductVariantSetting(input: CreateProductVariantSettingInput!): ProductVariantSetting!

	"""
	Changes the capabilities a variant is recorded under.
	"""
	updateProductVariantSetting(input: UpdateProductVariantSettingInput!): ProductVariantSetting!

	"""
	Removes a setting outright: the row is gone and nothing reads it back.

	The two removals this resource serves are not the same operation, so both are stated rather than
	one of them being left to a client to discover on the other protocol.
	"""
	deleteProductVariantSetting(id: ID!): Boolean!

	"""
	Softly removes a setting: the row stays in the table, marked as removed, and the restore below
	reads it back. The answer is the row as it now stands, which is what the delivered route answers
	with.
	"""
	softDeleteProductVariantSetting(id: ID!): ProductVariantSetting!

	"""
	Restores a setting that was softly removed, clearing the marker the removal set.
	"""
	recoverProductVariantSetting(id: ID!): ProductVariantSetting!
}
