# The credential domain's GraphQL types.
#
# A credential is a party's login: the customer-side identity of somebody who is not a member of staff.
# The type below is the row **as it may be read**, and that is the whole point of it — the hash, the
# authenticator secret and the two single-use tokens are not members of this type at all, rather than
# members that happen to be null. A field a client can never legitimately read is a schema omission, and
# leaving it out is what makes "the secret never leaves the service" a property of the schema rather
# than of a projection somebody has to remember to apply.
#
# The consequence is deliberate and worth stating: a document that selects `passwordHash` does not get
# an empty answer, it does not compile. The same is true on the write path, where an input type is
# closed — there is no member a caller could put a hash in.

"""
A party's login — the only resource of the kernel that holds a secret, and one that answers without it.
"""
type ContactCredential {
	id: ID!
	tenantId: ID
	organizationId: ID
	"""The contact the credential authenticates. One contact is one login."""
	customerId: ID!
	"""The login identifier, always stored normalised. It resolves one credential per tenant."""
	email: String!
	"""Whether the e-mail address has been confirmed by redeeming its verification token."""
	isVerified: Boolean!
	"""When the contact last authenticated successfully."""
	lastLoginAt: DateTime
	"""
	The instant the credential stops refusing logins, when it is locked.

	The lockout ladder counts consecutive failures, so this is a statement about them rather than a
	permanent state: a successful authentication clears both it and the counter.
	"""
	lockedUntil: DateTime
	"""
	Whether an authenticator factor has been enrolled.

	Answered as a flag rather than as the secret: the value is encrypted at rest and is read by nothing
	that answers a caller.
	"""
	hasMfa: Boolean!
	createdAt: DateTime
	updatedAt: DateTime
}

"""
The boundary of one page of credentials.
"""
type ContactCredentialEdge {
	node: ContactCredential!
	cursor: String!
}

"""
One page of credentials, with the total the filters select and the boundary cursors.
"""
type ContactCredentialConnection {
	nodes: [ContactCredential!]!
	edges: [ContactCredentialEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields a credential may be sorted by.
"""
enum ContactCredentialSortField {
	createdAt
	updatedAt
	email
	isVerified
	lastLoginAt
}

"""
The order the credentials are returned in. At most three keys are accepted.
"""
input ContactCredentialSort {
	field: ContactCredentialSortField!
	direction: SortDirection!
}

"""
The fields a credential list may be narrowed by.

Every member is a member of the readable shape, because the shape is what the connection filters: a
secret member is not filterable here for the same reason it is not selectable.
"""
input ContactCredentialFilter {
	id: IDFilter
	customerId: IDFilter
	email: StringFilter
	isVerified: BooleanFilter
	hasMfa: BooleanFilter
	lastLoginAt: DateTimeFilter
	lockedUntil: DateTimeFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	and: [ContactCredentialFilter!]
	or: [ContactCredentialFilter!]
	not: ContactCredentialFilter
}

"""
What a caller states when it records a party's login.

`password` is the password the party chose, hashed by the platform's password hasher before the service
is reached — the contract the service states when it demands a hash and refuses a plaintext. The four
secrets the row stores are absent by construction, and because an input type is closed, a document that
names one is refused by the schema itself.
"""
input CreateContactCredentialInput {
	organizationId: ID!
	customerId: ID!
	email: String!
	password: String!
	metadata: JSON
}
