# The credential domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists once
# for the whole platform, so a domain adds fields to it and never declares its own. The names are the
# ones the GraphQL API specification fixes for this resource.
#
# **There is no node query, and that is the specification's own list rather than a gap.** §3.2 row 4
# names `contactCredentials` and no `contactCredential(id)`, and the endpoint table names no detail route
# for the resource either: a credential is addressed by the contact it authenticates, which is a filter
# on the list below, because one contact holds one login.
#
# **The login, refresh, logout, verification and reset rows of the endpoint table have no root field
# here.** Each of them assumes a contact subject — an authenticated party whose own credential the
# request acts on — and the platform has none: `RequestContext` carries a staff user, and no decorator
# establishes a contact. Issuing a token for a contact would be inventing a second authentication path,
# so it is reported rather than faked.

extend type Query {
	"""
	The credentials of the caller's organization, newest first. No row of this connection carries a
	secret: the projection is applied before the connection is built, so the four members the table
	stores are not filterable, not sortable and not selectable here.
	"""
	contactCredentials(
		filter: ContactCredentialFilter
		sort: [ContactCredentialSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
	): ContactCredentialConnection!
}

extend type Mutation {
	"""
	Records a party's login. The password is hashed by the platform's password hasher before the
	service is reached; a document that states a hash instead is refused by the schema, because the
	input type has no member for one.
	"""
	createContactCredential(input: CreateContactCredentialInput!): ContactCredential!

	"""
	Revokes a credential, which is the only removal path there is: the row is kept so that the sessions,
	the audit entries and the export archive that referenced it stay readable, and a party that
	registers again is attached to the same contact rather than duplicated.
	"""
	revokeContactCredential(id: ID!): ContactCredential!
}
