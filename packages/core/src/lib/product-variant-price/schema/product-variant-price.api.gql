# The variant price domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists
# once for the whole platform, so a domain adds fields to it and never declares its own.
#
# Every field below is one the delivered `/api/product-variant-price` routes already serve, under the
# same guard and with the same scope, so a client that reaches a capability over one protocol is not
# given a narrower or a wider one than the client that reaches it over the other. The controller
# declares no route of its own: the list, the one row, the count, the creation, the edit, the two
# removals and the restore are the ones every resource of this platform is mounted with, and they are
# all mirrored here, because a capability the REST surface serves and this one does not is the whole of
# what the two-protocol rule forbids.
#
# **The route is singular and the collection is plural.** `/api/product-variant-price` is the price of
# a variant, and the schema names the collection for what it collects rather than for the path it
# happens to sit on — which is also the name the platform's own catalogue sweep looks for, so the
# spelling is settled rather than chosen here.
#
# The list is a connection rather than a bare array. It takes the same query protocol the REST list
# route takes — the same filters in `filter`, the same keys in `sort`, the same page in `page` — and
# answers with the same shape the kernel's `PageInfo` gives every other connection, so a cursor
# obtained over one surface resumes on the other. The paginated list route has no field of its own:
# the page is what the connection answers with, so a second field for it would be a second surface
# that could disagree with this one. The count does have one — a bare number is not a connection, and
# `totalCount` is not that number: it is the count of the rows the connection narrowed to, while the
# count route counts the caller's own rows. `withDeleted` is deliberately absent: the delivered list
# method reads live rows only, and offering an argument that cannot be honoured would be worse than
# not offering it.
#
# The list states no order of its own and the delivered method therefore answers in the store's, so the
# connection's default is the one that makes a cursor walk total — see the resolver's declared default
# — rather than a reproduction of an order the route never declared.

extend type Query {
	"""
	The prices of the caller's tenant.
	"""
	productVariantPrices(
		filter: ProductVariantPriceFilter
		sort: [ProductVariantPriceSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
	): ProductVariantPriceConnection!

	"""
	One price of the caller's tenant, or null when there is none.
	"""
	productVariantPrice(id: ID!): ProductVariantPrice

	"""
	How many prices the caller's tenant holds.

	Nullable by design: a count is an aggregate a resource may legitimately have no answer for, and a
	non-null field would turn "not answered" into a fabricated zero — two facts a client that reports
	inventory has to keep apart. The delivered count route binds its query string to the store's own
	`where`, a shape no schema can state, so the field offers no narrowing of its own rather than an
	argument the resolver could not pass on.
	"""
	productVariantPriceCount: Int
}

extend type Mutation {
	"""
	Prices a variant: an amount and the currency it is stated in, for the cost and for the sale.
	"""
	createProductVariantPrice(input: CreateProductVariantPriceInput!): ProductVariantPrice!

	"""
	Changes a price. A member the caller leaves out is left as it is.
	"""
	updateProductVariantPrice(input: UpdateProductVariantPriceInput!): ProductVariantPrice!

	"""
	Removes a price outright: the row is gone and nothing reads it back.

	The two removals this resource serves are not the same operation, so both are stated rather than
	one of them being left to a client to discover on the other protocol.
	"""
	deleteProductVariantPrice(id: ID!): Boolean!

	"""
	Softly removes a price: the row stays in the table, marked as removed, and the restore below reads
	it back. The answer is the row as it now stands, which is what the delivered route answers with.
	"""
	softDeleteProductVariantPrice(id: ID!): ProductVariantPrice!

	"""
	Restores a price that was softly removed, clearing the marker the removal set.
	"""
	recoverProductVariantPrice(id: ID!): ProductVariantPrice!
}
