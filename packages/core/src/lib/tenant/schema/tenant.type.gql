# The tenant's object type.
#
# A tenant is this installation's own customer record: the row every other row on the platform is
# scoped by, and the one row a caller reads with the identifier its credential carries rather than one
# it states. The resource is small — a name, a logo, a billing identity and one scheduling default —
# and the type below is the whole of what the delivered read answers.
#
# `image` is carried beside `imageId` because the relation is eager on the entity: the delivered read
# loads the asset whether or not a caller asks for it, so the member is present on every row this
# surface answers and the asset's own type describes it.
#
# `stripeCustomerId` is a billing **identifier** and never a credential. It names the account this
# tenant is charged through, the platform's billing routes resolve a tenant by it, and the delivered
# read returns it — so it is carried here, because this surface is the same rows under the same guards
# and never a wider or a narrower view of them. Nothing authenticates with it: the credential that
# does is the installation's own payments key, which is server-side configuration and lives on no
# tenant row.
#
# `logo` and `imageId` are both carried although they name one asset, because they are two different
# facts: `imageId` is the relation and `logo` is the denormalised string the read answers beside it,
# and a body that writes one does not always get the other written.
#
# Three groups of members the row declares are deliberately absent, each for its own reason:
#
# - `organizations`, `rolePermissions` and `featureOrganizations` are not exposed. They are
#   collections of other domains' rows, the delivered read does not load them, and each is reachable
#   through the resource that owns it rather than through the tenant that happens to own it.
# - `deletedAt` is not exposed. No delivered route withdraws a tenant — the resource serves a read, a
#   creation, an edit and a removal, and nothing else — so the member would be null on every row this
#   surface could ever answer.
# - the audit columns (`createdByUserId`, `updatedByUserId`, `deletedByUserId`) are not exposed, which
#   is the convention every object type here follows: they are bookkeeping about the write rather than
#   facts about the tenant.

"""
One tenant: the customer record every other row of this installation is scoped by.
"""
type Tenant {
	id: ID!
	name: String!
	"A denormalised logo reference, kept for readers that must not join the asset table."
	logo: String
	"The asset the interface shows for the tenant."
	imageId: ID
	image: ImageAsset
	"""
	The billing account this tenant is charged through. Null on an installation that bills nobody,
	which is every self-hosted one.
	"""
	stripeCustomerId: String
	"The tenant's standard working day, in whole hours, between 1 and 24."
	standardWorkHoursPerDay: Int
	createdAt: DateTime
	updatedAt: DateTime
	isActive: Boolean
	isArchived: Boolean
}

"""
What a caller states when it creates a tenant.

The members are the delivered creation body's own, and the identifier of the new tenant is not among
them: the row's identifier is generated by the store, and the caller that files a tenant is a user who
has none yet — assigning it afterwards is the delivered onboarding's own work, not a member of the
write.

The three import members are carried although a caller normally states none of them. They are the
delivered body's own — a migration states them so the new tenant's rows can be correlated with the
rows they were copied from — and the platform anonymises them in its documentation for the same
reason it validates them: they are only meaningful to a migration. Offering them costs a client that
never migrates nothing, and refusing them would refuse a body the delivered route serves.
"""
input CreateTenantInput {
	name: String!
	logo: String
	imageId: ID
	"Whether this creation is part of a migration, in which case the source identifiers are recorded."
	isImporting: Boolean
	"The identifier the tenant had in the installation it is being migrated from."
	sourceId: String
	"The identifier the creating user had in the installation it is being migrated from."
	userSourceId: String
}

"""
What a caller states when it edits its own tenant.

The identifier is not a member, and that is the shape of the delivered route rather than a
simplification: `PUT /api/tenant` takes no path parameter and reads the tenant from the credential, so
there is nothing for a caller to name and nothing for this input to carry. Every member is the edit
body's own, and the name is required because the delivered body requires it — an edit states the name
it wants rather than patching around the one on the row.
"""
input UpdateTenantInput {
	name: String!
	logo: String
	imageId: ID
}
