"""
One company-account membership: who may buy for an organization contact, in what role, and up to what.
"""
type ContactBuyer {
  id: ID!
  tenantId: ID
  organizationId: ID

  """The company account. A contact whose kind is `COMPANY`."""
  companyCustomerId: ID!

  """The individual buyer. A different contact from the account, always."""
  buyerCustomerId: ID!

  """
  What the buyer may do inside the account. The membership's authority, not a tenant role.
  """
  role: ContactBuyerRole!

  """
  The per-order ceiling for this buyer.
  
  When both this and the account's credit facility are set, the effective ceiling is the **lower** of
  the two: a buyer limit narrows what the account allows and never widens it.
  """
  spendingLimit: Decimal

  """
  The ceiling over one rolling period, evaluated as spent plus total against it.
  """
  periodSpendingLimit: Decimal

  """Orders at or above this amount require an approval."""
  approvalThreshold: Decimal

  """
  The day of the month the rolling period restarts, 1–28 so that every month has it.
  """
  periodStartDay: Int

  """When the buyer was attached to the account."""
  assignedAt: DateTime

  """
  The staff user who invited the buyer, when a member of staff did. History, not an authority.
  """
  invitedByUserId: ID

  """Whether the membership currently grants what its role allows."""
  isActive: Boolean

  """Tenant-defined extras."""
  metadata: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

"""
What a buyer may do inside the company account it belongs to.

The role is the membership discriminator and not a capability: it says what kind of member this is,
while the approval capability of an approver is the platform permission the staff side already evaluates.
"""
enum ContactBuyerRole {
  """
  Administers the account: its buyer list, its limits and its approval thresholds.
  """
  ADMIN

  """
  May approve or reject an order a purchaser raised above that purchaser's threshold.
  """
  APPROVER

  """
  May place orders on the account, inside its own per-order and rolling-period limits.
  """
  PURCHASER

  """May read the account's orders and invoices, and may not place one."""
  VIEWER
}

