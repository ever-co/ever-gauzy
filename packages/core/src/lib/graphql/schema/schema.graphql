  """
  bulkVendorProductTerms(input: BulkVendorProductTermInput!): VendorProductTermPayload!

  """Retires a term. One a placed order used is kept and moved to INACTIVE."""
  deleteVendorProductTerm(id: ID!): DeleteVendorProductTermPayload!

  """Grants a right. Idempotent on the order line or subscription it names."""
  grantEntitlement(input: GrantEntitlementInput!): GrantEntitlementPayload!

  """
  Withdraws a right, terminally. Its keys and its live activations go with it.
  """
  revokeEntitlement(id: ID!, reason: String!): EntitlementPayload!

  """Extends the term of a right, which is what a successful renewal does."""
  extendEntitlement(id: ID!, endsAt: DateTime!, quantity: Int): EntitlementPayload!

  """Occupies a slot of a right for a device or a named seat."""
  activateEntitlement(input: ActivateEntitlementInput!): ActivateEntitlementPayload!

  """Gives a slot back: released by the holder, or revoked by support."""
  deactivateEntitlement(id: ID!, reason: String, revoked: Boolean): DeactivateEntitlementPayload!

  """
  Issues a licence key. Its plaintext is returned once, in this response.
  """
  issueEntitlementKey(input: IssueEntitlementKeyInput!): IssueEntitlementKeyPayload!

  """Withdraws a credential, releasing the activations it was used for."""
  revokeEntitlementKey(id: ID!, reason: String!): EntitlementKeyPayload!

  """
  Submits a seller application for review. The seller becomes `SUBMITTED` and no further.
  """
  submitSeller(id: ID!): Seller!

  """Activates an approved seller. `ACTIVE` is never reached implicitly."""
  activateSeller(id: ID!): Seller!

  """
  Suspends a seller, with a reason the seller can read. Balances are held.
  """
  suspendSeller(id: ID!, reason: String!): Seller!

  """Returns a suspended seller to active."""
  reinstateSeller(id: ID!): Seller!

