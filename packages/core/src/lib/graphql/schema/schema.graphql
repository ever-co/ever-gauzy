  """
  Approves a payout. Approving is a separate permission from creating, because approving one moves money.
  """
  approveSellerPayout(id: ID!): SellerPayout!

  """Records the provider's execution of a payout, as reported."""
  markSellerPayoutPaid(id: ID!, providerKey: String, providerTransferId: String): SellerPayout!

  """Cancels an unpaid payout, returning its ledger rows to settleable."""
  cancelSellerPayout(id: ID!, reason: String!): SellerPayout!

  """
  Records a settlement reported by a provider, as reported: the ledger is never edited to agree with it.
  """
  createSellerSettlement(sellerId: ID!, providerKey: String!, currency: String!, grossAmount: String!, commissionAmount: String, feeAmount: String): SellerSettlement!

  """Re-weights or deactivates an index definition."""
  updateSearchIndexDefinition(id: ID!, input: SearchIndexDefinitionUpdateInput!): SearchIndexDefinitionPayload!

  """
  Removes a definition an operator authored; a shipped definition is refused.
  """
  deleteSearchIndexDefinition(id: ID!): DeleteSearchIndexDefinitionPayload!

  """Rebuilds one entity's index."""
  reindexEntity(entity: String!, input: SearchReindexInput): SearchReindexPayload!

  """Rebuilds every index, or every index of one channel."""
  reindexAll(input: SearchReindexInput): SearchReindexPayload!

  """Drops the index of an entity, or of one channel."""
  dropSearchIndex(entity: String, channelId: ID): DropSearchIndexPayload!
}

type AddressRole {
  id: ID!
  organizationId: ID
  addressId: ID!
  role: AddressRoleEnum!
  isDefault: Boolean!
}

enum AddressRoleEnum {
  SHIPPING
  BILLING
  REGISTERED
  PAYOUT
  RETURN
  REMIT_TO
}

input CreateAddressRoleInput {
  organizationId: ID!
  addressId: ID!
  role: AddressRoleEnum!
  isDefault: Boolean
}

"""
One row of the address book: a reusable postal address with the roles it plays and the two defaults
it may carry.
"""
type Address {
  id: ID!
  tenantId: ID
  organizationId: ID

  """Customer-facing nickname ("Home", "Warehouse 2")."""
  label: String

  """The person to address at this location."""
  contactName: String

  """Company name as it should appear on a label or an invoice."""
  company: String
  firstName: String
  lastName: String
  phone: String
  email: String

  """
  Street address. Always present: an address that names no street names nothing.
  """
  line1: String!

  """Second line of the street address — a unit, a floor, a building."""
  line2: String

  """City or locality. Always present."""
  city: String

  """Free-text province name as entered."""
  province: String

  """
  Normalised province or state code — the member a rate table is keyed by.
  """
  provinceCode: String

  """Postal or ZIP code, as entered."""
  postalCode: String

  """
  ISO 3166-1 alpha-2 country code, upper case. The member tax and shipping rules match on.
  """
  countryCode: String!

  """
  The country lookup row, non-null exactly when `countryCode` matched one.
  """
  countryId: ID
  latitude: Float
  longitude: Float

  """
  Whether this is the party's default shipping address.
  
  A derived mirror, not the authority: the party's own column is authoritative and the two are
  written in one transaction by the set-default and clear-default operations, so a write that
  disagrees is refused rather than reconciled.
  """
  isDefaultShipping: Boolean!

  """The billing counterpart of the above, on the same terms."""
  isDefaultBilling: Boolean!

  """Whether an address-validation strategy has confirmed this address."""
  isValidated: Boolean!

  """Which validator produced the verdict, when one did."""
  validationProviderKey: String

  """What kind of thing the address belongs to."""
  ownerType: AddressOwnerType!

  """
  The id of the row `ownerType` names. No foreign key: the target table depends on the type.
  """
  ownerId: ID!

  """
  The buyer this address is scoped to, when it is a party's. Null on an anonymous cart address.
  """
  customerId: ID

  """
  Tenant extras, including the raw provider response once a validator has answered.
  """
  metadata: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

"""What kind of thing a row of the address book belongs to."""
enum AddressOwnerType {
  """
  The address belongs to an organization contact; `customerId` equals `ownerId`.
  """
  CONTACT

  """
  The address belongs to a stock location — the ship-from a carrier label prints.
  """
  WAREHOUSE

  """The address belongs to a marketplace seller."""
  SELLER

  """
  The address belongs to a supplier — what a purchase order prints as its remit-to.
  """
  VENDOR

  """The address belongs to the organization itself, not to any party."""
  ORGANIZATION
}

"""The boundary of one page of addresses."""
type AddressEdge {
  node: Address!
  cursor: String!
}

"""
One page of addresses, with the total the filters select and the boundary cursors.
"""
type AddressConnection {
  nodes: [Address!]!
  edges: [AddressEdge!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

"""The fields an address may be sorted by."""
enum AddressSortField {
  createdAt
  updatedAt
  label
  city
  countryCode
  postalCode
  isDefaultShipping
  isDefaultBilling
}

"""
The order the addresses are returned in. At most three keys are accepted.
"""
input AddressSort {
  field: AddressSortField!
  direction: SortDirection!
}

"""Comparison on the kind of thing an address belongs to."""
input AddressOwnerTypeFilter {
  eq: AddressOwnerType
  ne: AddressOwnerType
  in: [AddressOwnerType!]
  nin: [AddressOwnerType!]
  isNull: Boolean
}

"""
The fields an address list may be narrowed by. `and` is the default; `or` requires any of its members
and `not` excludes the rows that match it.
"""
input AddressFilter {
  id: IDFilter
  label: StringFilter
  contactName: StringFilter
  company: StringFilter
  phone: StringFilter
  email: StringFilter
  line1: StringFilter
  line2: StringFilter
  city: StringFilter
  province: StringFilter
  provinceCode: StringFilter
  postalCode: StringFilter
  countryCode: StringFilter
  countryId: IDFilter
  isDefaultShipping: BooleanFilter
  isDefaultBilling: BooleanFilter
  isValidated: BooleanFilter
  ownerType: AddressOwnerTypeFilter
  ownerId: IDFilter
  customerId: IDFilter
  createdAt: DateTimeFilter
  updatedAt: DateTimeFilter
  and: [AddressFilter!]
  or: [AddressFilter!]
  not: AddressFilter
}

"""
What a caller states when it records an address in the book.

The validation verdict is absent by construction — it is the address-validation strategy's own
statement — and a body that states one is refused rather than ignored. The two default members are
accepted and are routed to the set-default operation, so a create never writes a default flag itself.
"""
input CreateAddressInput {
  organizationId: ID!
  label: String
  contactName: String
  company: String
  firstName: String
  lastName: String
  phone: String
  email: String
  line1: String!
  line2: String
  city: String!
  province: String
  provinceCode: String
  postalCode: String
  countryCode: String!
  countryId: ID
  latitude: Float
  longitude: Float
  isDefaultShipping: Boolean
  isDefaultBilling: Boolean
  ownerType: AddressOwnerType
  ownerId: ID!
  customerId: ID
  metadata: JSON
}

"""
What a caller may change on an address that exists.

Every member is optional, and the owner pair is among them: an address legitimately moves from one
warehouse to another, and the service re-runs the owner-consistency check and the default rule on the
new owner's book when it does.
"""
input UpdateAddressInput {
  id: ID!
  organizationId: ID!
  label: String
  contactName: String
  company: String
  firstName: String
  lastName: String
  phone: String
  email: String
  line1: String
  line2: String
  city: String
  province: String
  provinceCode: String
  postalCode: String
  countryCode: String
  countryId: ID
  latitude: Float
  longitude: Float
  isDefaultShipping: Boolean
  isDefaultBilling: Boolean
  ownerType: AddressOwnerType
  ownerId: ID
  customerId: ID
  metadata: JSON
}

"""
The role a default operation names, and which way the fact moves.

One input for both directions because the fact is one: the address either becomes the party's default
for the role or stops being it, and a client that had to choose between two root fields would be
choosing a spelling rather than a capability. `isDefault` defaults to true, so the common call states
only the role.
"""
input SetDefaultAddressInput {
  id: ID!
  role: AddressRoleEnum!
  isDefault: Boolean
}

"""
One hostname that resolves to one channel.

Exactly one row per channel is primary, and `hostname` is unique across the whole deployment rather
than per tenant: the header is global, and two tenants claiming one host would make the resolution
ambiguous in exactly the request that cannot ask a question first.
"""
type ChannelDomain {
  id: ID!
  channelId: ID!
  channel: Channel

  """Lower-cased hostname, without scheme and without a trailing slash."""
  hostname: String!

  """
  Whether this is the channel's canonical host, which the others redirect to.
  """
  isPrimary: Boolean!

  """
  When false the host is served over plain HTTP — development and internal deployments.
  """
  isSslEnabled: Boolean!

  """
  Whether a request to this host is redirected to the channel's primary host.
  """
  redirectToPrimary: Boolean!

  """
  Tenant extras: the certificate reference, a content-delivery identifier.
  """
  metadata: JSON
  tenantId: ID
  organizationId: ID
  createdAt: DateTime
  updatedAt: DateTime
}

"""
What a verification of one hostname answers.

`verified` is true when the hostname resolves to the channel it is bound to, `resolvedTo` names the
channel it resolved to, and `checkedAt` is when the check ran. Whether a certificate is installed in
front of the host is a deployment question this database does not hold.
"""
type ChannelDomainVerification {
  verified: Boolean!
  resolvedTo: ID
  checkedAt: DateTime!
}

"""The boundary of one page of hostnames."""
type ChannelDomainEdge {
  node: ChannelDomain!
  cursor: String!
}

"""
One page of hostnames, with the total the filters select and the boundary cursors.
"""
type ChannelDomainConnection {
  nodes: [ChannelDomain!]!
  edges: [ChannelDomainEdge!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

"""The fields a hostname may be sorted by."""
enum ChannelDomainSortField {
  createdAt
  updatedAt
  hostname
  isPrimary
  isSslEnabled
  redirectToPrimary
}

"""
The order the hostnames are returned in. At most three keys are accepted.
"""
input ChannelDomainSort {
  field: ChannelDomainSortField!
  direction: SortDirection!
}

"""The fields a hostname list may be narrowed by."""
input ChannelDomainFilter {
  id: IDFilter
  channelId: IDFilter
  hostname: StringFilter
  isPrimary: BooleanFilter
  isSslEnabled: BooleanFilter
  redirectToPrimary: BooleanFilter
  createdAt: DateTimeFilter
  updatedAt: DateTimeFilter
  and: [ChannelDomainFilter!]
  or: [ChannelDomainFilter!]
  not: ChannelDomainFilter
}

"""
What a caller states when it binds a hostname to a channel.

`channelId` and `hostname` are both required. The three flags carry their column defaults when they
are absent, so a plain binding is a primary, TLS-served, non-redirecting host.
"""
input CreateChannelDomainInput {
  channelId: ID!
  hostname: String!
  isPrimary: Boolean
  isSslEnabled: Boolean
  redirectToPrimary: Boolean
  metadata: JSON
}

"""
What a caller may change on a hostname that exists.

The hostname and the channel are absent: a binding that could be re-pointed is a binding whose
resolution changes under the requests that already resolved it. Setting `isPrimary` moves the flag
from the current holder rather than being refused, because an update is the deliberate operation.
"""
input UpdateChannelDomainInput {
  id: ID!
  isPrimary: Boolean
  isSslEnabled: Boolean
  redirectToPrimary: Boolean
  metadata: JSON
}

type Subscription {
  """
  Every change to a channel of the caller's tenant: a creation, an edit, a status move, a default
  change, a region-set replacement, a retirement, or a hostname bound to or withdrawn from it. The
  stream is narrowed by `channelId` and by `action`; both only ever narrow what the credential may
  already read.
  
  A subscription is a notification and never a system of record: an event produced while the client
  is disconnected is not replayed, and a client that must not miss one registers a webhook.
  """
  channelChanged(channelId: ID, action: String): Channel!

  """
  Every change to a contact group of the caller's tenant: the group being created, edited or
  soft-deleted, and its membership being granted or withdrawn. The stream is narrowed by `groupId`
  and by `action`; both only ever narrow what the credential may already read.
  
  A subscription is a notification and never a system of record: an event produced while the client
  is disconnected is not replayed, and a client that must not miss one registers a webhook.
  """
  contactGroupChanged(groupId: ID, action: String): ContactGroup!

  """
  A stream of the platform's events, selected by name. One event is delivered per message, so a
  payload never merges unrelated facts. A subscription is a notification and never a system of
  record: an event produced while a client is disconnected is not replayed, and a client that must
  not miss one registers a webhook.
  """
  events(
    """
    The event names to receive, exactly as the platform names them (`order.placed`) or as a
    one-segment prefix pattern (`order.*`). At least one name is required, and a selection that
    matches no known event is refused at subscribe time so a typo is visible immediately.
    """
    names: [String!]!

    """
    Narrows the stream to one aggregate. It can only narrow what the credential may read.
    """
    aggregateId: ID

    """Narrows the stream to one channel of the credential's own scope."""
    channelId: ID
  ): EventEnvelope

  """
  Every change to a region of the caller's tenant: a creation, an edit, a default change, a
  retirement, or a country-set replacement. The stream is narrowed by `regionId` and by `action`;
  both only ever narrow what the credential may already read.
  
  A subscription is a notification and never a system of record: an event produced while the client
  is disconnected is not replayed, and a client that must not miss one registers a webhook.
  """
  regionChanged(regionId: ID, action: String): Region!
  collectionChanged(id: ID): Collection!
  productPublished(productId: ID, channelId: ID): ProductPublication!
  productUnpublished(productId: ID, channelId: ID): ProductPublication!
  stockLevelChanged(warehouseId: ID, variantId: ID): StockLevel!
  stockLevelLow(warehouseId: ID): StockLevel!
  stockLevelOutOfStock(warehouseId: ID): StockLevel!
  stockReservationChanged(referenceId: ID): StockReservation!
  stockTransferChanged(id: ID): StockTransfer!
  paymentAuthorized(organizationId: ID): PaymentSession!
  paymentCaptured(organizationId: ID): PaymentCapture!
  paymentFailed(organizationId: ID): PaymentSession!
  paymentCanceled(organizationId: ID): PaymentSession!
  paymentRefunded(organizationId: ID): Refund!
  refundCreated(organizationId: ID): Refund!

  """
  A promotion was created, activated or expired.
  
  The stream is the promotion domain's own event stream, so a subscriber sees exactly the facts
  the domain already publishes for its outbox rather than a second, transport-shaped copy of
  them. `promotionId` narrows the stream to one promotion; it can only narrow what the caller is
  already allowed to read.
  """
  promotionChanged(promotionId: ID): PromotionChangedPayload!

  """
  A campaign budget reached its ceiling and its promotions stopped being applied.
  """
  promotionBudgetExhausted(promotionId: ID, budgetId: ID): PromotionBudgetExhaustedPayload!

  """
  A code was redeemed, whether by a basket being checked out or by an order being placed.
  """
  couponRedeemed(couponId: ID): CouponRedeemedPayload!

  """Stored value was spent with a card."""
  giftCardRedeemed(giftCardId: ID): GiftCardRedeemedPayload!

  """Streams rights that were granted or changed."""
  entitlementChanged(entitlementId: ID): Entitlement!

  """Streams rights that had a slot taken."""
  entitlementActivated(entitlementId: ID): Entitlement!

  """Streams rights that were withdrawn."""
  entitlementRevoked(entitlementId: ID): Entitlement!
}

"""
The sales context: a storefront, a marketplace listing, a point of sale, a B2B portal.
"""
type Channel {
  id: ID!
  tenantId: ID
  organizationId: ID
  name: String!

  """
  Stable key, unique per organization among the live rows. Written once: it is what a storefront
  URL, a seed file and an import mapping name.
  """
  code: String!
  description: String

  """Only `ACTIVE` serves requests. `ARCHIVED` is terminal."""
  status: ChannelStatus!

  """
  Whether this is the organization's default channel. At most one live row carries it.
  """
  isDefault: Boolean!

  """
  Currency of a cart created without an explicit currency. A three-letter ISO code.
  """
  defaultCurrency: String!

  """
  The region applied when a request does not resolve one. When set, it is also a member of `regions`.
  """
  defaultRegionId: ID
  defaultRegion: Region

  """BCP-47 locale for translated content."""
  defaultLocale: String

  """
  Prefix handed to the numbering series this channel numbers its documents with.
  """
  orderNumberPrefix: String

  """Zero-padding width of the numeric part of an order number."""
