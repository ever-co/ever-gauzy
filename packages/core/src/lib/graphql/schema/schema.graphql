The delivered edit dispatches the same command the create dispatches, with the identifier path and the
body together, so the members the delivered validation requires are required here for the same reason
they are required on the create.

**A member the caller leaves out is left as it is.** The delivered write is the platform's own upsert:
it writes the members the body states onto the row the identifier names and touches no others, so
