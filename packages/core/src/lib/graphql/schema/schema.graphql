"""A named, scoped, time-boxed set of prices."""
type PriceList {
  id: ID!
  tenantId: ID
  organizationId: ID
  name: String!
  code: String!
  description: String

  """Whether the list competes on price or wins outright for its context."""
  type: PriceListType!
  status: PriceListStatus!

  """Higher wins between two eligible lists."""
  priority: Int!

  """
  Currency the list's prices are expressed in; null applies to any currency.
  """
  currency: String
  channelId: ID
  customerGroupId: ID
  regionId: ID
  startsAt: DateTime
  endsAt: DateTime
  isTaxInclusive: Boolean!
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""The price of one product variant."""
type ProductPrice {
  id: ID!
  tenantId: ID
  organizationId: ID

  """
  Null is the default price of the variant, used when no price list wins.
  """
  priceListId: ID

  """
  Null is an open-scoped row: its applicability is exactly its own PRICE rules.
  """
  variantId: ID
  currency: String!

  """
  The price, for a row that states one; null exactly when the row derives its price.
  """
  amount: Decimal

  """How the row computes its price."""
  computeMode: PriceComputeMode!

  """
  Signed fraction of the base: positive reduces it, negative is a cost-plus markup.
  """
  percent: Decimal

  """Which price a derivation starts from."""
  baseSource: PriceBaseSource

  """The list a PRICE_LIST derivation reads."""
  basePriceListId: ID

  """
  The multiple the derived amount is rounded to, before the currency rounding boundary.
  """
  roundTo: Decimal

  """
  The unit the quantity bounds are expressed in; null means the variant's sales unit.
  """
  unitId: ID

  """Display-only "was" price. It never enters a total."""
  compareAtAmount: Decimal

  """Cost snapshot the margin guard reads. It never enters a total."""
  costAmount: Decimal

  """Lower bound of the quantity band; null is open."""
  minQuantity: Decimal

  """Upper bound of the quantity band; null is open."""
  maxQuantity: Decimal

  """Null inherits from the price list, then from a price preference."""
  taxInclusive: Boolean

  """Margin floor as a fraction, e.g. 0.250000 for 25 %."""
  minMarginPercent: Decimal

  """Discount ceiling as a fraction, e.g. 0.300000 for 30 %."""
  maxDiscountPercent: Decimal
  status: PriceStatus!
  startsAt: DateTime
  endsAt: DateTime
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

