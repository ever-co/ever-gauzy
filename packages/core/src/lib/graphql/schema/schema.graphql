"""
One row of the address book: a reusable postal address with the roles it plays and the two defaults
it may carry.
"""
type Address {
  id: ID!
  tenantId: ID
  organizationId: ID

  """Customer-facing nickname ("Home", "Warehouse 2")."""
  label: String

  """The person to address at this location."""
  contactName: String

  """Company name as it should appear on a label or an invoice."""
  company: String
  firstName: String
  lastName: String
  phone: String
  email: String

  """
  Street address. Always present: an address that names no street names nothing.
  """
  line1: String!

  """Second line of the street address — a unit, a floor, a building."""
  line2: String

  """City or locality. Always present."""
  city: String

  """Free-text province name as entered."""
  province: String

  """
  Normalised province or state code — the member a rate table is keyed by.
  """
  provinceCode: String

  """Postal or ZIP code, as entered."""
  postalCode: String

  """
  ISO 3166-1 alpha-2 country code, upper case. The member tax and shipping rules match on.
  """
  countryCode: String!

  """
  The country lookup row, non-null exactly when `countryCode` matched one.
  """
  countryId: ID
  latitude: Float
  longitude: Float

  """
  Whether this is the party's default shipping address.
  
  A derived mirror, not the authority: the party's own column is authoritative and the two are
  written in one transaction by the set-default and clear-default operations, so a write that
  disagrees is refused rather than reconciled.
  """
  isDefaultShipping: Boolean!

  """The billing counterpart of the above, on the same terms."""
  isDefaultBilling: Boolean!

  """Whether an address-validation strategy has confirmed this address."""
  isValidated: Boolean!

