type Subscription {
  """
  Every change to a channel of the caller's tenant: a creation, an edit, a status move, a default
  change, a region-set replacement, a retirement, or a hostname bound to or withdrawn from it. The
  stream is narrowed by `channelId` and by `action`; both only ever narrow what the credential may
  already read.
  
  A subscription is a notification and never a system of record: an event produced while the client
  is disconnected is not replayed, and a client that must not miss one registers a webhook.
  """
  channelChanged(channelId: ID, action: String): Channel!

  """
  A stream of the platform's events, selected by name. One event is delivered per message, so a
  payload never merges unrelated facts. A subscription is a notification and never a system of
  record: an event produced while a client is disconnected is not replayed, and a client that must
  not miss one registers a webhook.
  """
  events(
    """
    The event names to receive, exactly as the platform names them (`order.placed`) or as a
    one-segment prefix pattern (`order.*`). At least one name is required, and a selection that
    matches no known event is refused at subscribe time so a typo is visible immediately.
    """
    names: [String!]!

    """
    Narrows the stream to one aggregate. It can only narrow what the credential may read.
    """
    aggregateId: ID

    """Narrows the stream to one channel of the credential's own scope."""
    channelId: ID
  ): EventEnvelope

  """
  Every change to a region of the caller's tenant: a creation, an edit, a default change, a
  retirement, or a country-set replacement. The stream is narrowed by `regionId` and by `action`;
  both only ever narrow what the credential may already read.
  
  A subscription is a notification and never a system of record: an event produced while the client
  is disconnected is not replayed, and a client that must not miss one registers a webhook.
  """
  regionChanged(regionId: ID, action: String): Region!
  collectionChanged(id: ID): Collection!
  productPublished(productId: ID, channelId: ID): ProductPublication!
  productUnpublished(productId: ID, channelId: ID): ProductPublication!
  stockLevelChanged(warehouseId: ID, variantId: ID): StockLevel!
  stockLevelLow(warehouseId: ID): StockLevel!
  stockLevelOutOfStock(warehouseId: ID): StockLevel!
  stockReservationChanged(referenceId: ID): StockReservation!
  stockTransferChanged(id: ID): StockTransfer!
  paymentAuthorized(organizationId: ID): PaymentSession!
  paymentCaptured(organizationId: ID): PaymentCapture!
  paymentFailed(organizationId: ID): PaymentSession!
  paymentCanceled(organizationId: ID): PaymentSession!
  paymentRefunded(organizationId: ID): Refund!
  refundCreated(organizationId: ID): Refund!

  """
  A promotion was created, activated or expired.
  
  The stream is the promotion domain's own event stream, so a subscriber sees exactly the facts
  the domain already publishes for its outbox rather than a second, transport-shaped copy of
  them. `promotionId` narrows the stream to one promotion; it can only narrow what the caller is
  already allowed to read.
  """
  promotionChanged(promotionId: ID): PromotionChangedPayload!

  """
  A campaign budget reached its ceiling and its promotions stopped being applied.
  """
  promotionBudgetExhausted(promotionId: ID, budgetId: ID): PromotionBudgetExhaustedPayload!

  """
  A code was redeemed, whether by a basket being checked out or by an order being placed.
  """
  couponRedeemed(couponId: ID): CouponRedeemedPayload!

  """Stored value was spent with a card."""
  giftCardRedeemed(giftCardId: ID): GiftCardRedeemedPayload!

  """Streams rights that were granted or changed."""
  entitlementChanged(entitlementId: ID): Entitlement!

  """Streams rights that had a slot taken."""
  entitlementActivated(entitlementId: ID): Entitlement!

  """Streams rights that were withdrawn."""
  entitlementRevoked(entitlementId: ID): Entitlement!
}

