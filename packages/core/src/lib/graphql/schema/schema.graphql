without one cannot be reached or signed into, and the role, the two name parts, the avatar URL and the
language are optional. There is no member for the tenant, which the service stamps from the credential
and overwrites whatever a body states, and none for the organization either — a user is a row of a
tenant and not of an organization; which organizations the account belongs to is the membership
resource's fact.
