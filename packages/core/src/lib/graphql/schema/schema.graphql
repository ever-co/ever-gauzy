"""
The fields a price row is created with.

A row either states its amount or says how to derive one, and either names the variant it prices or
is scoped by its own rules. Both pairs are deliberate: the first is what makes a price book one row
instead of a matrix, and the second is what makes one row able to price a category.
"""
input CreateProductPriceInput {
  organizationId: ID
  variantId: ID
  priceListId: ID
  currency: String!
  amount: Decimal
  computeMode: PriceComputeMode

  """Signed fraction of the base: 0.25 is 25 % off, -0.15 is a 15 % markup."""
  percent: Decimal
  baseSource: PriceBaseSource
  basePriceListId: ID
  roundTo: Decimal
  unitId: ID
  compareAtAmount: Decimal
  costAmount: Decimal
  minQuantity: Decimal
  maxQuantity: Decimal
  taxInclusive: Boolean
  minMarginPercent: Decimal
  maxDiscountPercent: Decimal
  status: PriceStatus
  startsAt: DateTime
  endsAt: DateTime
  metadata: JSON
}

"""
The fields a price row is updated with.

`variantId` is deliberately absent: a price's variant is part of its identity, and re-pointing a
tier at another variant would leave that variant's other bands knowing nothing about it. Delete
and re-create instead.
"""
input UpdateProductPriceInput {
  id: ID!
  priceListId: ID
  currency: String
  amount: Decimal
  computeMode: PriceComputeMode
  percent: Decimal
  baseSource: PriceBaseSource
  basePriceListId: ID
  roundTo: Decimal
  unitId: ID
  compareAtAmount: Decimal
  costAmount: Decimal
  minQuantity: Decimal
  maxQuantity: Decimal
  taxInclusive: Boolean
  minMarginPercent: Decimal
  maxDiscountPercent: Decimal
  status: PriceStatus
  startsAt: DateTime
  endsAt: DateTime
  metadata: JSON
}

