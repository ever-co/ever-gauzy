  """
  The id of the row `ownerType` names. No foreign key: the target table depends on the type.
  """
  ownerId: ID!

  """
  The buyer this address is scoped to, when it is a party's. Null on an anonymous cart address.
  """
  customerId: ID

  """
  Tenant extras, including the raw provider response once a validator has answered.
  """
  metadata: JSON
  createdAt: DateTime
  updatedAt: DateTime
}

"""What kind of thing a row of the address book belongs to."""
