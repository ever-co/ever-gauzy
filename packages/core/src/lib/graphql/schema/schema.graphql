"""
One catalogue entry: a capability the platform can describe and a tenant can switch.

The row is installation-wide — it has no tenant and no organization column — so the same entry is
answered to every tenant, and the members it carries are descriptive only. Whether the capability is
*served* is a `FeatureToggle` row, and that row is per tenant and per organization.

Deliberately absent, each for its own reason:

- `isEnabled` is a virtual column. Nothing persists it, the delivered list read does not populate it,
  and the delivered toggle write does not write it, so a member here would be `null` on every row this
  surface answers while appearing to be the answer. The enablement is `FeatureToggle.isEnabled`.
- `imageUrl` is a virtual column too, derived from `image` for the administration UI, and it is
  likewise not populated by the read this surface mirrors. `image` carries the file name.
- `parent`, `children` and `featureOrganizations` are relations. A REST caller loads them by naming
  them in `relations`; the GraphQL reads pass none, so the members would always be absent. The roots
  of the catalogue are reachable as `features(filter: { parentId: { isNull: true } })` — the delivered
  parent route stated as the filter it is — and the toggles of an entry as
  `featureToggles(filter: { featureId: { eq: … } })`.
- `deletedAt` is absent because no delivered route withdraws a catalogue entry: the reads answer live
  rows and nothing on this surface writes that column.
"""
type Feature {
  id: ID!

  """Human readable name, shown wherever features are listed."""
  name: String!

  """
  The feature code. Upper snake case, `FEATURE_` prefixed — the same text `FeatureToggle` rows and
  `FeatureFlagGuard` compare, and the text `FEATURE_GRAPHQL` gates this surface with.
  """
  code: String!

  """One line explaining what the flag enables."""
  description: String

  """
  Artwork file name, or null. The delivered catalogue ships no artwork for the commerce codes, so
  this is null on every entry introduced by the programme and set only on the ones it reuses.
  """
  image: String

  """
  Where an administrator is taken when the feature is selected. NOT NULL on the row.
  """
  link: String!

  """Presentation only: `info` / `primary` / `success` / `warning`."""
  status: String

  """Presentation only."""
  icon: String

  """
  Whether the capability is a paid one, which the catalogue marks for the administration UI.
  """
  isPaid: Boolean

  """The parent entry, for a catalogue that is a tree. Null on a root."""
  parentId: ID
  createdAt: DateTime
  updatedAt: DateTime
  isActive: Boolean
  isArchived: Boolean
}

"""
One tenant's answer for one catalogue entry, at one scope.

**The scope members are the whole point of this type**, so each is stated:

- `tenantId` — the tenant whose answer this is. It is stamped from the credential by the toggle write
  and is never stated by a caller, so a row cannot be written into another tenant's scope.
- `organizationId` — **the second, more specific scope**. `null` means the row is the tenant-wide
  answer, which is the row a toggle written without an organization produces and the row a tenant
  provisioned from scratch is given. Set, it is that one organization's answer. A resolution layers
  the two, most specific first, and falls back to the deployment's own configured state when neither
  exists — which is why a missing row is never an error.
- `featureId` — which catalogue entry is switched. The entry itself is reachable as
  `features(filter: { id: { eq: … } })`; the relation is not a member here for the reason the
  catalogue's own header states.

`isEnabled` is the answer: whether the capability is served for this scope.
"""
type FeatureToggle {
  id: ID!

  """The catalogue entry this row switches."""
  featureId: ID!

  """Whether the capability is served for this scope."""
  isEnabled: Boolean!

  """The tenant whose answer this row is."""
  tenantId: ID

  """
  The organization the row is scoped to, or null for the tenant-wide row. A tenant-wide row is the
  answer for every organization of the tenant that has no row of its own.
  """
  organizationId: ID
  createdAt: DateTime
  updatedAt: DateTime
  isActive: Boolean
  isArchived: Boolean
}

