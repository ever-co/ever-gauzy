type Mutation {
  assignAddressRole(input: CreateAddressRoleInput!): AddressRole!
  setAddressRoleDefault(addressId: ID!, role: AddressRoleEnum!, ownerAddressIds: [ID!]!): AddressRole!
  revokeAddressRole(addressId: ID!, role: AddressRoleEnum!): Boolean!

  """
  Records an address. A stated default is moved through the set-default operation rather than
  written, so the party's authoritative column, the address's mirror and the role row agree.
  """
  createAddress(input: CreateAddressInput!): Address!

  """
  Changes the descriptive facts of an address. A body that states a validation verdict is refused.
  """
  updateAddress(input: UpdateAddressInput!): Address!

  """
  Removes an address, softly, which is the only removal the book offers. An address the party names
  as its current default is refused: the default is moved first, which is one call.
  """
  deleteAddress(id: ID!): Address!

  """
  Makes an address the party's default for one role, or clears that default when `isDefault` is
  false. Setting it releases the flag from the sibling the party named before; clearing it is the
  one way to reach "this party has no default for this role" without contradicting the party's own
  column.
  """
  setDefaultAddress(input: SetDefaultAddressInput!): Address!

  """
  Attaches a hostname to a channel. The hostname is normalised before anything is read, and the
  channel's first host is made primary whatever the input says.
  """
  createChannelDomain(input: CreateChannelDomainInput!): ChannelDomain!

  """
  Changes the flags of a hostname that exists. Setting `isPrimary` moves the flag from the current
  primary — an update is the deliberate operation, so it does not have to be told twice.
  """
  updateChannelDomain(input: UpdateChannelDomainInput!): ChannelDomain!

  """
  Detaches a hostname. Refused for the channel's only host unless `force` is stated, because a
  channel no request can resolve to cannot serve (invariant I-25).
  """
  deleteChannelDomain(id: ID!, force: Boolean): ChannelDomain!

  """
  Answers whether a hostname reaches the channel it is bound to: the same resolution the request
  guard makes, which is the half of DNS/TLS readiness this platform can decide.
  """
  verifyChannelDomain(id: ID!): ChannelDomainVerification!

  """Opens a sales context. The channel is stored `DRAFT`."""
  createChannel(input: CreateChannelInput!): Channel!

  """
  Changes the descriptive facts of a channel. A body that states a `code` is refused.
  """
  updateChannel(input: UpdateChannelInput!): Channel!

  """
  Retires a channel: it keeps its rows and stops serving. The organization's default channel is
  refused, and a hard delete is not offered — the order side's reference is `RESTRICT`.
  """
  deleteChannel(id: ID!): Channel!

  """
  Claims the organization's default channel, releasing the flag from the previous holder.
  """
  setDefaultChannel(id: ID!): Channel!

  """
  Moves the channel along its lifecycle: `DRAFT → ACTIVE | ARCHIVED`, `ACTIVE ↔ INACTIVE`,
  `ARCHIVED` terminal. Reaching `ACTIVE` requires a hostname, because a channel no request can
  resolve to would be active in the database and unreachable in fact.
  """
  setChannelStatus(input: SetChannelStatusInput!): Channel!

  """
  Replaces the channel's region links. The operation is a set, and a member the channel still names
  as its default region cannot be left out.
  """
  replaceChannelRegions(input: ReplaceChannelRegionsInput!): [ChannelRegion!]!

  """
  Attaches a buyer to a company account. The account must be a company and must be live, the two sides
  must be different parties, and the buyer must not already belong to a live account.
  """
  createContactBuyer(input: CreateContactBuyerInput!): ContactBuyer!

  """
  Removes a membership, softly, which is the only removal path there is: an order placed by this buyer
  must remain attributable to the membership that authorised it.
  """
  deleteContactBuyer(id: ID!): ContactBuyer!

  """
  Records a party's login. The password is hashed by the platform's password hasher before the
  service is reached; a document that states a hash instead is refused by the schema, because the
  input type has no member for one.
  """
  createContactCredential(input: CreateContactCredentialInput!): ContactCredential!

  """
  Revokes a credential, which is the only removal path there is: the row is kept so that the sessions,
  the audit entries and the export archive that referenced it stay readable, and a party that
  registers again is attached to the same contact rather than duplicated.
  """
  revokeContactCredential(id: ID!): ContactCredential!

