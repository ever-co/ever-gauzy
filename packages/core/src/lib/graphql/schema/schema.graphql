  organizationId: ID
  attribute: PricePreferenceAttribute!

  """An ISO currency code, a region id or code, or a channel code."""
  value: String!
  isTaxInclusive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

