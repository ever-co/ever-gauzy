  """
  closeGoodsReceipt(id: ID!, reason: String): GoodsReceiptPayload!

  """
  Writes a term, which is the standing agreement a purchase line is priced from.
  """
  createVendorProductTerm(input: VendorProductTermInput!): VendorProductTermPayload!

  """Amends a term."""
  updateVendorProductTerm(id: ID!, input: VendorProductTermInput!): VendorProductTermPayload!

  """
  Writes several terms in one call, which is how a product-wide agreement is recorded.
  """
  bulkVendorProductTerms(input: BulkVendorProductTermInput!): VendorProductTermPayload!

  """Retires a term. One a placed order used is kept and moved to INACTIVE."""
  deleteVendorProductTerm(id: ID!): DeleteVendorProductTermPayload!

  """Grants a right. Idempotent on the order line or subscription it names."""
  grantEntitlement(input: GrantEntitlementInput!): GrantEntitlementPayload!

  """
  Withdraws a right, terminally. Its keys and its live activations go with it.
  """
  revokeEntitlement(id: ID!, reason: String!): EntitlementPayload!

  """Extends the term of a right, which is what a successful renewal does."""
  extendEntitlement(id: ID!, endsAt: DateTime!, quantity: Int): EntitlementPayload!

  """Occupies a slot of a right for a device or a named seat."""
  activateEntitlement(input: ActivateEntitlementInput!): ActivateEntitlementPayload!

  """Gives a slot back: released by the holder, or revoked by support."""
  deactivateEntitlement(id: ID!, reason: String, revoked: Boolean): DeactivateEntitlementPayload!

  """
  Issues a licence key. Its plaintext is returned once, in this response.
  """
  issueEntitlementKey(input: IssueEntitlementKeyInput!): IssueEntitlementKeyPayload!

  """Withdraws a credential, releasing the activations it was used for."""
  revokeEntitlementKey(id: ID!, reason: String!): EntitlementKeyPayload!

  """
  Submits a seller application for review. The seller becomes `SUBMITTED` and no further.
  """
  submitSeller(id: ID!): Seller!

  """Activates an approved seller. `ACTIVE` is never reached implicitly."""
  activateSeller(id: ID!): Seller!

  """
  Suspends a seller, with a reason the seller can read. Balances are held.
  """
  suspendSeller(id: ID!, reason: String!): Seller!

  """Returns a suspended seller to active."""
  reinstateSeller(id: ID!): Seller!

  """
  Publishes an offering to the given channels, materialising its authored price into a price row.
  """
  publishSellerOffering(id: ID!, channelIds: [String!]): SellerOffering!

  """Pauses an offering, so it stops being sellable and stays resumable."""
  pauseSellerOffering(id: ID!): SellerOffering!

  """Withdraws an offering; terminal."""
  withdrawSellerOffering(id: ID!): SellerOffering!

  """
  Advances a ledger row to settleable. The state is advanced, never the amount.
  """
  settleSellerTransaction(id: ID!, note: String): SellerTransaction!

  """Holds a ledger row out of payouts, with a reason a seller can read."""
  holdSellerTransaction(id: ID!, reason: String!): SellerTransaction!

  """
  Creates a payout from named ledger rows, or from the settleable rows of a period.
  """
  createSellerPayout(sellerId: ID!, currency: String!, transactionIds: [String!], note: String): SellerPayout!

  """
  Approves a payout. Approving is a separate permission from creating, because approving one moves money.
  """
  approveSellerPayout(id: ID!): SellerPayout!

  """Records the provider's execution of a payout, as reported."""
  markSellerPayoutPaid(id: ID!, providerKey: String, providerTransferId: String): SellerPayout!

  """Cancels an unpaid payout, returning its ledger rows to settleable."""
  cancelSellerPayout(id: ID!, reason: String!): SellerPayout!

  """
  Records a settlement reported by a provider, as reported: the ledger is never edited to agree with it.
  """
  createSellerSettlement(sellerId: ID!, providerKey: String!, currency: String!, grossAmount: String!, commissionAmount: String, feeAmount: String): SellerSettlement!

  """Re-weights or deactivates an index definition."""
  updateSearchIndexDefinition(id: ID!, input: SearchIndexDefinitionUpdateInput!): SearchIndexDefinitionPayload!

  """
  Removes a definition an operator authored; a shipped definition is refused.
  """
  deleteSearchIndexDefinition(id: ID!): DeleteSearchIndexDefinitionPayload!

  """Rebuilds one entity's index."""
  reindexEntity(entity: String!, input: SearchReindexInput): SearchReindexPayload!

  """Rebuilds every index, or every index of one channel."""
  reindexAll(input: SearchReindexInput): SearchReindexPayload!

  """Drops the index of an entity, or of one channel."""
  dropSearchIndex(entity: String, channelId: ID): DropSearchIndexPayload!
}

