# The employee level domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists
# once for the whole platform, so a domain adds fields to it and never declares its own.
#
# **No field here states a permission, and that is the parity rather than an omission.** The delivered
# controller carries `TenantPermissionGuard` on the class and no `@Permissions` anywhere — not on the
# two routes it declares and not on the seven it inherits from the CRUD base — so every one of its
# routes is tenant-guarded and otherwise unpermissioned. A field that demanded a permission would refuse
# a caller the REST route serves, which is the asymmetry the two-protocol rule forbids; tightening the
# resource is a change to make in both places at once, and it is not this delivery's to make.
#
# Every field below is one the delivered `/api/employee-level` routes already serve, under the same
# guard chain and with the same permission — none — so a client that reaches a capability over one
# protocol is not given a narrower or a wider one than the client that reaches it over the other.
#
# The list is a connection rather than a bare array. It takes the same query protocol the REST list
# route takes — the same filters in `filter`, the same keys in `sort`, the same page in `page` — and
# answers with the same shape the kernel's `PageInfo` gives every other connection, so a cursor
# obtained over one surface resumes on the other. `withDeleted` is deliberately absent: the delivered
# list method reads live rows only, and offering an argument that cannot be honoured would be worse
# than not offering it. The `relations` the REST list accepts are absent for the same reason: this
# read names none, so a `tags` argument here could not be honoured by it.
#
# The controller serves its list twice — `GET /` and `GET /pagination` — and the two answer the same
# rows under the same filters, one of them sliced by `take`/`skip` and the other not. That is one
# capability, so it is one root field: `employeeLevels`, mirroring `GET /`, which is the route whose
# whole filtered set the connection protocol is applied to. A second root field for the paginated
# spelling would be a second surface that could disagree with this one, and the connection's own
# `limit`/`offset` already are the page it performs.
#
# `employeeLevelCount` takes no filter, and that is a statement rather than an omission. The delivered
# count route passes its query string through as the store's own `where`, which the connection protocol
# does not speak; a `filter` argument here would either be handed to a service call that cannot accept
# it or be evaluated over a second code path that could disagree with the connection's `totalCount`.

extend type Query {
	"""
	The levels of the caller's tenant, newest first.
	"""
	employeeLevels(
		filter: EmployeeLevelFilter
		sort: [EmployeeLevelSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
		withDeleted: Boolean
	): EmployeeLevelConnection!

	"""
	One level of the caller's tenant, or null when there is none.
	"""
	employeeLevel(id: ID!): EmployeeLevel

	"""
	How many levels the caller's tenant records.

	Nullable by design: a count is an aggregate a resource may legitimately have no answer for, and a
	non-null field would turn "not answered" into a fabricated zero. The delivered count route binds its
	query string to the store's own `where`, a shape no schema can state, so the field offers no
	narrowing of its own rather than an argument the resolver could not pass on.
	"""
	employeeLevelCount: Int
}

extend type Mutation {
	"""
	Files a level for one organization.

	The tenant the new row belongs to is stamped from the credential and is never stated by the caller.
	"""
	createEmployeeLevel(input: CreateEmployeeLevelInput!): EmployeeLevel!

	"""
	Changes the label of a level that exists, or files it under another organization.

	**This is an upsert, not a replacement.** The delivered route hands the service the body with the
	path identifier beside it, and the service saves that row — loading the existing one first when the
	identifier names one. A member the caller leaves out is therefore left as it is, which is the
	opposite of the replacement semantics some other resources in this schema have; see
	`UpdateEmployeeLevelInput`.
	"""
	updateEmployeeLevel(input: UpdateEmployeeLevelInput!): EmployeeLevel!

	"""
	Removes a level outright. The answer says whether the removal happened rather than returning the
	removed row, because the delivered route answers the store's delete result.
	"""
	deleteEmployeeLevel(id: ID!): Boolean!

	"""
	Withdraws a level without removing it: the row keeps its identifier and the recovery below reads it
	back.
	"""
	softDeleteEmployeeLevel(id: ID!): EmployeeLevel!

	"""
	Puts a withdrawn level back, clearing the marker the withdrawal set.
	"""
	recoverEmployeeLevel(id: ID!): EmployeeLevel!
}
