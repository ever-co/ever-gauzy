# The recruiting domain's object types.
#
# A candidate is a **person** in a hiring pipeline, and the care the delivered account and contact
# surfaces take applies here for the same reason: the row the pipeline points at is one person's
# record, and a member that answered a value the read never produced would be read as "this person has
# no name" rather than as "this surface did not ask".
#
# **Nothing relation-shaped is a member.** Every delivered read of this domain — the list, the one-row
# read, the count — runs with no `relations` stated, so a member for `user`, `contact`, `source`,
# `employee`, `organizationPosition`, `tags`, `documents`, `educations`, `experience`, `skills`,
# `feedbacks`, `interview`, `organizationDepartments` or `organizationEmploymentTypes` would be absent
# on every row this surface answers. Each relation is carried as the identifier that always travels
# where the row has one (`userId`, `contactId`, `sourceId`, `employeeId`, `organizationPositionId`,
# `candidateId`, `interviewId`, `feedbackId`, `technologyId`, `personalQualityId`, `employeeId`), and
# the row behind an identifier is read from the surface that owns it: the account from `user(id)`, the
# interview from `candidateInterview(id)`, the employee from `employee(id)`.
#
# The two collections that have no identifier column at all are the pivots — the candidate's
# departments and employment types (`candidate_department`, `candidate_employment_type`) and its tags
# (`tag_candidate`). A pivot is joined only when a REST caller names the relation in its query string,
# which this surface's reads do not, so the candidates of a department and the tags of a candidate are
# read from the surfaces that own those rows rather than as a member here.
#
# **The two virtual columns are refused, and each for its own reason.** `ratings` is filled by the
# delivered subscriber out of the `feedbacks` collection, and this surface's reads join no feedbacks,
# so it would be absent on every row. `alreadyHired` is filled on every load, but by the TypeORM
# subscriber alone: an installation running the other ORM answers it as absent, and the value is in any
# case a function of two columns this type carries — `status` and `hiredDate` — so a member for it
# would be a second statement of the same fact that is wrong on one of the two stores.
#
# **Money is an exact decimal and never a binary fraction.** `rating`, `billRateValue` and
# `minimumBillingRate` are money or money-per-hour: they are carried as `Decimal` for the reason the
# kernel gives, because a binary fraction cannot hold a cent. The one rating that is *not* a decimal is
# the criterion's own — that column is an `integer` and its scale is stated as `Int`.
#
# `status` is carried as its value rather than declared as a schema enum: it is the contracts package's
# fixed value set (`APPLIED`, `HIRED`, `REJECTED`) rather than a vocabulary an operator maintains, and
# a second domain that needed the same set would collide with an enum declared here instead of reusing
# it.

# ---------------------------------------------------------------------------------------------
# The candidate: one person in one organization's pipeline
# ---------------------------------------------------------------------------------------------

"""
One person's candidacy with one organization: where they are in the pipeline, what they would be paid,
and which account, contact and employee row they are tied to.
"""
type Candidate {
	id: ID!
	"The rating filed on this row. A rating, and therefore an exact decimal."
	rating: Decimal
	"The instant the row is dated to, where an administration screen dates it."
	valueDate: DateTime
	"When the candidacy was filed with the organization."
	appliedDate: DateTime
	"When the candidate was hired. `status` is the pipeline move; this is when it happened."
	hiredDate: DateTime
	"When the candidate was declined."
	rejectDate: DateTime
	"""
	The pipeline state, as the contracts package's own value: `APPLIED`, `HIRED` or `REJECTED`. Written
	by the filing, by the two pipeline moves and by the delivered subscriber when a rejection date is
	stated.
	"""
	status: String
	"The level's label, as this row stores it. It is the candidate's own column and not the engagement's `employeeLevel`."
	candidateLevel: String
	"Recurring weekly limit, in hours. A whole number of hours rather than an amount."
	reWeeklyLimit: Int
	"The currency the two rates are stated in, as the contracts package's own `CurrenciesEnum` value."
	billRateCurrency: String
	"The billing rate per hour the candidate would be engaged at. Money, and therefore an exact decimal."
	minimumBillingRate: Decimal
	"How often the candidate would be paid, as the contracts package's own `PayPeriodEnum` value."
	payPeriod: String
	"The billing rate per hour the candidate is filed at. Money, and therefore an exact decimal."
	billRateValue: Decimal
	"The URL of the candidate's curriculum vitae, as filed."
	cvUrl: String
	"The account this candidacy belongs to. The account's own columns are read from `user(id)`; this surface carries the identifier alone because no delivered read of this domain selects an account column."
	userId: ID!
	"""
	The contact row the candidacy keeps its address and fiscal facts in, where it has one. A contact is
	shared — an employee and a customer point at the same row — so its columns are read from the contact
	surface and this member only says which row.
	"""
	contactId: ID
	"The organization position the candidate is being considered for, where one is recorded. The position is read from the position surface."
	organizationPositionId: ID
	"""
	The row describing where the candidate came from. A source is the *vocabulary* of origins — one row
	per origin, shared by every candidacy that came from it — so its name is read from `candidateSource(id)`
	and this member says which row.
	"""
	sourceId: ID
	"The engagement this candidacy became, once it was hired. The engagement is read from `employee(id)`."
	employeeId: ID
	tenantId: ID
	organizationId: ID
	isActive: Boolean
	isArchived: Boolean
	archivedAt: DateTime
	"""
	When the candidacy was withdrawn, or null while it is live. `DELETE /:id/soft` and `PUT /:id/recover`
	are delivered routes and this column is the whole of what they write, so without it a caller could
	not tell a live row from a withdrawn one on the answer to the write that withdrew it.
	"""
	deletedAt: DateTime
	createdAt: DateTime
	updatedAt: DateTime
}

"The boundary of one page of candidates."
type CandidateEdge {
	node: Candidate!
	cursor: String!
}

"One page of candidates, with the total the filters select and the boundary cursors."
type CandidateConnection {
	nodes: [Candidate!]!
	edges: [CandidateEdge!]!
	totalCount: Int!
	pageInfo: PageInfo!
}

"""
The fields a candidate list may be sorted by. Every member is a column the row always has.
"""
enum CandidateSortField {
	createdAt
	updatedAt
	appliedDate
	hiredDate
	rejectDate
	candidateLevel
	status
	rating
	billRateValue
}

"The order the candidates are returned in. At most three keys are accepted."
input CandidateSort {
	field: CandidateSortField!
	direction: SortDirection!
}

"""
The fields a candidate list may be narrowed by: exactly the columns the delivered read returns.

The account is deliberately not filterable, although the paginated spelling of the list narrows by the
account's name and address. That spelling does so with a join predicate the store evaluates, and the
rows the connection protocol narrows are the rows that came back — which carry no account column. A
filter here would be advertising a narrowing this surface cannot perform; the way to ask for one
person's candidacy is `userId`, and the way to narrow by a name is to read the account surface first.
"""
input CandidateFilter {
	id: IDFilter
	rating: DecimalFilter
	valueDate: DateTimeFilter
	appliedDate: DateTimeFilter
	hiredDate: DateTimeFilter
	rejectDate: DateTimeFilter
	status: StringFilter
	candidateLevel: StringFilter
	reWeeklyLimit: NumberFilter
	billRateCurrency: StringFilter
	billRateValue: DecimalFilter
	minimumBillingRate: DecimalFilter
	payPeriod: StringFilter
	cvUrl: StringFilter
	userId: IDFilter
	contactId: IDFilter
	organizationPositionId: IDFilter
	sourceId: IDFilter
	employeeId: IDFilter
	tenantId: IDFilter
	organizationId: IDFilter
	isActive: BooleanFilter
	isArchived: BooleanFilter
	archivedAt: DateTimeFilter
	deletedAt: DateTimeFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	and: [CandidateFilter!]
	or: [CandidateFilter!]
	not: CandidateFilter
}

"""
The account a candidacy signs in as.

**Only the four members the delivered write persists are here.** The delivered body's account also
carries a role and a preferred language, and the delivered handler overwrites both: it resolves the
candidate role itself, passes it beside the language of the request, and the handler behind that
resolves the relation from the database where the relation wins on persist. A stated role would
therefore be checked and then ignored — the only effect a caller could have with it is to be refused
for naming a role it may not assign, which is not a capability — and a stated language would be
overwritten by the language of the request. An argument whose effect is invisible is worse than an
argument that is absent, so neither is stated.

`password` is a plaintext member on the way in and is hashed before the account row is written; it is
never a member of an answer, because the answer is the row's projection and the projection carries no
digest.
"""
input CandidateUserInput {
	"The address the account is created with, and the address it signs in with."
	email: String!
	"The given name to file on the account."
	firstName: String
	"The family name to file on the account."
	lastName: String
	"The image to show for the account."
	imageUrl: String
}

"""
What a caller states when it files a candidacy.

**Only the members the delivered write persists are here.** The delivered create body inherits the
engagement's employment terms — `startedWorkOn`, `endWork`, `short_description`, `description`,
`anonymousBonus` and `employeeLevel` — and a candidate row has no column for any of them: the level
this row carries is `candidateLevel`, which the delivered create body does not accept. An argument
whose effect is invisible is worse than an argument that is absent, so none of the six is stated; the
level is written through `updateCandidate`, which is the route that carries it.

The collections the delivered body also accepts — the documents, the employment types and the
departments — are refused for the same reason at one remove: each is a collection of rows rather than
of identifiers, the delivered write cascades none of them, and the rows themselves are written through
the surface that owns them (`createCandidateDocument` for a document). The position and the tags are
the exception, because both are written from an identifier: `organizationPositionId` and `tagIds`.
"""
input CreateCandidateInput {
	"The organization the candidacy is filed under."
	organizationId: ID!
	"The account to file together with the candidacy. The delivered write always files one."
	user: CandidateUserInput!
	"The new account's password, hashed before the account row is written."
	password: String!
	"The organization position the candidate is being considered for."
	organizationPositionId: ID
	"The facets to attach to the candidate, as the identifiers the pivot is written from."
	tagIds: [ID!]
}

"""
What a caller states when it edits a candidacy.

Every member is optional and a member that is absent is left as it is, because the delivered edit
persists the stated members over the row it read.

The same discipline as the create applies to the members: `offerDate`, `acceptDate` and `isAway` are
accepted by the delivered body and are columns of an *engagement*, not of a candidacy, so they are not
stated here. `status` is not stated either: it is written by the two pipeline moves and by the
subscriber's own reading of `rejectDate`, and a member for it would be a second way to write the
pipeline that the delivered routes leave to those two.

The contact is stated as the identifier the relation is written from rather than as the row the
delivered body accepts. A contact is shared with the employee and customer surfaces, so its own columns
are written through the contact surface; this member moves the pointer and nothing else.
"""
input UpdateCandidateInput {
	id: ID!
	"The organization position the candidate is being considered for."
	organizationPositionId: ID
	"The facets to attach to the candidate, as the identifiers the pivot is written from."
	tagIds: [ID!]
	"The contact row the candidacy keeps its address and fiscal facts in."
	contactId: ID
	"When the candidacy was filed with the organization."
	appliedDate: DateTime
	"When the candidate was hired."
	hiredDate: DateTime
	"When the candidate was declined."
	rejectDate: DateTime
	"The label the pipeline shows for this candidate's seniority."
	candidateLevel: String
	"The URL of the candidate's curriculum vitae."
	cvUrl: String
	"The billing rate per hour the candidate is filed at. Money, and therefore an exact decimal."
	billRateValue: Decimal
	"The currency the two rates are stated in."
	billRateCurrency: String
	"The floor below which the candidate would not be engaged. A rate, and therefore an exact decimal."
	minimumBillingRate: Decimal
	"How often the candidate would be paid."
	payPeriod: String
	"Recurring weekly limit, in hours. A whole number of hours rather than an amount."
	reWeeklyLimit: Int
	"The candidate's LinkedIn profile."
	linkedInUrl: String
	"The candidate's Facebook profile."
	facebookUrl: String
	"The candidate's Instagram profile."
	instagramUrl: String
	"The candidate's Twitter profile."
	twitterUrl: String
	"The candidate's GitHub profile."
	githubUrl: String
	"The candidate's GitLab profile."
	gitlabUrl: String
	"The candidate's Upwork profile."
	upworkUrl: String
	"The candidate's Stack Overflow profile."
	stackoverflowUrl: String
	"The candidate's identifier at the external marketplace."
	upworkId: String
	"The candidate's identifier at LinkedIn."
	linkedInId: String
	"The external marketplace's public profile link."
	profile_link: String
}

"""
The two pipeline moves the delivered route serves.

The vocabulary is the controller's own — it reads the move out of its path — and it is declared as an
enum here rather than carried as a string because the delivered `switch` has no default branch: a move
it does not name answers nothing at all, so a schema that accepted any string would advertise a
capability that does not exist. The values are stated as the route spells them, so the two protocols
name the same move with the same word.
"""
enum CandidatePipelineAction {
	hired
	rejected
}

# ---------------------------------------------------------------------------------------------
# The candidacy's own facts: the documents, the studies, the work, the skills and the origin
# ---------------------------------------------------------------------------------------------

# These five are one shape repeated: a row that names one candidacy, that is read back by the same nine
# routes, and that is guarded by the same chain and the same two permissions. Each type below carries
# its own columns and nothing else, and each one's list is narrowed by `candidateId` — which is the
# column that makes the five readable as one person's file rather than as five vocabularies.

