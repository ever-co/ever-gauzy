	id: IDFilter
	name: StringFilter
	documentUrl: StringFilter
	candidateId: IDFilter
	tenantId: IDFilter
	organizationId: IDFilter
	isActive: BooleanFilter
	isArchived: BooleanFilter
	archivedAt: DateTimeFilter
	deletedAt: DateTimeFilter
	createdAt: DateTimeFilter
	updatedAt: DateTimeFilter
	and: [CandidateDocumentFilter!]
	or: [CandidateDocumentFilter!]
	not: CandidateDocumentFilter
}

"What a caller states when it files a document under a candidacy."
