type CandidateDocument {
	id: ID!
	"The document's name, as the caller filed it."
	name: String!
	"The URL the document is served from."
	documentUrl: String
	"The candidacy this document belongs to."
	candidateId: ID
	tenantId: ID
	organizationId: ID
	isActive: Boolean
	isArchived: Boolean
	archivedAt: DateTime
	deletedAt: DateTime
	createdAt: DateTime
	updatedAt: DateTime
}

"The boundary of one page of documents."
