# ---------------------------------------------------------------------------------------------
# The interview and the vocabulary it carries
# ---------------------------------------------------------------------------------------------

"""
One sitting of the pipeline's interview stage.

The row carries the schedule, the place, the note and the average the platform computed from the
feedbacks of the sitting. Its four collections — the feedbacks, the interviewers, the technologies and
the personal qualities — are each read back through this domain's own root fields filtered by
`interviewId`, which is the identifier this row is pointed at by.
"""
type CandidateInterview {
	id: ID!
	"The interview's title."
	title: String!
	"When the sitting begins."
	startTime: DateTime
	"When the sitting ends."
	endTime: DateTime
	"Where the sitting is held."
	location: String
	"The note the caller filed with the sitting."
	note: String
	"The average the platform computed from this sitting's feedbacks. A rating, and therefore an exact decimal."
	rating: Decimal
	"The candidacy this sitting belongs to."
	candidateId: ID
	tenantId: ID
	organizationId: ID
	isActive: Boolean
	isArchived: Boolean
	archivedAt: DateTime
	deletedAt: DateTime
	createdAt: DateTime
	updatedAt: DateTime
}

"The boundary of one page of interviews."
type CandidateInterviewEdge {
	node: CandidateInterview!
	cursor: String!
}

"One page of interviews, with the total the filters select and the boundary cursors."
