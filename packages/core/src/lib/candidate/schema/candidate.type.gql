"""
What a caller states when it edits a verdict.

`interviewId` is stated as well as `interviewerId`, and that is the one place in this domain where an
identifier is carried beside the relation it addresses. The delivered handler does not read the
feedback's own interview column when it edits a verdict: it reads the interview out of the nested panel
seat the REST body carries, and recomputes that sitting's average from the verdicts that remain. This
input states the same fact as the identifier the seating is written from, and the resolver hands the
handler the nested shape it reads, so the two protocols leave the sitting in the same state.
"""
input UpdateCandidateFeedbackInput {
	id: ID!
	candidateId: ID
	"The panel seat the verdict belongs to."
	interviewerId: ID
	"The sitting whose average the edit recomputes."
	interviewId: ID
	description: String
	rating: Decimal
	status: String
	organizationId: ID
}

