	"The candidacy the document belongs to."
	candidateId: ID
	"The document's name."
	name: String!
	"The URL the document is served from."
	documentUrl: String
	organizationId: ID
}

"What a caller states when it edits a document."
input UpdateCandidateDocumentInput {
	id: ID!
	"The candidacy the document belongs to."
	candidateId: ID
	"The document's name."
	name: String
	"The URL the document is served from."
	documentUrl: String
	organizationId: ID
}

