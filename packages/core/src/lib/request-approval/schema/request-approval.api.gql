# The request approval domain's root fields.
#
# `Query` and `Mutation` are declared by the kernel and extended here: a root operation type exists
# once for the whole platform, so a domain adds fields to it and never declares its own.
#
# The domain is served by `/api/request-approval`, whose controller extends the CRUD base: it declares
# six routes and inherits seven. Every one of them is mirrored below, and the parity is the
# controller's own rather than a uniform statement restated from memory:
#
# - **the class carries the guard chain.** `RequestApprovalController` states
#   `TenantPermissionGuard` and `PermissionGuard` on the class and on no route, so this resolver's
#   class carries the same two guards — and the capability gate beside them, which is this surface's
#   one addition;
# - **no permission is stated on the class, because the controller states none.** Each field then
#   states the permission its own route runs under, read from that route's own metadata: the view
#   permission on the register and on one employee's queue, the edit permission on the six writes that
#   state it, and nothing at all on the routes that declare none;
# - the inherited routes are the case that reads oddly. `GET /:id`, `GET /count`, `DELETE /:id`,
#   `DELETE /:id/soft` and `PUT /:id/recover` are served by the CRUD base without a permission of
#   their own, so each runs under the controller's class chain and no permission — and the five fields
#   that mirror them state none either. A permission there would refuse a caller the REST route serves,
#   and tightening the resource is a change to make in both places at once rather than here.
#
# **The by-employee read is a root field of its own rather than a filter on the connection.**
# `GET /employee/:id` is not the register narrowed to one person: the delivered read resolves the
# employee, walks that employee's own approval collection through `RequestApprovalEmployee` — a pivot
# the list read does not join — and then loads each request it finds with the policy, the employee
# approvals, the team approvals and the tags, none of which the list read loads either. A `filter` on
# an employee identifier over the register would answer a different set: the rows the caller raised,
# never the rows the caller has to answer. The two reads ask two different questions, so the surface
# states them as two fields.
#
# The register is a connection rather than a bare array. It takes the same query protocol the REST list
# route takes — the same filters in `filter`, the same keys in `sort`, the same page in `page` — and
# answers with the same shape the kernel's `PageInfo` gives every other connection, so a cursor
# obtained over one surface resumes on the other. `withDeleted` is deliberately absent: the delivered
# list method reads live rows only, and offering an argument that cannot be honoured would be worse
# than not offering it.
#
# The controller serves its list twice — `GET /` and `GET /pagination` — and the two answer the same
# rows under the same filters, one of them sliced by `take`/`skip` and the other not. That is one
# capability, so it is one root field: `requestApprovals`, mirroring `GET /`, which is the route that
# reads the whole filtered set the connection protocol is applied to. A second root field for the
# paginated spelling would be a second surface that could disagree with this one, and the connection's
# own `limit`/`offset` already are the page it performs.
#
# The count takes no filter, and that is a statement rather than an omission. The delivered count route
# passes its query string through as the store's own `where`, which the connection protocol does not
# speak; a `filter` argument here would either be handed to a service call that cannot accept it or be
# evaluated over a second code path that could disagree with the connection's `totalCount`. What it
# answers is the count of the caller's own rows, which is the call the route makes when it is given no
# options.

extend type Query {
	"""
	The approval requests of the caller's organization, newest first.

	The same service method the delivered list route calls, with the route's own defaults for an
	unstated request: the route binds its `data` envelope to `relations` and `findInput`, and this
	surface has no envelope to bind, so the read runs with neither — no joined collection and no
	criterion — and the connection protocol's `filter` is applied to the rows the service returns. The
	tenant and the organization are applied to the criterion by the service, from the credential rather
	than from the caller, so a filter naming another organization narrows to nothing rather than
	reading across organizations.
	"""
	requestApprovals(
		filter: RequestApprovalFilter
		sort: [RequestApprovalSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
	): RequestApprovalConnection!

	"""
	The requests one employee has to answer, newest first.

	**A field of its own rather than a filter on the register**, because the delivered read asks a
	different question: it resolves the employee, walks that employee's own approval collection through
	the pivot the list read does not join, and then loads each request it finds with the approval
	policy, the employee approvals, the team approvals and the tags — none of which the list read loads.
	The rows it answers are the requests the caller has raised, so the set is not the register narrowed
	by a column.

	The employee is named rather than assumed because the delivered route carries it in the path and
	reads the collection of that employee; a read of the caller's own queue is not what this route
	serves, and the service narrows the answer to the rows the caller created in the organization they
	are acting in.
	"""
	requestApprovalsByEmployee(
		employeeId: ID!
		filter: RequestApprovalFilter
		sort: [RequestApprovalSort!]
		page: PageInput
		first: Int
		after: String
		last: Int
		before: String
		limit: Int
		offset: Int
	): RequestApprovalConnection!

	"""
	One request, or null when there is none.

	**No permission is stated, and that is the parity rather than an omission.** The delivered
	`GET /:id` is inherited from the CRUD base without a permission of its own, so it runs under the
	controller's class chain and no permission; a permission here would be a scope the REST route does
	not have, and the asymmetry between reading one request and listing them is the controller's to
	resolve rather than this surface's to resolve on one protocol only.

	A request that is not there answers `null` rather than a refusal: GraphQL has one answer for "no
	such row" on a field that may have none, and the REST route's `404` is that same fact stated in the
	other protocol's vocabulary.
	"""
	requestApproval(id: ID!): RequestApproval

	"""
	How many requests the caller's organization records.

	Nullable by design: a count is an aggregate a resource may legitimately have no answer for, and a
	non-null field would turn "not answered" into a fabricated zero. The delivered count route binds its
	query string to the store's own `where`, a shape no schema can state, so the field offers no
	narrowing of its own rather than an argument the resolver could not pass on.
	"""
	requestApprovalCount: Int
}

extend type Mutation {
	"""
	Raises a request for approval.

	The same service method the delivered route calls, with the same body: the delivered create builds
	the row member by member, stamps the caller's tenant onto it and resolves the employees and teams
	the caller names into one pivot row each. The state the new request is in is the write's decision
	rather than the caller's, which is why no input states one.
	"""
	createRequestApproval(input: CreateRequestApprovalInput!): RequestApproval!

	"""
	Changes a request that exists.

	The same service method the delivered route calls, with the same two arguments: the identifier
	travels inside the input because the REST route carries it in the path, and the same body follows it.
	See `UpdateRequestApprovalInput` for which members the delivered write acts on — the two sets behave
	differently, and the edit returns every request it touches to the waiting state.
	"""
	updateRequestApproval(input: UpdateRequestApprovalInput!): RequestApproval!

	"""
	Approves one request.

	The same command the delivered route dispatches, carrying the same decision, and the delivered
	handler's answer is the row: it records the approval, and then moves the document the request is
	about — a time-off request or an equipment sharing — through the vocabulary that document's own
	status column speaks. Refusing a request a caller may not answer is the delivered service's own
	check, and this field lets that refusal through rather than restating it.
	"""
	approveRequestApproval(id: ID!): RequestApproval!

	"""
	Refuses one request.

	The same command the delivered route dispatches with the other decision, and the delivered handler's
	answer is the row. A refusal is a single approver's answer rather than a threshold's: the delivered
	writer sets the request to refused outright, which is what makes one refusal enough.
	"""
	refuseRequestApproval(id: ID!): RequestApproval!

	"""
	Removes a request outright.

	The answer says whether the removal happened rather than returning the removed row, because the
	delivered route answers the store's delete result. No permission is stated: the delivered
	`DELETE /:id` is inherited from the CRUD base without one of its own.
	"""
	deleteRequestApproval(id: ID!): Boolean!

	"""
	Withdraws a request without removing it: the row keeps its identifier and the recovery below reads
	it back. The answer is the withdrawn row, whose `deletedAt` is the whole of what the write set. No
	permission is stated, for the same reason the removal states none.
	"""
	softDeleteRequestApproval(id: ID!): RequestApproval!

	"""
	Puts a withdrawn request back, clearing the marker the withdrawal set.

	The tenant and organization the write runs under are read from the credential, because the delivered
	route validates its query string against the tenant-organization body the base controller applies.
	No permission is stated, for the same reason the removal states none.
	"""
	recoverRequestApproval(id: ID!): RequestApproval!
}
