<div [nbSpinner]="loading" nbSpinnerStatus="primary">
  @if (!loading) {
    <div>
      @if (errorMessage) {
        <div>
          <h1>{{ errorMessage }}</h1>
          @if (errorDetail) {
            <p class="confirm-email-detail">{{ errorDetail }}</p>
          }
        </div>
      }
      @if (successMessage) {
        <div>
          <h1>{{ successMessage }}</h1>
        </div>
      }
      <a nbButton status="primary" [routerLink]="continueLink">
        {{ (signedIn ? 'EMAIL_VERIFICATION.GO_TO_DASHBOARD' : 'EMAIL_VERIFICATION.GO_TO_LOGIN') | translate }}
      </a>
    </div>
  }
</div>
