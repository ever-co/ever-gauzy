<section class="section-wrapper">
	<div class="whats-new-wrapper">
		<h3 class="main-header">
			{{ 'CHANGELOG_MENU.HEADER' | translate }}
		</h3>
		@for (item of items$ | async; track item.id; let last = $last) {
			<ngx-changelog-entry class="on-gradient" [class.last]="last" [entry]="item" />
		}
	</div>
</section>
