<!--
	Record-side Documents panel (spec 00 §6.14 R-LNK-02). The whole panel disappears
	for a user without DOCS_READ or on an organization with FEATURE_DOCUMENTS off —
	the component decides, not the five host templates.

	The action gates are `*ngIf` over Store checks rather than `*ngxPermissionsOnly`:
	uploading needs DOCS_CREATE **and** DOCS_UPDATE (a document write followed by a
	link write), and `ngxPermissionsOnly` with a list is an OR — it would offer the
	button to someone who can only do half of it and leave the file unattached.

	`readonly` hosts (the invoice/estimate VIEW page) additionally drop the
	attach / upload / unlink affordances — open and download stay.
-->
<section *ngIf="shown" class="docs-links-panel" [attr.aria-labelledby]="'docs-links-panel-title-' + entityId">
	<header class="docs-links-panel-header">
		<div class="docs-links-panel-heading">
			<h6 class="docs-links-panel-title" [id]="'docs-links-panel-title-' + entityId">
				{{ 'DOCS.LINKS.PANEL_TITLE' | translate }}
			</h6>
			<span class="docs-links-panel-count" *ngIf="links.length">{{ links.length }}</span>
		</div>

		<div class="docs-links-panel-actions">
			<button
				*ngIf="!readonly && canLink"
				type="button"
				nbButton
				ghost
				status="basic"
				size="small"
				(click)="attachExisting()"
			>
				<nb-icon icon="link-2-outline"></nb-icon>
				{{ 'DOCS.LINKS.ATTACH_EXISTING' | translate }}
			</button>

			<ng-container *ngIf="!readonly && canUpload">
				<button
					type="button"
					nbButton
					outline
					status="basic"
					size="small"
					[disabled]="uploading"
					(click)="fileInput.click()"
				>
					<nb-icon icon="upload-outline"></nb-icon>
					{{ 'DOCS.LINKS.UPLOAD_NEW' | translate }}
				</button>
				<!--
					Visually hidden and driven entirely by the button above, so it carries an id and
					an explicit accessible name, and is taken out of the tab order: a focusable
					control the user cannot see is a keyboard trap, and the button is the real one.
				-->
				<input
					#fileInput
					id="docs-links-panel-file-input"
					type="file"
					tabindex="-1"
					class="docs-links-panel-file"
					[attr.aria-label]="'DOCS.LINKS.UPLOAD_NEW' | translate"
					[accept]="accept"
					(change)="uploadNew(fileInput)"
				/>
			</ng-container>
		</div>
	</header>

	<div class="docs-links-panel-body" [nbSpinner]="loading || uploading" nbSpinnerStatus="primary" nbSpinnerSize="small">
		<div class="docs-links-panel-error" *ngIf="loadError" role="alert">
			<nb-icon icon="alert-triangle-outline" status="danger"></nb-icon>
			<span>{{ 'DOCS.LINKS.PANEL_LOAD_ERROR' | translate }}</span>
			<button type="button" nbButton ghost status="basic" size="tiny" (click)="load()">
				{{ 'DOCS.ERRORS.GENERIC_RETRY' | translate }}
			</button>
		</div>

		<div class="docs-links-panel-empty" *ngIf="!loading && !loadError && !links.length">
			<span class="docs-links-icon" aria-hidden="true">
				<nb-icon icon="folder-outline"></nb-icon>
			</span>
			<span>{{ 'DOCS.LINKS.PANEL_EMPTY' | translate }}</span>
		</div>

		<ul class="docs-links-list" *ngIf="links.length">
			<li class="docs-links-row" *ngFor="let link of links; trackBy: trackByLink">
				<span class="docs-links-icon" aria-hidden="true">
					<nb-icon [icon]="iconOf(link)"></nb-icon>
				</span>

				<button type="button" class="docs-links-row-open" [title]="labelOf(link)" (click)="open(link)">
					{{ labelOf(link) }}
				</button>

				<span class="docs-links-row-meta" *ngIf="sizeOf(link)">{{ sizeOf(link) }}</span>

				<span class="docs-links-row-actions">
					<button
						*ngIf="isFile(link)"
						type="button"
						nbButton
						ghost
						status="basic"
						size="small"
						[attr.aria-label]="'DOCS.PREVIEW.DOWNLOAD' | translate"
						[nbTooltip]="'DOCS.PREVIEW.DOWNLOAD' | translate"
						(click)="download(link)"
					>
						<nb-icon icon="download-outline"></nb-icon>
					</button>
					<button
						*ngIf="!readonly && canLink"
						type="button"
						nbButton
						ghost
						status="basic"
						size="small"
						class="docs-links-row-remove"
						[attr.aria-label]="'DOCS.LINKS.REMOVE' | translate"
						[nbTooltip]="'DOCS.LINKS.REMOVE' | translate"
						(click)="unlink(link)"
					>
						<nb-icon icon="close-outline"></nb-icon>
					</button>
				</span>
			</li>
		</ul>
	</div>
</section>
