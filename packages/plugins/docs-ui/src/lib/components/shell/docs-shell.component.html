<div class="docs-shell">
	<aside
		class="docs-tree-column"
		[class.collapsed]="treeCollapsed"
		[attr.aria-label]="'DOCS.A11Y.TREE_LABEL' | translate"
	>
		<!-- Only the collapse toggle: the tree's own first heading ("All documents", a
		     button back to the root) already names the column, so a title here repeated it. -->
		<div class="docs-tree-column-header">
			<button
				nbButton
				ghost
				size="tiny"
				class="docs-tree-column-toggle"
				(click)="toggleTree()"
				[nbTooltip]="(treeCollapsed ? 'DOCS.TREE.EXPAND_SIDEBAR' : 'DOCS.TREE.COLLAPSE_SIDEBAR') | translate"
				[attr.aria-label]="
					(treeCollapsed ? 'DOCS.TREE.EXPAND_SIDEBAR' : 'DOCS.TREE.COLLAPSE_SIDEBAR') | translate
				"
			>
				<nb-icon [icon]="treeCollapsed ? 'chevron-right-outline' : 'chevron-left-outline'"></nb-icon>
			</button>
		</div>
		@if (!treeCollapsed) {
			<gz-docs-tree></gz-docs-tree>
		}
	</aside>

	<main class="docs-content">
		<router-outlet></router-outlet>
	</main>

	<!-- `<aside>` already exposes the implicit `complementary` role — no explicit role needed. -->
	@if (detailId$ | async; as detailId) {
		<aside class="docs-detail-column" [attr.aria-label]="'DOCS.A11Y.DETAIL_PANEL_LABEL' | translate">
			<gz-docs-detail-panel
				[documentId]="detailId"
				(closed)="onDetailClosed()"
				(changed)="onDetailChanged($event)"
				(deleted)="onDetailDeleted($event)"
				(openEditor)="onOpenEditor($event)"
				(openPreview)="onOpenPreview($event)"
			></gz-docs-detail-panel>
		</aside>
	}
</div>
