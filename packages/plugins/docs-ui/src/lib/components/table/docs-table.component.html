<div
	class="docs-table"
	[nbSpinner]="loading"
	nbSpinnerStatus="primary"
	nbSpinnerSize="large"
	(click)="onRowClick($event)"
	(keydown)="onRowKeydown($event)"
	(dblclick)="onRowDoubleClick($event)"
>
	<!-- Column chooser — header kebab, persisted to localStorage['gauzy_docs_columns'] -->
	<div class="docs-table-toolbar" *ngIf="!reviewMode">
		<!-- The tooltip sits on a wrapper, not on the button: `nbTooltip` and `nbPopover` each
		     provide `NbDynamicOverlay` on their host element, so on the same element they share one
		     overlay — the tooltip's config wins and the click only ever showed "Columns". -->
		<span class="docs-column-chooser-hint" [nbTooltip]="'DOCS.TABLE.COLUMN_CHOOSER' | translate">
			<button
				nbButton
				ghost
				size="tiny"
				class="docs-column-chooser-toggle"
				[nbPopover]="columnChooser"
				nbPopoverTrigger="click"
				nbPopoverPlacement="bottom"
				[attr.aria-label]="'DOCS.TABLE.COLUMN_CHOOSER' | translate"
			>
				<nb-icon icon="more-vertical-outline"></nb-icon>
			</button>
		</span>
	</div>

	<angular2-smart-table
		[settings]="settings"
		[source]="source"
		(userRowSelect)="onUserRowSelect($event)"
		style="cursor: pointer"
	></angular2-smart-table>
</div>

<ng-template #columnChooser>
	<div class="docs-column-chooser" role="group" [attr.aria-label]="'DOCS.TABLE.COLUMN_CHOOSER' | translate">
		<div class="docs-column-chooser-head">
			<span class="docs-column-chooser-title">{{ 'DOCS.TABLE.COLUMN_CHOOSER' | translate }}</span>
			<span class="docs-column-chooser-count">
				{{ 'DOCS.TABLE.COLUMNS_SHOWN' | translate : { visible: visibleColumnCount, total: totalColumnCount } }}
			</span>
		</div>

		<div class="docs-column-chooser-list">
			<!-- Always-on columns: listed so the count adds up, but not toggleable. -->
			<div
				class="docs-column-option locked"
				*ngFor="let column of requiredColumns"
				[title]="'DOCS.TABLE.COLUMN_ALWAYS_SHOWN' | translate"
			>
				<nb-icon class="docs-column-option-icon" [icon]="columnIcon(column)"></nb-icon>
				<span class="docs-column-option-text">
					<span class="docs-column-option-label">{{ columnTitleKey(column) | translate }}</span>
					<span class="docs-column-option-hint">{{ 'DOCS.TABLE.COLUMN_ALWAYS_SHOWN' | translate }}</span>
				</span>
				<nb-icon class="docs-column-option-lock" icon="lock-outline"></nb-icon>
			</div>

			<!-- The whole row is the switch: a bigger target than a bare checkbox. -->
			<button
				type="button"
				role="switch"
				class="docs-column-option"
				*ngFor="let column of selectableColumns"
				[class.on]="isColumnVisible(column)"
				[attr.aria-checked]="isColumnVisible(column)"
				(click)="toggleColumn(column, !isColumnVisible(column))"
			>
				<nb-icon class="docs-column-option-icon" [icon]="columnIcon(column)"></nb-icon>
				<span class="docs-column-option-text">
					<span class="docs-column-option-label">{{ columnTitleKey(column) | translate }}</span>
					<span class="docs-column-option-hint" *ngIf="isColumnAutoHidden(column)">
						{{ 'DOCS.TABLE.COLUMN_AUTO_HIDDEN' | translate }}
					</span>
				</span>
				<span class="docs-column-switch" aria-hidden="true"></span>
			</button>
		</div>

		<div class="docs-column-chooser-foot">
			<button type="button" class="docs-column-chooser-link" [disabled]="allColumnsVisible" (click)="showAllColumns()">
				{{ 'DOCS.TABLE.COLUMNS_SHOW_ALL' | translate }}
			</button>
			<button
				type="button"
				class="docs-column-chooser-link"
				[disabled]="!hasColumnPreferences"
				(click)="resetColumns()"
			>
				<nb-icon icon="refresh-outline"></nb-icon>
				{{ 'DOCS.TABLE.COLUMNS_RESET' | translate }}
			</button>
		</div>
	</div>
</ng-template>
