<!-- role=button + tabindex: the whole strip is one click/keyboard target whose
     accessible name is its visible copy (no aria-label override needed). -->
<div
	class="docs-drop-strip"
	role="button"
	tabindex="0"
	[class.docs-drop-strip--active]="active"
	(click)="browse.emit()"
	(keydown.enter)="browse.emit()"
	(keydown.space)="onSpace($any($event))"
>
	<nb-icon icon="cloud-upload-outline"></nb-icon>
	<div class="docs-drop-strip-copy">
		<span class="docs-drop-strip-title">{{ 'DOCS.UPLOAD.DROP_STRIP_TITLE' | translate }}</span>
		<!-- The formats/limits line is held to ONE line and truncates on a narrow
		     canvas, so the tooltip repeats it in full. Same expression on both
		     bindings on purpose — `translate` is a pure pipe, so the second call
		     costs nothing once the parameters are unchanged. -->
		<span
			class="docs-drop-strip-hint"
			[nbTooltip]="'DOCS.UPLOAD.DROP_STRIP_HINT' | translate: { formats: formats, max: maxFileSize, files: maxFiles }"
			nbTooltipStatus="basic"
			>{{
				'DOCS.UPLOAD.DROP_STRIP_HINT' | translate: { formats: formats, max: maxFileSize, files: maxFiles }
			}}</span
		>
	</div>
</div>
