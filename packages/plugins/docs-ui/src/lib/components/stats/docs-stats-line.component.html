@if (visible) {
	<div class="docs-stats-line" role="group" [attr.aria-label]="'DOCS.STATS.ARIA' | translate">
		@for (tile of tiles; track trackByLabel($index, tile)) {
			<span class="docs-stat">
				<span class="docs-stat-label">{{ tile.labelKey | translate }}</span>
				<span
					class="docs-stat-value"
					[style.color]="tile.color || null"
					[nbTooltip]="(tile.labelKey | translate) + ': ' + tile.value"
					nbTooltipStatus="basic"
					>{{ tile.value }}</span
				>
			</span>
		}
		@if (loading) {
			<nb-icon icon="loader-outline" class="docs-stats-spinner"></nb-icon>
		}
	</div>
}
