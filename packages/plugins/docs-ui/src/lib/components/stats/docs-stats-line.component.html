<!-- Overview strip — same pattern as the employee page's facts strip: a muted
     label over each figure, the cells divided by hairlines. -->
@if (visible) {
	<dl class="docs-facts" [attr.aria-label]="'DOCS.STATS.ARIA' | translate">
		@for (tile of tiles; track trackByLabel($index, tile)) {
			<div class="docs-fact">
				<dt>{{ tile.labelKey | translate }}</dt>
				<dd
					[style.color]="tile.color || null"
					[nbTooltip]="(tile.labelKey | translate) + ': ' + tile.value"
					nbTooltipStatus="basic"
				>
					{{ tile.value }}
				</dd>
			</div>
		}
		@if (loading) {
			<nb-icon icon="loader-outline" class="docs-stats-spinner"></nb-icon>
		}
	</dl>
}
