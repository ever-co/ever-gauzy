<div class="docs-browse" gzDocsUploadDropzone (filesDropped)="onFilesPicked($event)" (dragActiveChange)="onDropActiveChange($event)">
	<!-- Page-wide drop overlay -->
	<div class="docs-drop-overlay" *ngIf="dropActive">
		<nb-icon icon="cloud-upload-outline"></nb-icon>
		<span>{{ 'DOCS.UPLOAD.DROP_HINT' | translate }}</span>
	</div>

	<!-- Hidden multi file input -->
	<input
		#fileInput
		id="docs-browse-file-input"
		type="file"
		multiple
		hidden
		[accept]="uploadAccept"
		[attr.aria-label]="'DOCS.UPLOAD.BUTTON' | translate"
		(change)="onFilesPicked(fileInput.files)"
	/>

	<!-- Header -->
	<div class="docs-browse-header">
		<h4 class="docs-browse-title">{{ 'DOCS.TITLE' | translate }}</h4>
		<div class="docs-browse-actions">
			<ng-template [ngxPermissionsOnly]="docsPermissions.review">
				<button nbButton size="small" appearance="ghost" (click)="goToReviewQueue()">
					<nb-icon icon="checkmark-circle-outline"></nb-icon>
					{{ 'DOCS.REVIEW.QUEUE_TITLE' | translate }}
				</button>
			</ng-template>
			<!-- View toggle — persisted via ComponentEnum.DOCUMENTS_HUB.
			     `<fieldset>` is the semantic grouping element (implicit `group` role); the inline
			     rules only neutralize the user-agent fieldset chrome so the layout is unchanged. -->
			<fieldset
				class="docs-view-toggle"
				style="border: 0; padding: 0; margin-inline: 0; min-inline-size: 0"
				[attr.aria-label]="'DOCS.VIEWS.TOGGLE_LABEL' | translate"
			>
				<button
					nbButton
					size="small"
					[status]="isCardsView ? 'basic' : 'primary'"
					[appearance]="isCardsView ? 'outline' : 'filled'"
					[attr.aria-pressed]="!isCardsView"
					[nbTooltip]="'DOCS.VIEWS.TABLE' | translate"
					(click)="setLayout(layoutStyles.TABLE)"
				>
					<nb-icon icon="list-outline"></nb-icon>
				</button>
				<button
					nbButton
					size="small"
					[status]="isCardsView ? 'primary' : 'basic'"
					[appearance]="isCardsView ? 'filled' : 'outline'"
					[attr.aria-pressed]="isCardsView"
					[nbTooltip]="'DOCS.VIEWS.CARDS' | translate"
					(click)="setLayout(layoutStyles.CARDS_GRID)"
				>
					<nb-icon icon="grid-outline"></nb-icon>
				</button>
			</fieldset>
			<ng-template [ngxPermissionsOnly]="docsPermissions.create">
				<!-- `New ▾` (`01-ux-spec.md` §2): Folder | Page. A folder was previously
				     unreachable from here, so a brand-new organization — whose tree is empty and
				     whose only other create affordance is a node context menu that needs an
				     existing node — had no way to create its first folder at all. -->
				<button
					#newMenuTrigger
					nbButton
					size="small"
					appearance="outline"
					[nbContextMenu]="newMenu"
					[nbContextMenuTag]="newMenuTag"
					[attr.aria-label]="'DOCS.A11Y.NEW_MENU' | translate"
				>
					<nb-icon icon="plus-outline"></nb-icon>
					{{ 'DOCS.TREE.NEW' | translate }}
					<nb-icon icon="chevron-down-outline"></nb-icon>
				</button>
				<button nbButton size="small" status="primary" (click)="openUploadFlow()">
					<nb-icon icon="upload-outline"></nb-icon>
					{{ 'DOCS.UPLOAD.BUTTON' | translate }}
				</button>
			</ng-template>
		</div>
	</div>

	<!-- Location breadcrumb (`00-product-spec.md` §6.9 R-TRE-01 / `01-ux-spec.md` §2).
	     Page-level on purpose: it used to live inside `gz-docs-cards`, which meant it
	     vanished in the table layout (the default) and on an empty folder — both of
	     which render below the `rows.length` switch — leaving a drilled-in user with no
	     indication of where they were and no way back to the root.
	     Hidden in flat-results mode: a search drops the folder scope server-side, so a
	     path would misrepresent the rows (same rule the cards row applied). -->
	<nav
		class="docs-browse-breadcrumb"
		*ngIf="!isFlat(query.filter$ | async)"
		[attr.aria-label]="'DOCS.A11Y.BREADCRUMB' | translate"
	>
		<!-- The label is its own element on purpose: the button is a flex box (so its
		     content centres on the crumb's own height), and `text-overflow` never
		     applies to a flex container's anonymous text — it needs a real box. -->
		<button nbButton ghost size="tiny" [disabled]="!breadcrumb.length" (click)="onDrillIn(null)">
			<span class="docs-crumb-label">{{ 'DOCS.CARDS.BREADCRUMB_ROOT' | translate }}</span>
		</button>
		<ng-container *ngFor="let crumb of breadcrumb; let last = last">
			<nb-icon icon="chevron-right-outline" class="docs-crumb-sep"></nb-icon>
			<!-- A redacted ancestor keeps the depth of the path but never its name, and
			     is not navigable — the caller has no read access to it. -->
			<button
				nbButton
				ghost
				size="tiny"
				[disabled]="last || crumb.restricted || !crumb.id"
				[class.docs-crumb-restricted]="crumb.restricted"
				[nbTooltip]="crumb.restricted ? ('DOCS.BREADCRUMB.RESTRICTED' | translate) : crumb.name"
				(click)="onCrumbClick(crumb)"
			>
				<span class="docs-crumb-label">
					{{ crumb.restricted ? ('DOCS.BREADCRUMB.RESTRICTED' | translate) : crumb.name }}
				</span>
			</button>
		</ng-container>
	</nav>

	<!-- Stats tiles — org-global on purpose (the preset chips' counts are the
	     filter-relative numbers); hides itself when the endpoint is unavailable. -->
	<gz-docs-stats-line #statsLine></gz-docs-stats-line>

	<!-- Control band. The preset chips are no longer a sibling row here: they are
	     the coarsest filter on the page, so they render INSIDE the filter bar, on
	     its first row beside the search field. The wrapper is presentational only
	     — it is what makes the band read as one bordered surface. -->
	<div class="docs-browse-toolbar">
		<gz-docs-filter-bar
			[facets]="query.facets$ | async"
			[value]="query.filter$ | async"
			[urlParams]="urlParams"
			[presetCounts]="query.presetCounts$ | async"
			(filterChange)="onFilterChange($event)"
			(searchChange)="onSearchChange($event)"
			(clearAll)="onClearAll()"
			(applyView)="onApplySavedView($event)"
			(presetToggled)="onPresetToggled($event)"
		></gz-docs-filter-bar>
	</div>

	<!-- Always-visible drop strip. VISUAL-ONLY: the page-root gzDocsUploadDropzone
	     owns every drop (a second directive instance would double-fire); the strip
	     mirrors its drag state and clicks through to the same upload flow. -->
	<ng-template [ngxPermissionsOnly]="docsPermissions.create">
		<gz-docs-drop-strip
			[active]="dropActive"
			[maxFileSizeBytes]="uploadQueue.maxFileSizeBytes"
			[maxFiles]="uploadQueue.maxFilesPerUpload"
			[accept]="uploadAccept"
			(browse)="openUploadFlow()"
		></gz-docs-drop-strip>
	</ng-template>

	<!-- Upload progress -->
	<gz-docs-upload-progress
		[items]="uploadQueue.items$ | async"
		(retry)="uploadQueue.retry($event)"
		(dismiss)="uploadQueue.dismiss($event)"
		(clearFinished)="uploadQueue.clearFinished()"
	></gz-docs-upload-progress>

	<!-- Content -->
	<ng-container *ngIf="query.rows$ | async as rows">
		<ng-container *ngIf="rows.length; else emptyState">
			<!-- Cards view -->
			<gz-docs-cards
				*ngIf="isCardsView; else tableView"
				[rows]="rows"
				[totalCount]="(query.totalCount$ | async) || 0"
				[loading]="(query.loading$ | async) === true"
				[flat]="isFlat(query.filter$ | async)"
				[activeId]="query.detailId$ | async"
				(open)="onRowClicked($event)"
				(preview)="openPreview($event)"
				(openEditor)="openEditor($event)"
				(drillIn)="onDrillIn($event)"
				(loadMore)="onLoadMore()"
			></gz-docs-cards>

			<!-- Table view -->
			<ng-template #tableView>
				<gz-docs-table
					[rows]="rows"
					[loading]="(query.loading$ | async) === true"
					[selectable]="canManage"
					(rowClicked)="onRowClicked($event)"
					(folderOpened)="onFolderOpened($event)"
					(selectionChanged)="onSelectionChanged($event)"
					(sortChanged)="onSortChanged($event)"
					(retryRequested)="onRetryRequested($event)"
					(previewRequested)="openPreview($event)"
					(editorRequested)="openEditor($event)"
				></gz-docs-table>

				<div class="pagination-container">
					<ga-pagination
						[totalItems]="pagination?.totalItems"
						[activePage]="pagination?.activePage"
						[itemsPerPage]="pagination?.itemsPerPage"
						[doEmit]="false"
						(selectedOption)="onUpdateOption($event)"
						(selectedPage)="onPageChange($event)"
					></ga-pagination>
				</div>
			</ng-template>
		</ng-container>

		<ng-template #emptyState>
			<div [nbSpinner]="(query.loading$ | async) === true" nbSpinnerStatus="primary" class="docs-empty-host">
				<gz-docs-empty-state
					*ngIf="(query.loading$ | async) !== true"
					[variant]="emptyVariant(rows, (query.error$ | async) === true)"
					(primaryAction)="onEmptyAction($event)"
				></gz-docs-empty-state>
			</div>
		</ng-template>
	</ng-container>

	<!-- Bulk bar -->
	<gz-docs-bulk-bar
		[selectedIds]="(query.selection$ | async) || []"
		(completed)="onBulkCompleted($event)"
		(cleared)="onClearSelection()"
	></gz-docs-bulk-bar>
</div>
