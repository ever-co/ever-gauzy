<div class="pick-page">
  <nb-card class="pick-card" [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerSize="large">
    <nb-card-header class="pick-header">
      <ngx-back-navigation></ngx-back-navigation>
      <div class="heading">
        <h5 class="title">{{ 'APPOINTMENTS_PAGE.SELECT_EMPLOYEE' | translate }}</h5>
        <p class="subtitle">{{ 'PUBLIC_APPOINTMENTS.SELECT_EMPLOYEE_HINT' | translate }}</p>
      </div>
    </nb-card-header>
    <nb-card-body class="pick-body">
      @if (organization$ | async; as organization) {
        <div class="organization">
          <nb-icon icon="calendar-outline"></nb-icon>
          <span>{{ 'PUBLIC_APPOINTMENTS.BOOK_APPOINTMENTS' | translate }} · {{ organization.name }}</span>
        </div>

        <div class="form-group">
          <span class="label">{{ 'APPOINTMENTS_PAGE.EMPLOYEE' | translate }}</span>
          <ga-employee-selector
            #employeeSelector
            class="employees"
            [ariaLabel]="'APPOINTMENTS_PAGE.EMPLOYEE' | translate"
            [skipGlobalChange]="true"
            [addTag]="false"
          ></ga-employee-selector>
        </div>
      }
    </nb-card-body>
    <nb-card-footer class="pick-footer">
      <button
        type="button"
        class="book-button"
        nbButton
        fullWidth
        status="primary"
        size="small"
        [disabled]="!organization"
        (click)="bookPublicEmployeeAppointment()"
      >
        {{ 'PUBLIC_APPOINTMENTS.BOOK_APPOINTMENT' | translate }}
        <nb-icon icon="arrow-forward-outline"></nb-icon>
      </button>
    </nb-card-footer>
  </nb-card>
</div>
