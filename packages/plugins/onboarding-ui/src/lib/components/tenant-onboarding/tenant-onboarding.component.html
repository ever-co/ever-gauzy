<gauzy-switch-theme class="switch-theme" [hasText]="false"></gauzy-switch-theme>

<div class="logo">
	<ngx-gauzy-logo [isAccordion]="false"></ngx-gauzy-logo>
	{{ 'ONBOARDING.FIRST_ORGANIZATION' | translate }}
</div>

<!-- Registering signs people in straight away; this is the first page they see, so say here that a
     verification email is on its way (with a Resend), not only later on the dashboard. -->
<ngx-email-verification-notice class="verification-notice"></ngx-email-verification-notice>

<ga-organizations-step-form
	class="step-form"
	[loading]="loading"
	[isOnboarding]="true"
	(createOrganization)="onboardUser($event)"
></ga-organizations-step-form>
