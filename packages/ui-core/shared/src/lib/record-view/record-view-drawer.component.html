@if (open) {
	<div class="record-drawer-backdrop" (click)="close()"></div>
}

<aside
	class="record-drawer"
	[class.is-open]="open"
	[class.is-wide]="wide"
	role="dialog"
	aria-modal="true"
	[attr.aria-hidden]="open ? null : 'true'"
	[attr.aria-label]="heading | translate"
>
	<header class="record-drawer-header">
		<div class="record-drawer-heading">
			<h6 class="record-drawer-title">{{ heading | translate }}</h6>
			@if (subtitle) {
				<span class="record-drawer-subtitle">{{ subtitle }}</span>
			}
		</div>
		<div class="record-drawer-actions">
			<!-- The record's own full-width page: a real link, so it can also be opened in a new tab or copied. -->
			@if (fullViewLink) {
				<a
					nbButton
					ghost
					size="small"
					class="record-drawer-expand"
					[class.has-label]="!!fullViewLabel"
					[routerLink]="fullViewLink"
					[attr.aria-label]="(fullViewLabel || 'BUTTONS.EXPAND_FULL_WIDTH') | translate"
					[nbTooltip]="'BUTTONS.EXPAND_FULL_WIDTH' | translate"
					nbTooltipPlacement="bottom"
				>
					<nb-icon icon="expand-outline"></nb-icon>
					@if (fullViewLabel) {
						<span>{{ fullViewLabel | translate }}</span>
					}
				</a>
			}
			<button
				nbButton
				ghost
				size="small"
				class="record-drawer-close"
				(click)="close()"
				[attr.aria-label]="'BUTTONS.CLOSE' | translate"
			>
				<nb-icon icon="close-outline"></nb-icon>
			</button>
		</div>
	</header>
	<div class="record-drawer-body">
		<ng-content></ng-content>
	</div>
</aside>
