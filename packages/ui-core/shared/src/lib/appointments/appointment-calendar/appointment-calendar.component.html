<nb-card>
	@if (showHeader) {
		<nb-card-header>
			<ng-container [ngTemplateOutlet]="headerTemplate"></ng-container>
		</nb-card-header>
	}
	<nb-card-body>
		<div class="calendar-container">
			<full-calendar #calendar [options]="calendarOptions"></full-calendar>
		</div>
	</nb-card-body>
</nb-card>

<ng-template #headerTemplate>
	<div class="main-header">
		<h4>
			<ngx-header-title>{{ 'MENU.APPOINTMENTS' | translate }}</ngx-header-title>
		</h4>
		<div class="header-actions">
			<div class="timezone-info">
				<span class="timezone-label">{{ 'PUBLIC_APPOINTMENTS.TIMEZONE' | translate }}</span>
				<strong>{{ selectedTimeZoneName }} {{ selectedTimeZoneOffset }}</strong>
				<button
					type="button"
					class="timezone-change"
					nbButton
					outline
					status="basic"
					size="small"
					(click)="selectTimezone()"
				>
					<nb-icon icon="globe-2-outline"></nb-icon>
					{{ 'PUBLIC_APPOINTMENTS.CHANGE_TIMEZONE' | translate }}
				</button>
			</div>
			<button
				status="info"
				size="small"
				outline
				nbButton
				type="button"
				[routerLink]="'/pages/employees/schedules/recurring-availability'"
			>
				{{ 'BUTTONS.SCHEDULES' | translate }}
			</button>
			<ng-template ngxPermissionsOnly="EVENT_TYPES_VIEW">
				<button
					status="warning"
					size="small"
					outline
					nbButton
					type="button"
					(click)="openEventTypes()"
				>
					{{ 'BUTTONS.EVENT_TYPES' | translate }}
				</button>
			</ng-template>
			<button
				status="primary"
				size="small"
				outline
				nbButton
				type="button"
				(click)="bookPublicAppointment()"
			>
				{{ 'BUTTONS.PUBLIC_APPOINTMENT_BOOK' | translate }}
			</button>
		</div>
	</div>
</ng-template>
