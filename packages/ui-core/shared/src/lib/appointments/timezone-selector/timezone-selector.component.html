<nb-card class="timezone-dialog">
	<nb-card-header class="dialog-header">
		<div class="heading">
			<h5 class="title">{{ 'POP_UPS.SELECT_TIMEZONE' | translate }}</h5>
			<p class="subtitle">{{ 'POP_UPS.SELECT_TIMEZONE_HINT' | translate }}</p>
		</div>
		<button
			type="button"
			class="close"
			nbButton
			ghost
			size="small"
			status="basic"
			[attr.aria-label]="'BUTTONS.CLOSE' | translate"
			(click)="close()"
		>
			<nb-icon icon="close-outline"></nb-icon>
		</button>
	</nb-card-header>
	<nb-card-body class="dialog-body">
		<label class="label" for="timezone">{{ 'FORM.PLACEHOLDERS.CHOOSE_TIME_ZONE' | translate }}</label>
		<ng-select
			labelForId="timezone"
			class="timezone-select"
			[items]="listOfZones"
			[placeholder]="'FORM.PLACEHOLDERS.CHOOSE_TIME_ZONE' | translate"
			[(ngModel)]="selectedTimezone"
			[searchable]="true"
			[searchFn]="searchZone"
			[clearable]="false"
			appendTo="body"
		>
			<ng-template ng-option-tmp let-item="item">
				<div class="zone-option">
					<span class="zone-city">{{ getCity(item) }}</span>
					<span class="zone-region">{{ getRegion(item) }}</span>
					<span class="zone-offset">{{ getOffset(item) }}</span>
				</div>
			</ng-template>
			<ng-template ng-label-tmp let-item="item">
				<div class="zone-option">
					<span class="zone-city">{{ getCity(item) }}</span>
					<span class="zone-region">{{ getRegion(item) }}</span>
					<span class="zone-offset">{{ getOffset(item) }}</span>
				</div>
			</ng-template>
		</ng-select>
	</nb-card-body>
	<nb-card-footer class="dialog-footer">
		<button type="button" nbButton ghost status="basic" size="small" (click)="close()">
			{{ 'BUTTONS.CANCEL' | translate }}
		</button>
		<button type="button" nbButton status="primary" size="small" [disabled]="!selectedTimezone" (click)="select()">
			{{ 'BUTTONS.SAVE' | translate }}
		</button>
	</nb-card-footer>
</nb-card>
