<ga-teams-widget-state
	[loading]="loading()"
	[error]="error()"
	[empty]="assigned().length === 0"
	[skeletonRows]="4"
	emptyMessageKey="DASHBOARD_PAGE.BUILDER.WIDGETS.PROJECT_MANAGEMENT.RECENTLY_ASSIGNED.EMPTY"
	(retry)="refresh()"
>
	<div class="pm-panel">
		<div class="pm-list">
			@for (task of assigned(); track task.id) {
				<div class="pm-row assigned-row">
					<div class="pm-title" [title]="task.title">{{ task.title }}</div>
					<ga-only-tags [rowData]="task"></ga-only-tags>
				</div>
			}
		</div>
	</div>
</ga-teams-widget-state>
