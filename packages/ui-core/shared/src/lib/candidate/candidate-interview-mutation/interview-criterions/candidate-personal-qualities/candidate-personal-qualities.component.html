<ga-candidate-criterion-card
	icon="person-outline"
	heading="CANDIDATES_PAGE.CRITERIONS.PERSONAL_QUALITIES"
	placeholder="FORM.PLACEHOLDERS.ADD_CANDIDATE_QUALITY"
	emptyText="CANDIDATES_PAGE.CRITERIONS.PERSONAL_QUALITIES_PLACEHOLDER"
	[group]="form ? qualities?.at(0) : null"
	[items]="personalQualitiesList"
	[existedNames]="existedQualNames"
	(save)="save()"
	(editItem)="edit($event.index, $event.id)"
	(removeItem)="remove($event)"
></ga-candidate-criterion-card>
