<!-- NbRouteTabset for the nb tabset -->
@if (isRouterTabset) {
	<nb-route-tabset [tabs]="tabs"></nb-route-tabset>
} @else {
	<!-- Static tabs for the nb tabset -->
	<nb-tabset>
		@for (tab of tabs; track tab.tabId ?? $index; let i = $index) {
			<nb-tab
				[tabTitle]="$safeNavigationMigration(tab?.title)"
				[tabIcon]="$safeNavigationMigration(tab?.icon)"
				[tabId]="$safeNavigationMigration(tab?.tabId)"
				[active]="$safeNavigationMigration(tab?.active)"
				[disabled]="$safeNavigationMigration(tab?.disabled)"
				[responsive]="$safeNavigationMigration(tab?.responsive)"
				[route]="$safeNavigationMigration(tab?.route)"
			>
				<!-- Placeholder for dynamic content -->
				<ng-container #tabContent></ng-container>
			</nb-tab>
		}
	</nb-tabset>
}
