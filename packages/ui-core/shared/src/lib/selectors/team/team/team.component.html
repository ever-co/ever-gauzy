@if (label) {
	<label class="label">{{ label | translate }}</label>
}

<!-- Single Select -->
@if (!multiple) {
	<!-- `class` is STATIC on purpose: ng-select copies the trigger's class ATTRIBUTE
	     (read once, at construction) onto the panel it appends to <body>, and that
	     class is the only handle a stylesheet has on that panel. See the
	     `.gauzy-entity-select` block in `styles/_overrides.scss`. -->
	<ng-select
		#select
		class="gauzy-entity-select"
		[addTag]="(hasAddTeam$ | async) ? createNew : null"
		[multiple]="false"
		[clearable]="isClearable()"
		[disabled]="disabled"
		[items]="teams"
		[(ngModel)]="organizationTeamId"
		[placeholder]="placeholder || 'FORM.PLACEHOLDERS.ALL_TEAMS' | translate"
		[addTagText]="'FORM.PLACEHOLDERS.ADD_TEAM' | translate"
		bindValue="id"
		bindLabel="name"
		appendTo="body"
		fullWidth
		(change)="selectTeam($event); select.blur()"
		(clear)="clearSelection(); select.blur()"
	>
		@if (shortened) {
			<ng-template ng-option-tmp let-item="item">
				@if (item.logo) {
					<img [src]="item.logo" width="20" height="20" alt="" />
				}
				<!-- No `ml-1`: the option row is a flex row now and its `gap` owns the
				     spacing, so a margin here would only ever indent the teams that
				     happen to carry a logo. -->
<!-- No `title` here: an appended panel is `max-width: max-content` (see
				     `_overrides.scss`), so an option row is never narrower than its own
				     label and can never be truncated — a tooltip could only ever repeat
				     text that is already fully on screen. -->
				<span>{{ item.name }}</span>
			</ng-template>
			<ng-template ng-label-tmp let-item="item">
				<div class="selector-template" [title]="item?.name">
					@if (item.logo) {
						<img [src]="item.logo" width="20" height="20" alt="" />
					}
					<!-- No `ml-1`: `.selector-template` is a flex row and its `gap` owns the
					     spacing, so the utility class only ever shifted a logo-less team
					     name 4px to the right of the "All Teams" placeholder it replaces.
					     Matches the project/employee/organization label templates. -->
					<span>{{ getShortenedName(item?.name) }}</span>
				</div>
			</ng-template>
		}
	</ng-select>
} @else {
	<nb-select
		class="multiple-select"
		[disabled]="disabled"
		[multiple]="true"
		[(selected)]="organizationTeamId"
		[placeholder]="placeholder || 'FORM.PLACEHOLDERS.ALL_TEAMS' | translate"
		fullWidth
	>
		@for (team of teams; track team) {
			<nb-option [value]="team.id">
				{{ team.name }}
			</nb-option>
		}
	</nb-select>
}

<!-- Multiple Select -->
