<div class="row col-auto">
	<div class="filter-input">
		<div class="custom-input" (click)="openDatepicker($event)" (keydown)="onControlKeydown($event)">
			@if (arrows) {
			<button size="tiny" nbButton status="primary" outline (click)="previousRange()">
				<nb-icon icon="arrow-ios-back-outline"></nb-icon>
			</button>
			<button size="tiny" nbButton [disabled]="isNextDisabled()" status="primary" outline (click)="nextRange()">
				<nb-icon icon="arrow-ios-forward-outline"></nb-icon>
			</button>
			}
			<!-- A native button so the picker opens from the keyboard too (Enter/Space); the library
				 only opens on a pointer click of its <input>. -->
			<button
				type="button"
				class="calendar-trigger"
				[attr.aria-label]="'HEADER.SELECT_A_DATE' | translate"
				(click)="openDatepicker($event)"
			>
				<i class="far fa-calendar" aria-hidden="true"></i>
			</button>
			<input
				nbInput
				name="date-range"
				size="small"
				type="text"
				ngxDaterangepickerMd
				[opens]="opens"
				[singleDatePicker]="isSingleDatePicker"
				[autoApply]="true"
				[showCustomRangeLabel]="!isLockDatePicker"
				[alwaysShowCalendars]="true"
				[customRangeDirection]="false"
				[linkedCalendars]="true"
				[maxDate]="maxDate"
				[minDate]="minDate"
				[ranges]="ranges"
				[locale]="locale"
				[(ngModel)]="selectedDateRange"
				(datesUpdated)="onDatesUpdated($event)"
				(rangeClicked)="rangeClicked($event)"
				[class.single-range]="isSingleDatePicker"
				[class.double-range]="!isSingleDatePicker"
			/>
		</div>
	</div>
</div>
