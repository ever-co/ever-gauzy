<button
	#trigger
	#appsPopover="nbPopover"
	type="button"
	class="app-switcher-trigger"
	[class.open]="isPanelShown"
	[nbPopover]="appsPanel"
	nbPopoverTrigger="noop"
	[nbPopoverPlacement]="placement"
	[nbPopoverOffset]="6"
	nbPopoverClass="gz-app-switcher-popover"
	(nbPopoverShowStateChange)="onPanelShowStateChange($event.isShown)"
	(click)="onTriggerClick()"
	(pointerenter)="onPointerEnter($event)"
	(pointerleave)="onPointerLeave($event)"
	[attr.aria-expanded]="isPanelShown"
	[attr.aria-label]="'HEADER.SWITCH_EVER_APP' | translate"
>
	<svg class="app-switcher-mark" viewBox="0 0 40 42" fill="none" aria-hidden="true" focusable="false">
		<path fill-rule="evenodd" clip-rule="evenodd" [attr.d]="markPath" [attr.fill]="markGradientFill" />
		<defs>
			<linearGradient
				[attr.id]="markGradientId"
				x1="0.807"
				y1="7.049"
				x2="40.615"
				y2="7.783"
				gradientUnits="userSpaceOnUse"
			>
				<stop stop-color="#FF1CF7" />
				<stop offset="1" stop-color="#00F0FF" />
			</linearGradient>
		</defs>
	</svg>
</button>

<ng-template #appsPanel>
	<nav
		class="app-switcher-panel"
		[id]="panelId"
		[attr.aria-label]="'HEADER.EVER_APPS' | translate"
		(keydown)="onPanelKeydown($event)"
		(pointerenter)="onPointerEnter($event)"
		(pointerleave)="onPointerLeave($event)"
	>
		<div class="app-switcher-label" aria-hidden="true">{{ 'HEADER.EVER_APPS' | translate }}</div>
		<ul class="app-switcher-list">
			@for (app of apps; track app.id) {
				<li>
					@if (isCurrent(app)) {
						<div class="app-row current" aria-current="page">
							<img class="app-tile" [src]="app.logo" alt="" width="28" height="28" draggable="false" />
							<span class="app-text">
								<span class="app-name">{{ app.shortName }}</span>
								<span class="app-domain">{{ app.domain }}</span>
							</span>
							<svg
								class="app-current-check"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
								aria-hidden="true"
								focusable="false"
							>
								<path d="M20 6 9 17l-5-5" />
							</svg>
						</div>
					} @else {
						<a
							class="app-row"
							[href]="app.url"
							target="_blank"
							rel="noopener noreferrer"
							(click)="onAppPick($event, app)"
						>
							<img class="app-tile" [src]="app.logo" alt="" width="28" height="28" draggable="false" />
							<span class="app-text">
								<span class="app-name">{{ app.shortName }}</span>
								<span class="app-domain">{{ app.domain }}</span>
							</span>
						</a>
					}
				</li>
			}
		</ul>
	</nav>
</ng-template>
