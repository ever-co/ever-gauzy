<button
	type="button"
	class="theme-toggle"
	[title]="(isDark() ? 'HEADER.SWITCH_TO_LIGHT_THEME' : 'HEADER.SWITCH_TO_DARK_THEME') | translate"
	[attr.aria-label]="(isDark() ? 'HEADER.SWITCH_TO_LIGHT_THEME' : 'HEADER.SWITCH_TO_DARK_THEME') | translate"
	(click)="toggle()"
>
	<!-- The icon shows where a click goes: the sun in the dark theme, the moon in the light one (lucide). -->
	@if (isDark()) {
		<svg
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2"
			stroke-linecap="round"
			stroke-linejoin="round"
			aria-hidden="true"
			focusable="false"
		>
			<circle cx="12" cy="12" r="4" />
			<path d="M12 2v2" />
			<path d="M12 20v2" />
			<path d="m4.93 4.93 1.41 1.41" />
			<path d="m17.66 17.66 1.41 1.41" />
			<path d="M2 12h2" />
			<path d="M20 12h2" />
			<path d="m6.34 17.66-1.41 1.41" />
			<path d="m19.07 4.93-1.41 1.41" />
		</svg>
	} @else {
		<svg
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2"
			stroke-linecap="round"
			stroke-linejoin="round"
			aria-hidden="true"
			focusable="false"
		>
			<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
		</svg>
	}
</button>
