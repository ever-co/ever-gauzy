<nb-card>
  <nb-card-header class="card-custom-header">
    <div class="card-header-title">
      <h4>
        <ngx-header-title>
          {{ 'EXPENSES_PAGE.EXPENSES' | translate }}
        </ngx-header-title>
      </h4>
      <button
        nbButton
        status="basic"
        class="action primary soft"
        (click)="manageCategories()"
        size="small"
        >
        {{ 'BUTTONS.MANAGE_CATEGORIES' | translate }}
      </button>
    </div>
    <div class="gauzy-button-container">
      <ngx-gauzy-button-action
        [isDisable]="disableButton"
        [buttonTemplate]="actionButtons"
        [componentName]="viewComponentName"
        [buttonTemplateVisible]="visibleButton"
      ></ngx-gauzy-button-action>
    </div>
  </nb-card-header>
  <nb-card-body [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerSize="large">
    @if (dataLayoutStyle === componentLayoutStyleEnum.TABLE) {
      <div class="table-scroll-container">
        <angular2-smart-table
          [class.ga-table-loading]="loading"
          style="cursor: pointer"
          [settings]="smartTableSettings"
          [source]="smartTableSource"
          (userRowSelect)="selectExpense($event)"
        ></angular2-smart-table>
      </div>
      <div class="pagination-container">
        @if (smartTableSource) {
          <ngx-pagination
            [source]="smartTableSource"
          ></ngx-pagination>
        }
      </div>
    } @else {
      <ga-card-grid
        [loading]="loading"
        [totalItems]="pagination?.totalItems"
        [settings]="smartTableSettings"
        [source]="expenses"
        (onSelectedItem)="selectExpense($event)"
        (scroll)="onScroll()"
      ></ga-card-grid>
    }
  </nb-card-body>
</nb-card>
<ng-template
  #actionButtons
  let-buttonSize="buttonSize"
  let-selectedItem="selectedItem"
  >
  <div class="btn-group actions">
    <!-- View carries the record's OWN guard (the one the route enforces), not
         the edit guard it used to sit behind — it shows nothing a reader of
         this page cannot already see in the grid. -->
    <ng-template ngxPermissionsOnly="ORG_EXPENSES_VIEW">
      <button
        nbButton
        status="basic"
        class="action secondary"
        [disabled]="!selectedItem && disableButton"
        (click)="viewExpense(selectedItem)"
        size="small"
        >
        <nb-icon icon="eye-outline" pack="eva"></nb-icon>
        {{ 'BUTTONS.VIEW' | translate }}
      </button>
    </ng-template>
    <ng-template ngxPermissionsOnly="ORG_EXPENSES_EDIT">
      <button
        nbButton
        status="basic"
        class="action primary"
        [disabled]="!selectedItem && disableButton"
        (click)="openEditExpenseDialog(selectedItem)"
        size="small"
        >
        <nb-icon icon="edit-outline"></nb-icon>
        {{ 'BUTTONS.EDIT' | translate }}
      </button>
      <button
        nbButton
        status="basic"
        class="action primary"
        [disabled]="!selectedItem && disableButton"
        (click)="openDuplicateExpenseDialog(selectedItem)"
        size="small"
        >
        <nb-icon icon="copy-outline"></nb-icon>
        {{ 'BUTTONS.DUPLICATE' | translate }}
      </button>
      <button
        nbButton
        status="basic"
        class="action"
        [disabled]="!selectedItem && disableButton"
        (click)="deleteExpense(selectedItem)"
        size="small"
        [nbTooltip]="'BUTTONS.DELETE' | translate"
        >
        <nb-icon status="danger" icon="trash-2-outline"></nb-icon>
      </button>
    </ng-template>
  </div>
</ng-template>
<ng-template #visibleButton>
  <ng-template ngxPermissionsOnly="ORG_EXPENSES_EDIT">
    <button
      nbButton
      status="success"
      size="small"
      (click)="openAddExpenseDialog()"
      >
      <nb-icon icon="plus-outline"> </nb-icon>
      {{ 'BUTTONS.ADD' | translate }}
    </button>
  </ng-template>
</ng-template>

<!-- Read-only View. The projected content is gated here (not inside the drawer)
     so the record renderer is built fresh for each expense that is opened. -->
<ngx-record-view-drawer
  [open]="!!viewedExpense"
  heading="EXPENSES_PAGE.EXPENSES"
  [subtitle]="viewedExpense?.category?.name"
  (closed)="closeView()"
  >
  @if (viewedExpense) {
    <ngx-record-view [record]="viewedExpense" [sections]="viewSections"></ngx-record-view>
  }
</ngx-record-view-drawer>
