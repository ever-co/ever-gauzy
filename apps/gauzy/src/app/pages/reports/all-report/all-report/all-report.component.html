<nb-card [nbSpinner]="loading" nbSpinnerSize="giant" nbSpinnerStatus="primary" class="card-scroll">
  <nb-card-header>
    <h4>
      <ngx-header-title [allowEmployee]="false">
        {{ 'REPORT_PAGE.ALL_REPORTS' | translate }}
      </ngx-header-title>
    </h4>
  </nb-card-header>
  <nb-card-body class="content">
    @for (reportCategory of reportCategories; track reportCategory) {
      <section class="report-category">
        <h5 class="report-category-name">
          <span class="category-icon" aria-hidden="true">
            <i class="fa {{ reportCategory.iconClass }}"></i>
          </span>
          {{ reportCategory.name }}
        </h5>
        <div class="card-grid">
          @for (report of reportCategory.reports; track report) {
            <nb-card class="report-card">
              <nb-card-header class="report-card-header">
                <h6 class="report-name" [title]="report?.name">{{ report?.name }}</h6>
                <nb-toggle
                  (click)="$event.stopPropagation()"
                  [(ngModel)]="report.showInMenu"
                  (checkedChange)="updateShowInMenu($event, report)"
                ></nb-toggle>
              </nb-card-header>
              <nb-card-body class="report-card-body">
                <p class="report-description" [title]="report?.description">{{ report?.description }}</p>
                <div class="report-preview">
                  @if (report.imageUrl) {
                    <!--
                      Decorative: the card already names the report in its header,
                      and the tile is a thumbnail of that report. An empty alt is
                      what keeps a screen reader from reading the image URL out in
                      its place.
                    -->
                    <img class="report-preview-image" [src]="report.imageUrl" alt="" />
                  }
                  <div class="report-preview-overlay">
                    <button
                      nbButton
                      size="small"
                      status="primary"
                      class="report-preview-action"
                      [routerLink]="['/pages/reports', report.slug]"
                    >
                      {{ 'BUTTONS.VIEW_REPORT' | translate }}
                    </button>
                  </div>
                </div>
              </nb-card-body>
            </nb-card>
          }
        </div>
      </section>
    }
  </nb-card-body>
</nb-card>
