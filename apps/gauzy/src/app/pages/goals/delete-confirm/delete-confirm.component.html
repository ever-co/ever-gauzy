<nb-card
	class="confirm"
	role="alertdialog"
	aria-modal="true"
	[attr.aria-labelledby]="titleId"
	[attr.aria-describedby]="messageId"
>
	<nb-card-body>
		<div class="head">
			<nb-icon class="icon" icon="alert-triangle" status="danger" aria-hidden="true"></nb-icon>
			<h5 class="title" [id]="titleId">{{ data?.title }}</h5>
		</div>
		<p class="message" [id]="messageId">{{ data?.message }}</p>
	</nb-card-body>
	<nb-card-footer>
		<button type="button" nbButton ghost status="basic" size="small" (click)="close('no')">
			{{ 'BUTTONS.CANCEL' | translate }}
		</button>
		<button type="button" nbButton status="danger" size="small" (click)="close('yes')">
			{{ 'BUTTONS.DELETE' | translate }}
		</button>
	</nb-card-footer>
</nb-card>
