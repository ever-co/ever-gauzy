<nb-card class="secret-dialog" role="dialog" aria-modal="true" aria-labelledby="api-token-secret-title">
	<nb-card-header>
		<nb-icon icon="shield-outline" status="warning" aria-hidden="true"></nb-icon>
		<span id="api-token-secret-title">{{ 'USER_API_TOKENS.SECRET_DIALOG.TITLE' | translate }}</span>
	</nb-card-header>

	<nb-card-body>
		<nb-alert status="warning" class="warning">
			{{ 'USER_API_TOKENS.SECRET_DIALOG.WARNING' | translate }}
		</nb-alert>

		<div class="credential">
			<span class="credential-name">{{ created.name }}</span>
			<div class="credential-row">
				<code class="secret">{{ created.token }}</code>
				<button
					type="button"
					nbButton
					size="small"
					status="primary"
					ghost
					(click)="copyToken()"
					[attr.aria-label]="'USER_API_TOKENS.SECRET_DIALOG.COPY_ARIA' | translate"
				>
					<nb-icon icon="copy-outline"></nb-icon>
				</button>
			</div>
		</div>

		<nb-toggle [(checked)]="acknowledged">
			{{ 'USER_API_TOKENS.SECRET_DIALOG.ACKNOWLEDGE' | translate }}
		</nb-toggle>
	</nb-card-body>

	<nb-card-footer class="actions">
		<button type="button" nbButton size="small" status="primary" [disabled]="!acknowledged" (click)="close()">
			{{ 'USER_API_TOKENS.SECRET_DIALOG.CLOSE' | translate }}
		</button>
	</nb-card-footer>
</nb-card>
