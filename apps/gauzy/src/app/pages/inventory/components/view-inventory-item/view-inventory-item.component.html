<nb-card class="main card-scroll">
	<nb-card-header class="d-flex align-items-center">
		<ngx-back-navigation></ngx-back-navigation>
		<h5 class="page-title">
			{{ 'INVENTORY_PAGE.VIEW_INVENTORY_ITEM' | translate }}
		</h5>
		@if (inventoryItem?.id) {
			<ngx-favorite-toggle
				class="ml-auto"
				[entityType]="'Product'"
				[entityId]="inventoryItem.id"
				[entityName]="$any(inventoryItem).name || ''"
				size="small"
				status="basic"
				spacing="list"
			></ngx-favorite-toggle>
		}
	</nb-card-header>

	<nb-card-body [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerSize="large">
		@if (inventoryItem) {
		<div class="item-view">
			<div class="item-media">
				<div class="item-picture">
					@if (inventoryItem.featuredImage?.fullUrl) {
					<img [src]="inventoryItem.featuredImage.fullUrl" alt="Feature image" />
					} @else {
					<ga-no-image class="no-image" [fontSize]="13"></ga-no-image>
					}
				</div>
				@if (inventoryItem.gallery?.length) {
				<div class="item-gallery">
					@for (galleryItem of inventoryItem.gallery; track galleryItem.id; let i = $index) {
					<button
						type="button"
						class="item-gallery-thumb"
						[attr.aria-label]="
							'INVENTORY_PAGE.OPEN_GALLERY_IMAGE' | translate : { index: i + 1, total: inventoryItem.gallery.length }
						"
						(click)="onGalleryItemClick(galleryItem)"
					>
						<img [src]="galleryItem.fullUrl" alt="" />
					</button>
					}
				</div>
				}
			</div>

			<div class="item-main">
				<ngx-record-view
					[record]="inventoryItem"
					[sections]="detailsSections"
					[placeholder]="'SM_TABLE.NONE' | translate"
				></ngx-record-view>

				<div class="table-scroll-container">
					<angular2-smart-table
						[class.ga-table-loading]="loading"
						[settings]="settingsSmartTable"
						[source]="smartTableSource"
						#variantTable
					>
					</angular2-smart-table>
				</div>
			</div>
		</div>
		}
	</nb-card-body>
</nb-card>
