@if (form) {
  <form class="main-form" [formGroup]="form">
    <nb-card class="email-templates-card">
      <nb-card-header class="page-header">
        <h4>
          <ngx-header-title [allowEmployee]="false">
            <span class="menu-setting">
              {{ 'MENU.SETTINGS' | translate }}/
            </span>
            {{ 'EMAIL_TEMPLATES_PAGE.HEADER' | translate }}
          </ngx-header-title>
        </h4>
        <button
          type="button"
          class="save-button"
          nbButton
          size="small"
          status="success"
          [disabled]="form.invalid"
          (click)="submitForm()"
        >
          <nb-icon icon="save-outline"></nb-icon>
          {{ 'EMAIL_TEMPLATES_PAGE.SAVE' | translate }}
        </button>
      </nb-card-header>

      <nb-card-body>
        <!-- ── Template picker ─────────────────────────────────────────── -->
        <div class="toolbar">
          <div class="toolbar-field language">
            <label class="toolbar-label" for="languageCode">
              {{ 'EMAIL_TEMPLATES_PAGE.LABELS.LANGUAGE' | translate }}
            </label>
            <ngx-language-selector
              class="toolbar-control"
              size="small"
              template="ng-select"
              formControlName="languageCode"
              (selectedLanguageEvent)="subject$.next(true)"
            ></ngx-language-selector>
          </div>
          <div class="toolbar-field template">
            <label class="toolbar-label" for="templateName">
              {{ 'EMAIL_TEMPLATES_PAGE.LABELS.TEMPLATE_NAME' | translate }}
            </label>
            <nb-select
              id="templateName"
              class="toolbar-control"
              size="small"
              fullWidth
              formControlName="name"
              [placeholder]="'EMAIL_TEMPLATES_PAGE.LABELS.TEMPLATE_NAME' | translate"
              (selectedChange)="subject$.next(true)"
            >
              @for (name of templates; track name) {
                <nb-option [value]="name">
                  {{ 'EMAIL_TEMPLATES_PAGE.TEMPLATE_NAMES.' + name | translate }}
                </nb-option>
              }
            </nb-select>
          </div>
        </div>

        <div class="workspace">
          <!-- ── Editor ──────────────────────────────────────────────── -->
          <section class="pane editor-pane">
            <header class="pane-header">
              <nb-icon icon="code-outline"></nb-icon>
              <span class="pane-title">
                {{ 'EMAIL_TEMPLATES_PAGE.HTML_EDITOR' | translate }}
              </span>
            </header>
            <div class="pane-body">
              <div class="field subject-field">
                <label class="field-label" for="subject">
                  {{ 'EMAIL_TEMPLATES_PAGE.LABELS.SUBJECT' | translate }}
                </label>
                <div class="code-frame">
                  <ace-editor
                    id="subject"
                    #subjectEditor
                    class="ace-editor subject-editor"
                    [durationBeforeCallback]="400"
                    [mode]="'handlebars'"
                    (textChange)="onSubjectChange($event)"
                  ></ace-editor>
                </div>
              </div>
              <div class="field body-field">
                <label class="field-label" for="email">
                  {{ 'EMAIL_TEMPLATES_PAGE.LABELS.EMAIL_BODY' | translate }}
                </label>
                <div class="code-frame">
                  <ace-editor
                    #emailEditor
                    id="email"
                    class="ace-editor body-editor"
                    [mode]="'handlebars'"
                    [durationBeforeCallback]="400"
                    (textChange)="onEmailChange($event)"
                  ></ace-editor>
                </div>
              </div>
            </div>
          </section>

          <!-- ── Live preview ────────────────────────────────────────── -->
          <section class="pane preview-pane">
            <header class="pane-header">
              <nb-icon icon="eye-outline"></nb-icon>
              <label class="pane-title" for="previewEmail">
                {{ 'EMAIL_TEMPLATES_PAGE.LABELS.EMAIL_PREVIEW' | translate }}
              </label>
            </header>
            <div class="pane-body">
              <div class="preview-subject">
                <label class="field-label" for="previewSubject">
                  {{ 'EMAIL_TEMPLATES_PAGE.LABELS.SUBJECT_PREVIEW' | translate }}
                </label>
                <div id="previewSubject" class="preview-subject-value" [innerHtml]="previewSubject"></div>
              </div>
              <div class="preview-canvas">
                <div id="previewEmail" class="email-paper" [innerHtml]="previewEmail"></div>
              </div>
            </div>
          </section>
        </div>
      </nb-card-body>
    </nb-card>
  </form>
}
