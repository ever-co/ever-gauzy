<ga-candidate-criterion-card
	icon="code-outline"
	heading="CANDIDATES_PAGE.CRITERIONS.TECHNOLOGY_STACK"
	placeholder="FORM.PLACEHOLDERS.ADD_TECHNOLOGY"
	emptyText="CANDIDATES_PAGE.CRITERIONS.TECHNOLOGY_PLACEHOLDER"
	[group]="form ? technologies?.at(0) : null"
	[items]="technologiesList"
	[existedNames]="existedTechNames"
	[showCancel]="true"
	(cancel)="cancel()"
	(save)="save()"
	(editItem)="edit($event.index, $event.id)"
	(removeItem)="remove($event)"
></ga-candidate-criterion-card>
