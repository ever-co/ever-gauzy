<nb-card>
  <nb-card-header class="card-custom-header">
    <div class="col-auto">
      <h4>
        <ngx-header-title>
          {{ 'INCOME_PAGE.INCOME' | translate }}
        </ngx-header-title>
      </h4>
    </div>
    <div class="gauzy-button-container">
      <ngx-gauzy-button-action
        [isDisable]="disableButton"
        [buttonTemplate]="actionButtons"
        [componentName]="viewComponentName"
        [buttonTemplateVisible]="visibleButton"
      ></ngx-gauzy-button-action>
    </div>
  </nb-card-header>
  <nb-card-body class="custom-card" [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerSize="large">
    @if (dataLayoutStyle === componentLayoutStyleEnum.TABLE) {
      <div class="table-scroll-container">
        <angular2-smart-table
          [class.ga-table-loading]="loading"
          style="cursor: pointer"
          (userRowSelect)="selectIncome($event)"
          [settings]="smartTableSettings"
          [source]="smartTableSource"
        ></angular2-smart-table>
      </div>
      <div class="pagination-container">
        @if (smartTableSource) {
          <ngx-pagination
            [source]="smartTableSource"
          ></ngx-pagination>
        }
      </div>
    } @else {
      <ga-card-grid
        [loading]="loading"
        [totalItems]="pagination?.totalItems"
        [settings]="smartTableSettings"
        [source]="incomes"
        (onSelectedItem)="selectIncome($event)"
        (scroll)="onScroll()"
      ></ga-card-grid>
    }
    <!-- Removed an `<ng-template #gridLayout>` that repeated the card grid above:
         `gridLayout` was referenced nowhere in this template or its component, so
         it was never instantiated. The `@else` branch is the grid layout. -->
  </nb-card-body>
</nb-card>

<ng-template
  #actionButtons
  let-buttonSize="buttonSize"
  let-selectedItem="selectedItem"
  >
  <div class="btn-group actions">
    <!-- View carries the record's OWN guard (the one the route enforces), not
         the edit guard it used to sit behind — it shows nothing a reader of
         this page cannot already see in the grid. -->
    <ng-template ngxPermissionsOnly="ORG_INCOMES_VIEW">
      <button
        nbButton
        status="basic"
        class="action secondary"
        [disabled]="!selectedItem && disableButton"
        (click)="viewIncome(selectedItem)"
        size="small"
        >
        <nb-icon icon="eye-outline" pack="eva"></nb-icon>
        {{ 'BUTTONS.VIEW' | translate }}
      </button>
    </ng-template>
    <ng-template ngxPermissionsOnly="ORG_INCOMES_EDIT">
      <button
        nbButton
        status="basic"
        class="action primary"
        [disabled]="!selectedItem && disableButton"
        (click)="editIncome(selectedItem)"
        size="small"
        >
        <nb-icon icon="edit-outline"></nb-icon
          >{{ 'BUTTONS.EDIT' | translate }}
        </button>
        <button
          nbButton
          status="basic"
          class="action"
          [disabled]="!selectedItem && disableButton"
          (click)="deleteIncome(selectedItem)"
          size="small"
          [nbTooltip]="'BUTTONS.DELETE' | translate"
          >
          <nb-icon status="danger" icon="trash-2-outline"> </nb-icon>
        </button>
      </ng-template>
    </div>
  </ng-template>
  <ng-template #visibleButton>
    <ng-template ngxPermissionsOnly="ORG_INCOMES_EDIT">
      <button
        nbButton
        status="success"
        size="small"
        (click)="addIncome()"
        >
        <nb-icon icon="plus-outline"> </nb-icon>
        {{ 'BUTTONS.ADD' | translate }}
      </button>
    </ng-template>
  </ng-template>

  <!-- Read-only View. The projected content is gated here (not inside the drawer)
       so the record renderer is built fresh for each entry that is opened. -->
  <ngx-record-view-drawer
    [open]="!!viewedIncome"
    heading="INCOME_PAGE.INCOME"
    [subtitle]="viewedIncome?.client?.name"
    (closed)="closeView()"
    >
    @if (viewedIncome) {
      <ngx-record-view [record]="viewedIncome" [sections]="viewSections"></ngx-record-view>
    }
  </ngx-record-view-drawer>
