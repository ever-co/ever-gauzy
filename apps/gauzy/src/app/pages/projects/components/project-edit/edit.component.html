<nb-card [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerSize="large">
  <nb-card-header class="main-header">
    <div class="page-heading">
      <div class="page-heading__title">
        <ngx-back-navigation></ngx-back-navigation>
        <div class="heading">
          <h4 class="title">{{ 'ORGANIZATIONS_PAGE.EDIT.EDIT_PROJECT' | translate }}</h4>
          @if (project$ | async; as project) {
            <p class="subtitle">{{ project.name }}</p>
          }
        </div>
      </div>
      @if (project$ | async; as project) {
        <ngx-favorite-toggle
          [entityType]="'OrganizationProject'"
          [entityId]="project.id"
          [entityName]="project.name"
          size="small"
          status="basic"
          spacing="detail"
          [showLabel]="false"
          (favoriteToggled)="onFavoriteToggled($event)"
        ></ngx-favorite-toggle>
      }
    </div>
  </nb-card-header>
  <nb-card-body class="custom-body-content">
    <!-- The form, with the Documents panel in a column on its right (under it on narrow screens). -->
    <div class="project-edit-layout">
      <div class="project-edit-main">
        <ng-template [ngxPermissionsOnly]="['ALL_ORG_EDIT', 'ORG_PROJECT_EDIT']">
          <ga-project-mutation
            [integration]="integration$ | async"
            [project]="project$ | async"
            (onSubmitted)="onSubmit($event)"
          ></ga-project-mutation>
        </ng-template>
      </div>

      <!--
        Record-side Documents panel (spec 00 §6.14 R-LNK-02). Outside the edit-permission
        templates on purpose: reading a project's attachments is DOCS_READ, not
        ORG_PROJECT_EDIT. The panel gates itself on DOCS_READ + FEATURE_DOCUMENTS.
      -->
      @if (project$ | async; as project) {
        <aside class="project-edit-aside">
          <gz-document-links-panel
            [entity]="documentEntity"
            [entityId]="project.id"
            [entityLabel]="project.name"
          ></gz-document-links-panel>
        </aside>
      }
    </div>
  </nb-card-body>
</nb-card>
