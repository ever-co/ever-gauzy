<nb-card [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerSize="large">
  <nb-card-header class="main-header">
    <div class="page-heading">
      <div class="page-heading__title">
        <ngx-back-navigation></ngx-back-navigation>
        <div class="heading">
          <h4 class="title">{{ 'ORGANIZATIONS_PAGE.EDIT.NEW_PROJECT' | translate }}</h4>
          <p class="subtitle">{{ 'ORGANIZATIONS_PAGE.PROJECT_FORM.CREATE_SUBTITLE' | translate }}</p>
        </div>
      </div>
    </div>
  </nb-card-header>
  <nb-card-body class="custom-body-content">
    <ng-template [ngxPermissionsOnly]="['ALL_ORG_EDIT', 'ORG_PROJECT_ADD']">
      <!-- The form, with the Documents panel on its right, as on the edit page. -->
      <div class="project-edit-layout">
        <div class="project-edit-main">
          <ga-project-mutation [integration]="false" (onSubmitted)="onSubmit($event)"></ga-project-mutation>
        </div>
        <!-- The project has no id yet: the panel holds the files and attaches them once it is saved. -->
        <aside class="project-edit-aside">
          <gz-document-links-panel [deferred]="true" [entity]="documentEntity"></gz-document-links-panel>
        </aside>
      </div>
    </ng-template>
  </nb-card-body>
</nb-card>
