<!-- A project's own page: the list's back button, a favorite star and the period, then tabs — Overview,
     Board and Activity — in the manner of Jira's project pages. -->
<ngx-record-view-page
	heading="SM_TABLE.PROJECT"
	[backLink]="backLink"
	[state]="state"
	(retry)="load()"
>
	@if (card) {
	<div recordPageActions class="project-page-actions">
		<ngx-favorite-toggle
			[entityType]="'OrganizationProject'"
			[entityId]="card.id"
			[entityName]="card.name"
			size="small"
			status="basic"
			spacing="list"
		></ngx-favorite-toggle>
		<!-- The period, on the tabs whose figures read over it. -->
		@if (showsPeriod) {
		<span class="project-page-range">
			<nb-icon icon="calendar-outline" aria-hidden="true"></nb-icon>
			{{ rangeLabel }}
		</span>
		<nb-select
			class="project-page-period"
			size="small"
			status="basic"
			[(selected)]="period"
			[attr.aria-label]="'EMPLOYEES_PAGE.VIEW.PERIOD' | translate"
		>
			@for (option of periods; track option) {
			<nb-option [value]="option">{{ 'EMPLOYEES_PAGE.VIEW.PERIODS.' + option | translate }}</nb-option>
			}
		</nb-select>
		}
	</div>
	}
	@if (card) {
	<div class="project-page">
		<div class="tab-row project-page-tabs">
			<div class="tabs" role="tablist" [attr.aria-label]="card.name">
				@for (item of tabs; track item.id) {
				<button
					type="button"
					role="tab"
					class="tab"
					[id]="'project-view-tab-' + item.id"
					[attr.aria-controls]="'project-view-pane-' + item.id"
					[class.is-active]="tab === item.id"
					[attr.aria-selected]="tab === item.id"
					(click)="selectTab(item.id)"
				>
					<nb-icon [icon]="item.icon" aria-hidden="true"></nb-icon>
					{{ item.label | translate }}
				</button>
				}
			</div>
		</div>

		<!-- Overview stays loaded while another tab is open, so coming back to it does not reload it. -->
		<div
			class="project-page-pane"
			role="tabpanel"
			id="project-view-pane-overview"
			aria-labelledby="project-view-tab-overview"
			[hidden]="tab !== 'overview'"
		>
			<ngx-project-quick-look
				#quickLook
				mode="page"
				[project]="card"
				[organizationId]="organization?.id"
				[tenantId]="organization?.tenantId"
				[rangeStart]="periodStartIso"
				[rangeEnd]="periodEndIso"
				[period]="period"
				[scopeEmployeeIds]="null"
			></ngx-project-quick-look>
		</div>

		<!-- The other tabs load when first opened. -->
		@switch (tab) {
		@case ('board') {
		<div class="project-page-pane" role="tabpanel" id="project-view-pane-board" aria-labelledby="project-view-tab-board">
			<!-- A card moved on the board changes its task's status: the Overview's task panels read it again. -->
			<ga-project-board
				[projectId]="card.id"
				[organizationId]="organization?.id"
				[tenantId]="organization?.tenantId"
				(taskMoved)="quickLook.reloadTasks()"
			></ga-project-board>
		</div>
		}
		@case ('activity') {
		<div class="project-page-pane" role="tabpanel" id="project-view-pane-activity" aria-labelledby="project-view-tab-activity">
			<ga-project-activity
				[projectId]="card.id"
				[projectName]="card.name"
				[organizationId]="organization?.id"
				[tenantId]="organization?.tenantId"
			></ga-project-activity>
		</div>
		}
		}
	</div>
	}
</ngx-record-view-page>
