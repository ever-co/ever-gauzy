<nb-card [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerSize="large">
  <nb-card-header class="d-flex flex-column pb-0">
    <div class="card-header-title">
      <h4>
        <ngx-header-title [allowEmployee]="false">
          {{ 'ORGANIZATIONS_PAGE.ORGANIZATIONS' | translate }}
        </ngx-header-title>
      </h4>
    </div>
    <div class="align-self-end">
      <ngx-gauzy-button-action
        [buttonTemplate]="actionButtons"
        [buttonTemplateVisible]="visible"
        [isDisable]="disableButton"
        [componentName]="viewComponentName"
      ></ngx-gauzy-button-action>
    </div>
  </nb-card-header>
  <nb-card-body>
    @if (dataLayoutStyle === componentLayoutStyleEnum.TABLE) {
      <div class="table-scroll-container">
        <angular2-smart-table
          [class.ga-table-loading]="loading"
          [settings]="settingsSmartTable"
          [source]="smartTableSource"
          (userRowSelect)="selectOrganization($event)"
          style="cursor: pointer"
          #organizationsTable
        ></angular2-smart-table>
      </div>
      <div class="pagination-container align-self-end">
        @if (smartTableSource) {
          <ngx-pagination [source]="smartTableSource"></ngx-pagination>
        }
      </div>
    } @else {
      <ga-card-grid
        [loading]="loading"
        [totalItems]="pagination?.totalItems"
        [settings]="settingsSmartTable"
        [source]="organizations"
        (onSelectedItem)="selectOrganization($event)"
        (scroll)="onScroll()"
      ></ga-card-grid>
    }
  </nb-card-body>
</nb-card>
<ng-template #actionButtons let-buttonSize="buttonSize" let-selectedItem="selectedItem">
  <div class="actions">
    <!-- View carries the record's OWN guard (the one the route enforces), not
         the edit guard it used to sit behind — it shows nothing a reader of
         this page cannot already see in the grid. -->
    <ng-template ngxPermissionsOnly="ALL_ORG_VIEW">
      <button
        nbButton
        [disabled]="!selectedItem && disableButton"
        (click)="viewOrganization(selectedItem)"
        status="basic"
        class="action secondary"
        size="small"
        >
        <nb-icon class="mr-1" icon="eye-outline"></nb-icon>{{ 'BUTTONS.VIEW' | translate }}
      </button>
    </ng-template>
    <ng-template [ngxPermissionsOnly]="['ALL_ORG_EDIT', 'ORG_EXPENSES_EDIT']">
      <button
        nbButton
        [disabled]="!selectedItem && disableButton"
        (click)="editOrganization(selectedItem)"
        status="basic"
        class="action primary"
        size="small"
        >
        <nb-icon class="mr-1" icon="edit-outline"></nb-icon>{{ 'BUTTONS.MANAGE' | translate }}
      </button>
    </ng-template>
    <ng-template [ngxPermissionsOnly]="['ALL_ORG_EDIT']">
      <button
        nbButton
        [disabled]="!selectedItem && disableButton"
        (click)="deleteOrganization(selectedItem)"
        status="basic"
        class="action"
        size="small"
        [nbTooltip]="'BUTTONS.DELETE' | translate"
        >
        <nb-icon status="danger" icon="trash-2-outline"></nb-icon>
      </button>
    </ng-template>
  </div>
</ng-template>
<ng-template #visible>
  <ng-template [ngxPermissionsOnly]="['ALL_ORG_EDIT']">
    <button nbButton status="success" class="action" size="small" (click)="addOrganization()">
      <nb-icon class="mr-1" icon="plus-outline"></nb-icon>{{ 'BUTTONS.ADD' | translate }}
    </button>
  </ng-template>
</ng-template>

<!-- Read-only View. The projected content is gated here (not inside the drawer)
     so the record renderer is built fresh for each organization that is opened. -->
<ngx-record-view-drawer
  [open]="!!viewedOrganization"
  heading="ORGANIZATIONS_PAGE.ORGANIZATIONS"
  [subtitle]="viewedOrganization?.name"
  (closed)="closeView()"
  >
  @if (viewedOrganization) {
    <ngx-record-view [record]="viewedOrganization" [sections]="viewSections"></ngx-record-view>
  }
</ngx-record-view-drawer>
