<!-- Add the user to organizations they are not in yet: pick, then Add (or Cancel). -->
@if (form) {
	<form class="add" [formGroup]="form">
		<label class="add__label">{{ 'USERS_PAGE.ADD_EXISTING_ORGANIZATION' | translate }}</label>
		<div class="add__row">
			<ga-user-organizations-multi-select
				class="add__select"
				[selectedOrganizationsId]="selectedOrganizationsId"
				[allOrganizations]="organizations"
				(selectedChange)="onOrganizationsSelected($event)"
			></ga-user-organizations-multi-select>
			<div class="add__actions">
				<button type="button" nbButton outline status="basic" size="small" (click)="cancel()">
					{{ 'BUTTONS.CANCEL' | translate }}
				</button>
				<button
					type="button"
					class="add__submit"
					nbButton
					status="primary"
					size="small"
					[disabled]="!selectedOrganizationsId?.length"
					(click)="submitForm()"
				>
					{{ 'BUTTONS.ADD' | translate }}
				</button>
			</div>
		</div>
	</form>
}
