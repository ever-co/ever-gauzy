<div class="custom-dashboard">
	<!--
	  A custom dashboard had no page title, and therefore no breadcrumb trail —
	  `ngx-header-title` is what renders one, and it parks it next to the heading
	  it sits in. Every standard dashboard tab carries its own title ("Teams for
	  …"), so a custom one showing its own name is the consistent shape.
	-->
	@if (dashboard) {
		<!--
		  The heading gets its own wrapper because `ngx-header-title` stamps
		  `ga-page-title-row` (which is `flex-wrap: wrap`) onto the heading's
		  PARENT, so the trail can drop onto its own line. `.custom-dashboard` is
		  the page's column flex container — that class belongs on a box that
		  exists for the title, not on the layout.
		-->
		<div class="custom-dashboard__heading">
			<h4 class="custom-dashboard__title">
				<ngx-header-title [allowEmployee]="false">{{ dashboard.name }}</ngx-header-title>
			</h4>
		</div>
	}

	<!-- Builder hint bar: only while arranging. Save / Discard live in the switcher. -->
	@if (editing) {
		<div class="builder-toolbar">
			<span class="builder-toolbar__hint">
				{{ 'DASHBOARD_PAGE.BUILDER.EDIT_HINT' | translate }}
			</span>
			@if (dirty) {
				<span class="builder-toolbar__dirty">
					<nb-icon icon="alert-circle-outline"></nb-icon>
					{{ 'DASHBOARD_PAGE.BUILDER.UNSAVED_CHANGES' | translate }}
				</span>
			}
		</div>
	}

	<ga-dashboard-tab-strip
		[tabs]="layout.tabs"
		[activeTabId]="activeTabId"
		[editing]="editing"
		(tabSelect)="onSelectTab($event)"
		(addRequested)="onAddTab($event)"
		(renameRequested)="onRenameTab($event)"
		(duplicateRequested)="onDuplicateTab($event)"
		(deleteRequested)="onDeleteTab($event)"
		(reordered)="onReorderTabs($event)"
	></ga-dashboard-tab-strip>

	<div class="custom-dashboard__body">
		<ga-dashboard-canvas
			[tab]="activeTab"
			[editing]="editing"
			(layoutChange)="onLayoutChange($event)"
			(configureRequested)="onConfigureWidget($event)"
		></ga-dashboard-canvas>

		@if (editing) {
			<ga-widget-palette (addRequested)="onAddWidget($event)"></ga-widget-palette>
		}
	</div>
</div>
