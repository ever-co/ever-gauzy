<!--
	Chart surface only. The chart-type switcher used to live here, right-aligned
	above the canvas, which on the HR dashboard put a second header-ish row
	directly under the panel's real header with nothing to anchor it to. The page
	that hosts this component now owns that control and drives `selectedChart`,
	so the toolbar and the panel title share one line.
-->
<div class="chart-wrap">
  @switch (selectedChart) {
    @case (EmployeeChartEnum.DOUGHNUT) {
      <ga-employee-doughnut-chart [employeeStatistics]="employeeStatistics"></ga-employee-doughnut-chart>
    }
    @case (EmployeeChartEnum.STACKED_BAR) {
      <ga-employee-stacked-bar-chart [employeeStatistics]="employeeStatistics"></ga-employee-stacked-bar-chart>
    }
    @default {
      <ga-employee-horizontal-bar-chart
        [employeeStatistics]="employeeStatistics"
      ></ga-employee-horizontal-bar-chart>
    }
  }
</div>
