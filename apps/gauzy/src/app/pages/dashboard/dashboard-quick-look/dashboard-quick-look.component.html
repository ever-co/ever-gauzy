<!-- Task quick look: the same drawer as the Tasks pages, with an expand icon to the task's own page. -->
<ngx-record-view-drawer
	[open]="!!viewedTask"
	[heading]="'TASKS_PAGE.HEADER'"
	[wide]="true"
	[fullViewLink]="viewedTask ? '/pages/tasks/view/' + viewedTask.id : null"
	(closed)="closeTask()"
>
	@if (viewedTask) {
	<ngx-record-view [record]="viewedTask" [sections]="viewSections" [placeholder]="'SM_TABLE.NONE' | translate">
		<ga-task-view-header recordViewHeader [task]="viewedTask" [status]="viewStatus"></ga-task-view-header>
	</ngx-record-view>
	}
</ngx-record-view-drawer>

<!-- Project quick look: the same drawer as the employee page, over the dashboard's date range. -->
<ngx-project-quick-look
	[project]="viewedProject"
	[organizationId]="organizationId"
	[tenantId]="tenantId"
	[rangeStart]="rangeStart"
	[rangeEnd]="rangeEnd"
	[scopeEmployeeIds]="selectedEmployeeId ? [selectedEmployeeId] : null"
	[highlightEmployeeId]="selectedEmployeeId"
	(closed)="closeProject()"
></ngx-project-quick-look>
