<!--
The panel renders nothing without DOCS_READ or with FEATURE_DOCUMENTS off, so the
tab body is simply empty on a deployment that does not run the Documents feature.
-->
@if (selectedEmployee) {
	<gz-document-links-panel
		[entity]="documentEntity"
		[entityId]="selectedEmployee.id"
		[entityLabel]="employeeName"
	></gz-document-links-panel>
}
