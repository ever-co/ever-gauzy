include:
  - ./docker-compose.infra.yml

services:
  api:
    container_name: api
    image: gauzy-api:latest
    build:
      context: .
      dockerfile: .deploy/api/Dockerfile
      # Only NODE_ENV is passed as a build arg here (picks the dev/prod nx build);
      # the Dockerfile also accepts DEMO, NODE_OPTIONS and NX_BRANCH with built-in
      # defaults. All other configuration is runtime environment (see `environment:`
      # below) — the API image does not bake env values at build time.
      # Same default as the runtime `NODE_ENV` below: with `development` here the image shipped the
      # dev nx build while running as production.
      args:
        NODE_ENV: ${NODE_ENV:-production}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db

    env_file:
      - .env.compose
    entrypoint: './entrypoint.compose.sh'
    command: ['node', 'main.js']
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      zipkin:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      minio_create_buckets:
        condition: service_started
      opensearch:
        condition: service_healthy
      cube:
        condition: service_started
    links:
      - db:${DB_HOST:-db}
      - cube:${CUBE_HOST:-cube}
      - redis:${REDIS_HOST:-redis}
      - minio:${MINIO_HOST:-minio}
      - opensearch:${ES_HOST:-opensearch}
    # volumes:
    # - webapp_node_modules:/srv/gauzy/node_modules
    # - api_node_modules:/srv/gauzy/apps/api/node_modules
    ports:
      - '3000:${API_PORT:-3000}'
    networks:
      - overlay

  webapp:
    container_name: webapp
    image: gauzy-webapp:latest
    build:
      context: .
      dockerfile: .deploy/webapp/Dockerfile
      # Only NODE_ENV and DEMO are passed as build args here; the Dockerfile also
      # accepts NODE_OPTIONS and NX_BRANCH with built-in defaults. The Angular bundle
      # is compiled with DOCKER_* placeholders; all other values are substituted from
      # the RUNTIME environment (see `environment:` below) by the container entrypoint
      # at startup.
      args:
        NODE_ENV: ${NODE_ENV:-development}
        DEMO: 'true'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SENTRY_PROFILE_SAMPLE_RATE: ${SENTRY_PROFILE_SAMPLE_RATE:-1}
      DEMO: 'true'
    entrypoint: './entrypoint.compose.sh'
    command: ['nginx', '-g', 'daemon off;']
    env_file:
      - .env.compose
    restart: on-failure
    links:
      - db:${DB_HOST:-db}
      - api:${API_HOST:-api}
      - cube:${CUBE_HOST:-cube}
      - redis:${REDIS_HOST:-redis}
      - minio:${MINIO_HOST:-minio}
      - opensearch:${ES_HOST:-opensearch}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      minio_create_buckets:
        condition: service_started
      opensearch:
        condition: service_started
      api:
        condition: service_started
    # volumes:
    # - webapp_node_modules:/srv/gauzy/node_modules
    ports:
      - '4200:${UI_PORT:-4200}'
    networks:
      - overlay
