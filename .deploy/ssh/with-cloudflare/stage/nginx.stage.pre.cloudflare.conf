user nginx;
events {
    worker_connections 1024;
}
http {
    server {
        listen 80;
        server_name apistagedt.gauzy.co;

        location / {
            return 301 https://$host$request_uri;
        }
    }
    server {
        listen 443 ssl;
        server_name apistagedt.gauzy.co;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
           proxy_pass http://api:3000;

           # This nginx sits BEHIND Cloudflare, so $remote_addr is a Cloudflare edge address and the
           # real client address arrives in CF-Connecting-IP - which is forwarded untouched and is
           # trustworthy here ONLY if nothing but Cloudflare can reach this listener: restrict ports
           # 80/443 to Cloudflare's published ranges at the firewall, or enable Authenticated Origin
           # Pulls. The API compose template runs with THROTTLE_TRUST_CF_CONNECTING_IP=true for this
           # shape; set it to false where that boundary does not hold. Everything
           # the client could otherwise choose for itself is overwritten (GHSA-86mw-2crg-vmhc).
           proxy_set_header Host $http_host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $remote_addr;
           proxy_set_header X-Forwarded-Proto $scheme;
        }
    }  
}
