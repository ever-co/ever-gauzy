user nginx;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  # Compress text responses: the Angular bundles are several MB and shipped uncompressed before
  # (neither this nginx nor the ingress compressed anything). Already-compressed formats (woff2,
  # images) are left alone; `gzip_proxied any` covers responses proxied from the API as well.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/manifest+json image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

  upstream api {
    server ${API_HOST}:${API_PORT};
  }

  server {
    listen 4200;

    root /srv/gauzy;

    location ^~ /assets/ {    
      try_files $uri =404;
    }

    # The build names every bundle and stylesheet with a content hash (main-XXXXXXXX.js,
    # styles-XXXXXXXX.css): a changed file has a new name, so these can be kept for a year. index.html
    # (never cached, below) is what points at the current names.
    location ~* "^/[^/]+[.-][0-9a-z]{8,}\.(js|css)$" {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html names the current build's hashed bundles: never serve it from a cache, or a browser/CDN
    # mixes an old index (or old unhashed chunks) with a new deploy and the app fails to start.
    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate" always;
    }
    
    location / {
      try_files $uri $uri/ /index.html;      
    }

    location ^~ /api/ {
      proxy_pass http://api;

      # The API derives req.ip - and therefore the rate-limit bucket - from these headers, so this
      # proxy has to own them. Assigning (not appending) $remote_addr discards anything the client
      # sent, and blanking CF-Connecting-IP stops a client forging the Cloudflare header
      # (GHSA-86mw-2crg-vmhc).
      #
      # The shipped compose files set TRUST_PROXY=false, because they also publish the API on 3000
      # with nothing in front of it, and there a hop count would trust the client itself. If you
      # point the browser at THIS proxy instead (API_BASE_URL=.../api) and stop publishing 3000,
      # set TRUST_PROXY=1 in the API's env file — otherwise every client shares nginx's address and
      # therefore one rate-limit bucket, and X-Forwarded-Proto is ignored.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header CF-Connecting-IP "";
    }
  }
}
