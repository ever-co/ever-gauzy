user  nginx;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  #gzip  on;

  upstream api {
    server ${API_HOST}:${API_PORT};
  }

  server {
    listen 4200;

    location / {
      root /srv/gauzy;
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://api;

      # The API derives req.ip - and therefore the rate-limit bucket - from these headers, so this
      # proxy has to own them. Assigning (not appending) $remote_addr discards anything the client
      # sent, and blanking CF-Connecting-IP stops a client forging the Cloudflare header
      # (GHSA-86mw-2crg-vmhc). Run the API with TRUST_PROXY=1 behind this.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header CF-Connecting-IP "";
    }
  }
}
