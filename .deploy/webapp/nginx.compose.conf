user  nginx;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  #gzip  on;

  upstream api {
    server ${API_HOST}:${API_PORT};
  }

  server {
    listen 4200;

    root /srv/gauzy;

    location ^~ /assets/ {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location ~* \.(?:js|css)$ {
      add_header Cache-Control "no-cache" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
    }

    location ^~ /api/ {
      proxy_pass http://api;

      # The API derives req.ip - and therefore the rate-limit bucket - from these headers, so this
      # proxy has to own them. Assigning (not appending) $remote_addr discards anything the client
      # sent, and blanking CF-Connecting-IP stops a client forging the Cloudflare header
      # (GHSA-86mw-2crg-vmhc).
      #
      # The shipped compose files set TRUST_PROXY=false, because they also publish the API on 3000
      # with nothing in front of it, and there a hop count would trust the client itself. If you
      # point the browser at THIS proxy instead (API_BASE_URL=.../api) and stop publishing 3000,
      # set TRUST_PROXY=1 in the API's env file — otherwise every client shares nginx's address and
      # therefore one rate-limit bucket, and X-Forwarded-Proto is ignored.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header CF-Connecting-IP "";
    }
  }
}
