user nginx;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  # `map $uri $bundle_cache_control`, written by the entrypoint after it substituted the environment
  # values into the bundles (see entrypoint.prod.sh / entrypoint.compose.sh).
  include /etc/nginx/conf.d/runtime-config-bundles.conf;

  # Compress text responses: the Angular bundles are several MB and shipped uncompressed before
  # (neither this nginx nor the ingress compressed anything). Already-compressed formats (woff2,
  # images) are left alone; `gzip_proxied any` covers responses proxied from the API as well.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/manifest+json image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

  server {
    listen 4200;

    root /srv/gauzy;

    location ^~ /assets/ {      
      try_files $uri =404;
    }
    
    # The build names every bundle and stylesheet with a content hash (main-XXXXXXXX.js,
    # styles-XXXXXXXX.css): a changed file has a new name, so these can be kept for a year — except the
    # bundles the entrypoint rewrites with environment values at container start, whose bytes change
    # while their name does not. index.html (never cached, below) is what points at the current names.
    location ~* "^/[^/]+[.-][0-9a-z]{8,}\.(js|css)$" {
      try_files $uri =404;
      # Not `always`: a bundle missing during a rolling deploy answers 404, and that must not be cached.
      # The value comes from the map the entrypoint generates (runtime-config-bundles.conf): a bundle the
      # entrypoint rewrote with environment values is revalidated on every load, the others are immutable.
      add_header Cache-Control $bundle_cache_control;
    }

    # index.html names the current build's hashed bundles: never serve it from a cache, or a browser/CDN
    # mixes an old index (or old unhashed chunks) with a new deploy and the app fails to start.
    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate" always;
    }
    
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
